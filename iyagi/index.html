<!doctype html><html lang="ko" class="ap ap-iyagi"><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<script>window.VFM_APP="iyagi";</script>
<script src="../assets/claude-shim.js"></script>
<script src="../assets/deck.js"></script>
<link rel="manifest" href="../manifest.webmanifest"><meta name="theme-color" content="#0C6E77"><link rel="apple-touch-icon" href="../assets/icon-192.png">

<title>이야기 도서관</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="../assets/apple.css">
<style>
/* Layout: 한 줄 독서 기둥(최대 680px). 첫 화면은 카드가 아니라 바로 읽히는 본문. 장서 카드식 서지 정보 + 읽는 깊이를 '책 두께'로 표시 */
:root{
  --paper:#ECE9E1; --sheet:#F5F3EE; --hush:#E0DBCF;
  --ink:#1D1A17; --ink-2:#5C564D; --rule:#CBC4B6;
  --seal:#B0352B; --on-seal:#FBF6F1; --scrim:rgba(20,16,12,.42);
  --f-disp:"Song Myung","Noto Serif KR","AppleMyungjo","Batang",serif;
  --f-read:"Noto Serif KR","AppleMyungjo","Batang",serif;
  --f-ui:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --read:18px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#161513; --sheet:#1E1C19; --hush:#26231F;
  --ink:#E8E2D5; --ink-2:#A39B8D; --rule:#3A362F;
  --seal:#E2705F; --on-seal:#1B0F0C; --scrim:rgba(0,0,0,.6); color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#161513; --sheet:#1E1C19; --hush:#26231F;
  --ink:#E8E2D5; --ink-2:#A39B8D; --rule:#3A362F;
  --seal:#E2705F; --on-seal:#1B0F0C; --scrim:rgba(0,0,0,.6); color-scheme:dark}

html{-webkit-text-size-adjust:100%}
[hidden]{display:none!important}
body{background:var(--paper);color:var(--ink);font-family:var(--f-ui);font-size:15px;line-height:1.6;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:0 calc(88px + env(safe-area-inset-bottom,0px));word-break:keep-all;overflow-wrap:break-word}
@media (min-width:760px){body{padding-block:0 56px}}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--seal);outline-offset:3px}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.wrap{max-width:680px;margin:0 auto}

/* header */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:20px 6px}
.logo{display:flex;align-items:center;gap:10px;background:none;border:0;padding:0;cursor:pointer;font-family:var(--f-disp);font-size:24px;color:var(--ink)}
.seal{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:3px;background:var(--seal);color:var(--on-seal);font-family:var(--f-disp);font-size:16px;line-height:1}
.topnav{display:none;gap:2px}
.topnav button{background:none;border:0;padding:8px 12px;border-radius:999px;cursor:pointer;color:var(--ink-2);font-size:14px}
.topnav button[aria-current="page"]{color:var(--ink);font-weight:600;background:var(--hush)}
.searchbtn{background:none;border:1px solid var(--rule);border-radius:999px;padding:7px 12px;cursor:pointer;color:var(--ink-2);font-size:13.5px;display:flex;gap:6px;align-items:center}
.right{display:flex;gap:8px;align-items:center}
@media (min-width:760px){.topnav{display:flex}.tabbar{display:none!important}}

/* type */
.tagline{font-family:var(--f-read);color:var(--ink-2);font-size:14.5px;margin:18px 0 0}
.eyebrow{font-size:12.5px;letter-spacing:.06em;color:var(--seal);font-weight:600;margin:0}
.kicker{font-size:13px;color:var(--ink-2);display:flex;flex-wrap:wrap;gap:4px 8px;margin:10px 0 0}
h1.title{font-family:var(--f-disp);font-weight:400;font-size:clamp(32px,8.4vw,46px);line-height:1.2;margin:8px 0 4px;text-wrap:balance}
.orig{color:var(--ink-2);font-size:14px;margin:0}
.ph{font-family:var(--f-disp);font-weight:400;font-size:34px;margin:22px 0 4px}
.sub{color:var(--ink-2);margin:0;font-family:var(--f-read)}
h2.sec{font-size:13px;letter-spacing:.06em;color:var(--ink-2);font-weight:600;margin:0 0 12px;display:flex;justify-content:space-between;gap:8px;align-items:baseline}
section.block{margin-top:48px}
.warn{font-size:13px;color:var(--ink-2);border-left:2px solid var(--seal);padding:2px 0 2px 10px;margin:14px 0 0}

/* reading */
.prose{display:grid;gap:1.05em;margin-top:22px;max-width:34em}
.prose p{font-family:var(--f-read);font-size:var(--read);line-height:1.9;margin:0}
.spoil{margin-top:4px;background:var(--hush);border:1px dashed var(--rule);padding:16px;display:grid;gap:12px}
.spoil p{font-family:var(--f-ui)!important;font-size:14px!important;line-height:1.6!important;color:var(--ink-2)}
.endwrap{display:grid;gap:1.05em;padding-top:14px;border-top:1px solid var(--rule)}
.endlabel{font-family:var(--f-ui)!important;font-size:12.5px!important;letter-spacing:.06em;color:var(--seal);font-weight:600}
.dlg{display:grid;gap:14px;margin-top:22px;max-width:34em}
.ln{display:grid;grid-template-columns:5.6em 1fr;gap:12px;align-items:baseline;animation:rise .35s ease both}
.ln b{font-size:13px;font-weight:600;color:var(--ink-2);text-align:right}
.ln.me b{color:var(--seal)}
.ln span{font-family:var(--f-read);font-size:var(--read);line-height:1.75;min-width:0}
.ln.narr{grid-template-columns:1fr;padding-left:calc(5.6em + 12px)}
.ln.narr span{color:var(--ink-2);font-size:calc(var(--read) - 2px)}
@media (max-width:420px){.ln{grid-template-columns:4.6em 1fr}.ln.narr{padding-left:0}}
@keyframes rise{from{opacity:.2;transform:translateY(4px)}to{opacity:1;transform:none}}
.dctl{margin-top:16px;align-items:center}
.cnt{font-size:12.5px;color:var(--ink-2);font-variant-numeric:tabular-nums}

/* catalog card */
.catalog{margin:18px 0 0;border-top:3px double var(--rule);border-bottom:1px solid var(--rule);display:grid;grid-template-columns:5.4em 1fr;gap:6px 12px;padding-block:12px;font-size:13.5px}
.catalog dt{color:var(--ink-2)}
.catalog dd{margin:0;min-width:0}
.basis{display:inline-block;font-size:12px;padding:0 7px;border:1px solid var(--ink-2);border-radius:2px;margin-right:6px;color:var(--ink)}

/* depth tabs */
.depths{display:flex;margin-top:26px;border-bottom:1px solid var(--rule);overflow-x:auto;scrollbar-width:none;scroll-margin-top:16px}
.depths::-webkit-scrollbar{display:none}
.depths button{flex:1 0 auto;background:none;border:0;border-bottom:2px solid transparent;margin-bottom:-1px;padding:10px 12px;display:grid;justify-items:start;gap:5px;color:var(--ink-2);font-size:14px;cursor:pointer;text-align:left}
.depths button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--ink);font-weight:600}
.depths small{font-size:11.5px;font-weight:400;color:var(--ink-2);font-variant-numeric:tabular-nums}
.stack{display:grid;gap:2px;width:24px}
.stack i{display:block;height:2px;background:var(--rule)}
.depths button[aria-selected="true"] .stack i{background:var(--seal)}

.resume{margin-top:18px;padding:12px 14px;background:var(--sheet);border:1px solid var(--rule);font-size:14px;display:flex;gap:8px 12px;flex-wrap:wrap;align-items:center;justify-content:space-between}

/* after reading */
.after{margin-top:30px;display:grid;gap:12px}
.check{display:inline-flex;align-items:center;gap:9px;background:none;border:0;color:var(--ink-2);font-size:14px;cursor:pointer;padding:4px 0;justify-self:start}
.check .box{width:18px;height:18px;border:1.5px solid var(--ink-2);border-radius:2px;display:grid;place-items:center;font-size:12px;line-height:1}
.check[aria-pressed="true"]{color:var(--ink)}
.check[aria-pressed="true"] .box{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.row{display:flex;flex-wrap:wrap;gap:8px}
.btn{font-size:15px;font-weight:500;padding:11px 18px;border-radius:999px;border:1px solid var(--rule);background:transparent;color:var(--ink);cursor:pointer}
.btn.primary{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.btn.saved{border-color:var(--seal);color:var(--seal)}
.link{background:none;border:0;padding:4px 0;font-size:14px;font-weight:600;color:var(--ink);cursor:pointer;text-decoration:underline;text-underline-offset:4px;text-decoration-thickness:1px}
a.link{display:inline-block}
.link.quiet{color:var(--ink-2);font-weight:500}
.link.on{color:var(--seal)}

/* parts & beyond */
.parts{margin-top:34px}
details.part{border-top:1px solid var(--rule)}
details.part:last-child{border-bottom:1px solid var(--rule)}
details.part summary{cursor:pointer;padding:13px 0;font-weight:600;list-style:none;display:flex;justify-content:space-between;gap:12px}
details.part summary::-webkit-details-marker{display:none}
details.part summary::after{content:"+";color:var(--ink-2);font-weight:400}
details.part[open] summary::after{content:"−"}
details.part p{font-family:var(--f-read);font-size:calc(var(--read) - 1px);line-height:1.85;margin:0 0 16px;max-width:34em}
.limit{margin-top:26px;padding:14px 16px;border:1px solid var(--seal);display:grid;gap:4px;max-width:34em}
.limit strong{color:var(--seal);font-size:12.5px;letter-spacing:.06em}
.limit span{font-family:var(--f-read);font-size:15px;line-height:1.75}
.bsec{display:grid;gap:6px;max-width:34em}
.bsec h3{font-size:15px;font-weight:600;margin:0}
.bsec p{font-family:var(--f-read);font-size:calc(var(--read) - 1px);line-height:1.85;margin:0}
.beyond{display:grid;gap:28px;margin-top:24px}
.srclist{margin:0;padding:0;list-style:none;display:grid;gap:8px;font-size:14px}
.srclist li{padding-left:14px;position:relative}
.srclist li::before{content:"";position:absolute;left:0;top:.7em;width:6px;height:1px;background:var(--ink-2)}
.srclist a{color:var(--ink)}
.stamp{font-size:12.5px;color:var(--ink-2);margin-top:6px}

/* next stories */
.nexts{display:grid}
.nx{display:grid;gap:4px;text-align:left;background:none;border:0;border-top:1px solid var(--rule);padding:16px 0;cursor:pointer;color:var(--ink)}
.nx:last-child{border-bottom:1px solid var(--rule)}
.nxt{font-size:12px;letter-spacing:.06em;font-weight:600;color:var(--seal)}
.nxn{font-family:var(--f-disp);font-size:21px;line-height:1.3}
.nxw{font-family:var(--f-read);font-size:15px;line-height:1.7;color:var(--ink-2)}
.nxr{font-size:12px;color:var(--ink-2)}

/* lists */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font-size:14px;padding:8px 14px;border-radius:999px;border:1px solid var(--rule);background:var(--sheet);color:var(--ink);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.list{display:grid}
.card{display:grid;gap:6px;padding-block:18px;border-top:1px solid var(--rule)}
.card:last-child{border-bottom:1px solid var(--rule)}
.card h3{margin:0;font-weight:400}
.tbtn{background:none;border:0;padding:0;text-align:left;cursor:pointer;font-family:var(--f-disp);font-size:22px;line-height:1.3;color:var(--ink)}
.hook{font-family:var(--f-read);font-size:15.5px;line-height:1.75;color:var(--ink-2);margin:0}
.meta{font-size:12.5px;color:var(--ink-2);display:flex;flex-wrap:wrap;gap:3px 8px;align-items:center}
.lvl{font-size:11.5px;color:var(--seal);border:1px solid currentColor;padding:0 6px;border-radius:2px}
.acts{display:flex;gap:18px}
.mini{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;align-items:baseline;text-align:left;background:none;border:0;border-top:1px solid var(--rule);padding:14px 0;cursor:pointer;color:var(--ink);width:100%}
.mini:last-child{border-bottom:1px solid var(--rule)}
.mini .no{font-family:var(--f-disp);font-size:15px;color:var(--seal);grid-row:span 2}
.mini .mt{font-family:var(--f-disp);font-size:19px}
.mini .md{font-size:13px;color:var(--ink-2)}
.trip{padding:18px;background:var(--sheet);border:1px solid var(--rule)}
.trip p{margin:0 0 10px;font-family:var(--f-read);color:var(--ink-2)}

.search{width:100%;font-size:16px;padding:12px 14px;border:1px solid var(--rule);border-radius:8px;background:var(--sheet);color:var(--ink);margin-top:18px}
.facet{display:grid;gap:8px;margin-top:22px}
.facet > span{font-size:12.5px;color:var(--ink-2);font-weight:600;letter-spacing:.04em}
.qs{display:grid}
.qbtn{text-align:left;background:none;border:0;border-top:1px solid var(--rule);padding:12px 0;cursor:pointer;font-family:var(--f-read);font-size:16px;color:var(--ink);display:flex;justify-content:space-between;gap:10px}
.qbtn:last-child{border-bottom:1px solid var(--rule)}
.qbtn[aria-pressed="true"]{color:var(--seal)}
.count{font-size:13px;color:var(--ink-2);margin:28px 0 4px}
.empty{padding:18px;background:var(--sheet);border:1px solid var(--rule);font-size:14.5px}

.ledger{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border-top:3px double var(--rule);border-bottom:1px solid var(--rule);margin-top:18px}
.ledger div{padding:12px 4px;display:grid;gap:2px}
.ledger b{font-family:var(--f-disp);font-weight:400;font-size:26px;font-variant-numeric:tabular-nums}
.ledger span{font-size:12.5px;color:var(--ink-2)}
.metrow{display:flex;justify-content:space-between;gap:12px;align-items:center;border-top:1px solid var(--rule);padding:12px 0}
.metrow:last-child{border-bottom:1px solid var(--rule)}
.metrow .t{display:grid;gap:2px;min-width:0}
.metrow .t button{background:none;border:0;padding:0;text-align:left;cursor:pointer;font-family:var(--f-disp);font-size:18px;color:var(--ink)}
.note{font-size:12.5px;color:var(--ink-2)}

.foot{margin-top:60px;font-size:12.5px;color:var(--ink-2);border-top:1px solid var(--rule);padding-top:14px}
.rtools{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:10px}
.fs{display:flex;gap:4px}
.fs button{background:none;border:1px solid var(--rule);border-radius:999px;padding:4px 11px;cursor:pointer;color:var(--ink-2);font-size:13px}

/* bars */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--paper);border-top:1px solid var(--rule);display:flex;justify-content:center;
  padding:6px max(16px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.tabbar button{flex:1;max-width:160px;background:none;border:0;font-size:12.5px;color:var(--ink-2);padding:6px 0;display:grid;justify-items:center;gap:3px;cursor:pointer}
.tabbar button[aria-current="page"]{color:var(--ink);font-weight:600}
.tabbar svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.6}
.sheet{position:fixed;inset:0;z-index:40;background:var(--scrim);display:grid;align-items:end}
.panel{background:var(--sheet);max-width:680px;width:100%;margin:0 auto;border-radius:14px 14px 0 0;display:grid;gap:12px;
  padding:20px max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));box-sizing:border-box}
.panel h2{margin:0;font-family:var(--f-disp);font-weight:400;font-size:22px}
.pick{text-align:left;background:var(--paper);border:1px solid var(--rule);border-radius:8px;padding:14px;display:grid;gap:4px;cursor:pointer;color:var(--ink)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(86px + env(safe-area-inset-bottom,0px));z-index:50;background:var(--ink);color:var(--paper);padding:9px 16px 9px 10px;border-radius:999px;font-size:14px;display:flex;gap:8px;align-items:center;white-space:nowrap}
.toast .seal{width:22px;height:22px;font-size:12px}
@media (min-width:760px){.toast{bottom:28px}}
.robotag{font-size:11px;color:var(--ink-2);border:1px dashed var(--ink-2);padding:0 6px;border-radius:2px;margin-left:4px;white-space:nowrap}
.robot-line{font-size:13px;color:var(--ink-2);display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:0}
.rdot{width:8px;height:8px;border-radius:50%;background:var(--ink-2);display:inline-block;flex:none}
.rdot.on{background:var(--seal);animation:pulse 1.2s ease-in-out infinite}
.rdot.off{background:transparent;border:1px solid var(--ink-2)}
@keyframes pulse{50%{opacity:.25}}
.feeditem{margin-top:56px;padding-top:22px;border-top:3px double var(--rule)}
.ftitle{font-family:var(--f-disp);font-weight:400;font-size:clamp(26px,6.6vw,34px);line-height:1.25;margin:8px 0 4px;text-wrap:balance}
#feed-tail{margin-top:40px;display:grid;gap:14px}
.robotbox{margin-top:18px;padding:14px 16px;border:1px solid var(--rule);background:var(--sheet);display:grid;gap:8px}
.lane{margin-top:44px;display:grid;gap:12px}
.lanehead{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.laneno{font-size:12.5px;letter-spacing:.06em;font-weight:600;color:var(--seal)}
.lane h2{font-family:var(--f-disp);font-weight:400;font-size:28px;margin:0}
.rule{font-family:var(--f-read);margin:0;line-height:1.8;max-width:34em}
.now{font-size:13.5px;margin:0;padding:9px 12px;border-left:2px solid var(--ink);background:var(--sheet)}
.pipe{list-style:none;margin:0;padding:0;counter-reset:p}
.pipe li{counter-increment:p;display:grid;grid-template-columns:2.2em 1fr;gap:10px;padding:12px 0;border-top:1px solid var(--rule)}
.pipe li::before{content:counter(p);font-family:var(--f-disp);font-size:18px;color:var(--seal)}
.pipe li:last-child{border-bottom:1px solid var(--rule)}
.pipe b{display:block;font-weight:600;margin-bottom:2px}
.pipe span{font-size:13.5px;color:var(--ink-2)}
.btn:disabled,.pick:disabled{opacity:.45;cursor:default}
.card.has-thumb{grid-template-columns:64px minmax(0,1fr);column-gap:14px;align-items:start}
.cbody{display:grid;gap:6px;min-width:0}
.thumb svg{width:64px;height:86px;display:block;border-radius:3px;box-shadow:0 1px 0 var(--rule)}
.art{margin:18px 0 0;display:grid;gap:6px}
.art img,.art svg{display:block;width:100%;max-width:100%;height:auto;border-radius:4px}
.art img{aspect-ratio:16/10}
.art.cov svg{aspect-ratio:320/140}
.art figcaption{font-size:11.5px;color:var(--ink-2)}
.thumb{position:relative;overflow:hidden}.thumb .wth{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.wtbox{position:relative}.wtbox .wtp{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:var(--paper,#f3efe6);border-radius:4px}
.wtf.wt-none .wtc,.wtf:has(.wtbox.wt-none) .wtc{display:none}
img[data-wt]{visibility:hidden}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .art img{filter:brightness(.9)}}
:root[data-theme="dark"] .art img{filter:brightness(.9)}
.litem{margin-top:52px;padding-top:22px;border-top:3px double var(--rule)}
#litems .litem:first-child{margin-top:26px}
.lmeta{color:var(--ink-2);font-weight:500}
.deeper{margin-top:26px;padding-top:14px;border-top:1px dashed var(--rule)}
.lact{margin-top:26px}
#ltail{margin-top:40px;display:grid;gap:12px}
.lhead2{margin:10px 0 2px}
.shelves{display:flex;gap:8px;overflow-x:auto;padding:4px 0 10px;margin:16px 0 2px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.shelves::-webkit-scrollbar{display:none}
.shelves .chip{flex:none;white-space:nowrap}.shelves small{opacity:.6;margin-left:2px;font-size:12px}
.hbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:8px 0 4px}

<script>
/* ───────── 이야기 데이터 (시범 10편) ───────── */
const SEED=[
{id:"orpheus",title:"뒤를 돌아본 노래꾼",orig:"오르페우스와 에우리디케",group:"신화와 전승",kind:"신화",region:"그리스",era:"고대 · 로마 시대 문헌으로 전함",basis:"전승",form:"축약 재화 · 오비디우스 판본 기준",mood:["비극적인","기묘한"],tags:["사랑","금기","저승","음악","귀환"],
hook:"단 한 가지 약속만 지키면 아내를 데리고 돌아갈 수 있었습니다. 출구가 가까워질수록, 그는 뒤에서 아무 소리도 들리지 않는 것이 두려워졌습니다.",
depths:{
d1:{min:1,body:[
"오르페우스는 노래로 짐승과 나무까지 움직였다는 시인이었습니다. 결혼한 지 얼마 되지 않아 아내 에우리디케가 뱀에 물려 죽자, 그는 산 사람은 갈 수 없는 저승으로 내려갔습니다.",
"그의 노래를 들은 저승의 왕과 왕비는 아내를 돌려주기로 했습니다. 조건은 하나, 땅 위에 닿을 때까지 뒤를 돌아보지 말 것.",
"출구가 거의 가까워졌을 무렵, 아내가 잘 따라오는지 불안해진 오르페우스는 그만 뒤를 돌아봤습니다. 에우리디케는 그 자리에서 다시 어둠 속으로 사라졌고, 그는 두 번째로 아내를 잃었습니다."]},
d2:{min:4,body:[
"오르페우스는 트라키아의 시인으로, 음악의 여신 칼리오페의 아들이라고 전합니다. 그가 리라를 타며 노래하면 사나운 짐승이 얌전해지고 나무들이 그에게 다가왔다고 합니다.",
"에우리디케는 혼인한 지 얼마 되지 않아 풀밭을 걷다 뱀에게 발목을 물려 숨졌습니다. 오르페우스는 땅 위에서 실컷 슬퍼한 뒤, 저승 입구로 알려진 타이나론의 문을 지나 아래로 내려갔습니다.",
"저승에서 그는 하데스와 페르세포네 앞에서 노래했습니다. 아내가 너무 이르게 떠났으니, 언젠가는 어차피 이곳에 올 사람을 잠시만 빌려 달라는 노래였습니다. 노래를 들은 망령들이 울었고, 벌을 받던 죄인들까지 잠시 고통을 잊었다고 합니다.",
"허락에는 조건이 붙었습니다. 저승의 골짜기를 벗어날 때까지 뒤를 돌아봐서는 안 된다는 것이었습니다. 두 사람은 말없이 가파르고 어두운 길을 올랐습니다.",
"땅이 머지않은 곳에서 오르페우스는 아내가 지쳐 뒤처질까 두려웠고, 또 아내를 보고 싶었습니다. 그가 고개를 돌리자 에우리디케는 겨우 들릴 만한 작별 인사를 남기고 뒤로 미끄러져 사라졌습니다. 다시 저승으로 가려던 그를 뱃사공은 태워 주지 않았습니다."]},
d3:{min:8,body:[
"오르페우스가 에우리디케와 혼인하던 날, 혼인의 신 휘메나이오스가 찾아왔지만 그가 든 횃불은 타오르지 않고 매운 연기만 피워 올렸습니다. 오비디우스는 이것을 불길한 징조로 적었습니다. 얼마 뒤 에우리디케는 물의 요정들과 풀밭을 거닐다 뱀에게 발목을 물려 숨을 거두었습니다.",
"오르페우스는 하늘 아래에서 실컷 울고 난 뒤, 그것으로는 모자라 저승으로 내려가기로 했습니다. 그는 타이나론의 문을 지나, 장례를 치르고 내려온 망령들 사이를 걸어 하데스와 페르세포네의 왕좌 앞에 섰습니다.",
"그는 리라를 타며 노래했습니다. 저승을 구경하러 온 것도, 머리 셋 달린 개를 묶으러 온 것도 아니라고. 아내가 너무 일찍 떠났으니, 언젠가 어차피 이곳의 것이 될 사람을 잠시 빌려 달라고. 그마저 허락되지 않는다면 자기도 돌아가지 않겠다고 했습니다.",
"노래가 이어지는 동안 핏기 없는 망령들이 울었습니다. 탄탈로스는 달아나는 물을 쫓던 손을 멈추었고, 익시온의 바퀴는 돌기를 멈추었으며, 시시포스는 자기 바위 위에 걸터앉았습니다. 복수의 여신들의 뺨이 그때 처음 눈물에 젖었다고 합니다.",
"왕과 왕비는 거절하지 못했습니다. 새로 온 망령들 사이에서 불려 나온 에우리디케는 상처 때문에 아직 느린 걸음이었습니다. 오르페우스는 아내와 함께 조건도 받았습니다. 저승의 골짜기를 벗어나기 전에 뒤를 돌아보면, 이 선물은 없던 일이 된다는 것이었습니다.",
"두 사람은 소리 없는 길을 올랐습니다. 길은 가파르고 어두웠으며 짙은 안개가 끼어 있었습니다. 땅의 가장자리가 멀지 않았을 때, 오르페우스는 아내가 지칠까 두려웠고 아내를 보고 싶었습니다. 그는 돌아보았습니다.",
"에우리디케는 곧바로 뒤로 미끄러져 내려갔습니다. 그는 팔을 뻗었지만 손에 잡힌 것은 흩어지는 공기뿐이었습니다. 두 번째로 죽어 가면서도 그녀는 남편을 탓하지 않았습니다. 사랑받았다는 것 말고 무엇을 원망할 수 있겠느냐고 오비디우스는 씁니다. 그녀는 귀에 거의 닿지 않는 작별 인사를 남기고 사라졌습니다.",
"오르페우스는 다시 강을 건너려 했지만 뱃사공 카론이 막았습니다. 그는 이레 동안 먹지도 않고 강가에 앉아 있었습니다. 세월이 흐른 뒤 그는 트라키아의 광란한 여인들에게 죽임을 당했고, 그의 머리와 리라는 헤브로스강을 따라 흘러가면서도 슬픈 소리를 냈다고 합니다. 망령이 되어 저승에 내려간 그는 에우리디케를 찾아 안았습니다. 이제 두 사람은 나란히 걷기도 하고, 그가 앞서 걸으며 마음 놓고 아내를 돌아보기도 한다고 오비디우스는 이야기를 맺습니다."]}},
parts:[
{t:"그는 왜 뒤를 돌아봤을까",b:"오비디우스는 두 가지 이유를 적습니다. 아내가 지칠까 하는 두려움, 그리고 보고 싶은 마음입니다. 그보다 먼저 이 이야기를 쓴 베르길리우스는 갑작스러운 광기가 그를 사로잡았다고 하면서, 저승이 용서할 줄 안다면 용서받을 만한 실수였다고 덧붙였습니다."},
{t:"등장인물",b:"오르페우스는 트라키아의 시인이자 리라 연주자입니다. 에우리디케는 그의 아내로, 물의 요정으로 그려지는 경우가 많습니다. 하데스와 페르세포네는 저승의 왕과 왕비, 카론은 저승의 강을 건네주는 뱃사공입니다."}],
beyond:[
{t:"가장 널리 알려진 기록",b:"오늘날 널리 알려진 줄거리는 로마 시인 베르길리우스의 『농경시』 4권(기원전 29년경)과 오비디우스의 『변신 이야기』 10~11권(기원후 8년경)에서 나옵니다. 이 재화는 오비디우스를 기준으로 했습니다. 베르길리우스 판에서 에우리디케는 양치기 아리스타이오스를 피해 달아나다 뱀을 밟습니다."},
{t:"다른 결말들",b:"플라톤의 『향연』에는 신들이 오르페우스에게 진짜 아내가 아닌 환영만 보여 주었다는 이야기가 나옵니다. 사랑을 위해 죽을 용기 없이 살아서 저승에 들어왔기 때문이라는 설명입니다. 1762년 글루크의 오페라 〈오르페오와 에우리디체〉에서는 사랑의 신이 에우리디케를 되살려 주며 행복하게 끝납니다."},
{t:"닮은 이야기들",b:"일본 『고사기』의 이자나기는 죽은 아내를 찾아 저승에 갔다가, 보지 말라는 모습을 보고 달아납니다. 성경의 롯의 아내는 뒤돌아보지 말라는 말을 어기고 소금 기둥이 됩니다. 모두 ‘보지 말 것’이라는 금기가 나오지만, 서로 영향을 주고받았는지는 확인되지 않았습니다."}],
sources:[{t:"오비디우스, 『변신 이야기』 10권·11권"},{t:"베르길리우스, 『농경시』 4권"},{t:"플라톤, 『향연』 (파이드로스의 연설)"}],
links:[
{id:"seonnyeo",type:"다른 곳에서",rel:"편집자의 비교",why:"다른 세계로 떠난 아내, 그리고 지키지 못한 단 하나의 약속. 한국 옛이야기에도 같은 모양의 금기가 있습니다."},
{id:"shackleton",type:"다른 시선으로",rel:"편집자의 비교",why:"어둡고 얼어붙은 곳에서 모두를 데리고 돌아오려 한 실제 사람의 이야기입니다."},
{id:"last-leaf",type:"다른 시선으로",rel:"편집자의 비교",why:"노래가 저승을 움직였듯, 그림 하나로 죽음 앞의 사람을 붙잡으려 한 늙은 화가가 있습니다."}]},

{id:"seonnyeo",title:"날개옷을 숨긴 나무꾼",orig:"선녀와 나무꾼",group:"신화와 전승",kind:"설화",region:"한국",era:"오래된 구전 · 20세기에 채록",basis:"전승",form:"축약 재화 · 수탉 유래형 기준",mood:["기묘한","씁쓸한"],tags:["금기","그리움","가족","하늘","날개옷"],
hook:"사슴은 은혜를 갚으며 한 가지를 당부했습니다. 아이 셋을 낳기 전에는 절대 날개옷을 돌려주지 말라고.",
depths:{
d1:{min:1,body:[
"가난한 나무꾼이 사냥꾼에게 쫓기던 사슴을 숨겨 주었습니다. 사슴은 보답으로 선녀들이 목욕하는 연못을 알려 주며, 날개옷을 감추되 아이 셋을 낳기 전에는 돌려주지 말라고 했습니다.",
"날개옷을 잃은 선녀는 하늘로 돌아가지 못하고 나무꾼의 아내가 되었습니다. 그러나 아이 둘을 낳았을 때 나무꾼이 마음을 놓고 날개옷을 보여 주자, 선녀는 두 아이를 양팔에 안고 하늘로 날아갔습니다.",
"나무꾼은 두레박을 타고 하늘에 올라가 가족을 다시 만났지만, 땅에 두고 온 어머니가 그리웠습니다. 말에서 내리지 말라는 당부를 지키지 못한 그는 땅에 홀로 남았고, 수탉이 되어 지붕 위에서 하늘을 보며 울었다고 합니다."]},
d2:{min:4,body:[
"옛날 금강산 기슭에 홀어머니를 모시고 사는 가난한 나무꾼이 있었습니다. 어느 날 사냥꾼에게 쫓기던 사슴이 뛰어들자, 나무꾼은 나뭇짐 속에 사슴을 숨겨 주고 사냥꾼에게는 엉뚱한 쪽을 가리켰습니다.",
"살아난 사슴은 산속 연못에 하늘의 선녀들이 목욕하러 내려온다고 알려 주었습니다. 날개옷 하나를 감추면 그 선녀는 하늘로 돌아가지 못할 것이니, 아이 셋을 낳기 전에는 절대 옷을 보여 주지 말라고 했습니다.",
"말대로 날개옷을 잃은 선녀는 언니들이 떠난 뒤 홀로 남았고, 나무꾼의 아내가 되었습니다. 두 사람은 아이 둘을 낳고 살았습니다. 어느 날 선녀가 날개옷을 한 번만 보고 싶다고 하자, 아이가 둘이나 있으니 괜찮겠지 싶었던 나무꾼은 감춰 둔 옷을 꺼내 주었습니다.",
"날개옷을 입은 선녀는 아이 하나씩을 양팔에 안고 하늘로 올라갔습니다. 다시 나타난 사슴은 그 뒤로 선녀들이 연못에 내려오지 않고 두레박으로 물을 길어 올린다고 알려 주었습니다. 나무꾼은 그 두레박을 타고 하늘에 올라 아내와 아이들을 다시 만났습니다.",
"하늘에서 지내던 나무꾼은 홀로 남은 어머니가 걱정되었습니다. 선녀는 하늘의 말을 내주며 절대 말에서 내려 땅을 밟지 말라고 했습니다. 어머니는 아들이 좋아하던 호박죽을 끓여 내왔고, 말 위에서 받던 뜨거운 죽이 말 등에 쏟아졌습니다. 놀란 말은 나무꾼을 떨어뜨리고 혼자 하늘로 올라가 버렸습니다. 땅에 남은 나무꾼은 하늘만 바라보다 죽어 수탉이 되었고, 그래서 수탉은 지붕에 올라 하늘을 보고 운다고 합니다."]}},
parts:[
{t:"왜 하필 ‘아이 셋’이었을까",b:"여러 각편에서 이유가 직접 나옵니다. 아이가 셋이면 두 팔로 다 안고 날 수 없으니 떠나지 못한다는 것입니다. 나무꾼은 아이가 둘일 때 옷을 보여 주었고, 선녀는 양팔에 하나씩 안고 떠났습니다."},
{t:"나무꾼은 왜 말에서 떨어졌나",b:"어머니가 끓여 준 죽 때문입니다. 판본에 따라 호박죽이나 팥죽으로 전합니다. 뜨거운 죽이 말 등에 쏟아지자 놀란 말이 나무꾼을 떨어뜨리고 하늘로 올라가 버립니다."}],
beyond:[
{t:"결말이 하나가 아닙니다",b:"이 이야기는 전국 곳곳에서 많은 각편(채록된 하나하나의 이야기)으로 전해졌습니다. 연구자들은 결말에 따라 크게 나눕니다. 선녀가 아이들과 하늘로 떠나며 끝나는 ‘선녀 승천형’, 나무꾼이 하늘에 올라가 가족과 함께 사는 ‘나무꾼 승천형’, 이 재화처럼 나무꾼이 땅으로 떨어져 수탉이 되는 ‘수탉 유래형’입니다. 하늘에서 장인의 시험을 이겨 내는 변형도 있습니다."},
{t:"세계의 날개옷 이야기",b:"날개옷을 감춰 하늘의 여인을 아내로 삼는 이야기는 세계 여러 곳에 있습니다. 4세기 중국의 『수신기』에는 깃털 옷을 입은 여인의 옷을 감춘 남자 이야기가 실려 있고, 일본에는 ‘하고로모(날개옷)’ 전설이, 유럽에는 백조 처녀 이야기가 전합니다. 연구자들은 이런 이야기를 묶어 ‘백조 처녀 설화’라고 부릅니다."},
{t:"오늘의 독자가 던지는 질문",b:"예전에는 효심과 그리움의 이야기로 많이 읽혔지만, 요즘은 날개옷을 감춘 일을 어떻게 봐야 하느냐고 묻는 독자도 많습니다. 하늘로 돌아갈 길을 잃은 선녀의 자리에서 다시 읽으면 전혀 다른 이야기가 됩니다. 이것은 원래 이야기에 담긴 내용이 아니라 오늘의 해석입니다."}],
sources:[{t:"한국민족문화대백과사전 ‘나무꾼과 선녀’ 항목",u:"https://encykorea.aks.ac.kr/"},{t:"한국학중앙연구원, 『한국구비문학대계』"},{t:"간보, 『수신기』"}],
links:[
{id:"orpheus",type:"다른 곳에서",rel:"편집자의 비교",why:"그리스 신화에서는 남편이 아내를 찾아 저승까지 내려갑니다. 그곳에도 금기는 하나뿐입니다."},
{id:"kimseondal",type:"더 깊이",rel:"같은 문화권",why:"같은 한국 옛이야기지만, 이번에는 웃음으로 세상을 골려 주는 사람이 주인공입니다."},
{id:"coffee-kaldi",type:"다른 시선으로",rel:"편집자의 비교",why:"사슴이 나무꾼에게 길을 알려 주었듯, 염소가 사람에게 한 열매를 알려 주었다는 이야기입니다."}]},

{id:"kimseondal",title:"대동강 물을 판 사나이",orig:"봉이 김선달",group:"웃음과 말",kind:"재담",region:"한국",era:"조선 후기 (전승)",basis:"전승",form:"축약 재화",mood:["웃긴","통쾌한"],tags:["꾀","사기","풍자","평양","장사"],
hook:"주인 없는 강물을 사겠다는 사람들이 나타났습니다. 물장수들이 한 사람 앞에서 엽전을 한 닢씩 던지고 지나가는 것을 보았기 때문입니다.",
depths:{
d1:{min:1,body:[
"평양에 김선달이라는 꾀 많은 사람이 살았습니다. 그는 한양에서 장사하러 온 상인들이 욕심이 많다는 소문을 듣고 꾀를 냈습니다.",
"그는 대동강 물을 길어 나르는 물장수들에게 미리 엽전을 나눠 주고, 물을 지고 지나갈 때마다 자기에게 한 닢씩 던져 달라고 부탁했습니다. 이 모습을 본 상인들은 김선달이 대동강의 주인이라고 믿었습니다.",
"상인들은 조르고 졸라 큰돈을 주고 강물을 샀습니다. 다음 날 그들이 물장수에게 물값을 달라고 하자, 돌아온 것은 웃음뿐이었습니다."]},
d2:{min:3,body:[
"‘선달’은 과거에 합격하고도 아직 벼슬을 받지 못한 사람을 부르던 말입니다. 김선달은 벼슬길이 막히자 세상을 떠돌며 욕심 많은 사람과 거드름 피우는 사람을 골려 주었다고 전합니다.",
"한양 상인들이 평양에 왔다는 말을 들은 김선달은 대동강 나루로 나가 물장수들에게 술을 사고 엽전을 나눠 주었습니다. 내일부터 물을 지고 지나갈 때마다 이 돈을 한 닢씩 자기에게 던져 달라는 부탁이었습니다.",
"다음 날 그는 강가에 앉아 물장수들이 던지는 엽전을 거만하게 받았습니다. 깜빡하고 그냥 지나가는 물장수에게는 호통까지 쳤습니다. 이 모습을 본 상인들은 대동강 물을 길으려면 김선달에게 돈을 내야 하는 줄 알았습니다.",
"상인들이 강물을 팔라고 조르자 김선달은 조상 대대로 물려받은 것이라며 한참을 버텼습니다. 값은 점점 올라갔고, 그는 못 이기는 척 큰돈을 받고 문서까지 써 주었습니다. 이야기에 따라 그 값은 수천 냥으로 전해집니다.",
"다음 날 상인들은 물장수들에게 물값을 내라고 했습니다. 물장수들은 강물에 주인이 어디 있느냐며 웃었고, 김선달은 이미 평양을 떠난 뒤였습니다."]}},
parts:[
{t:"‘봉이’라는 별명은 어디서 왔나",b:"장터에서 닭을 파는 장수에게 김선달이 일부러 이게 봉황이냐고 물었습니다. 장수가 그렇다고 하자 그는 닭값의 몇 배를 주고 사서 고을 원님에게 봉황이라며 바쳤습니다. 화가 난 원님이 그를 벌하자, 김선달은 자기를 속인 것은 닭 장수라고 하소연했고, 결국 닭 장수에게서 닭값보다 훨씬 많은 돈을 물려받았습니다. 이때부터 ‘봉이’ 김선달로 불렸다고 합니다. 이 일화도 전하는 사람마다 세부가 다릅니다."}],
beyond:[
{t:"실존 인물이었을까",b:"김선달은 조선 후기 평양 사람으로 전하지만, 실존 여부나 생몰 연도는 확인되지 않습니다. 여러 곳에서 나온 꾀 많은 이야기들이 한 이름 아래 모였을 가능성이 큽니다."},
{t:"웃음이 향하는 곳",b:"김선달에게 당하는 사람은 대개 욕심 많은 상인, 거드름 피우는 양반이나 관리입니다. 듣는 사람들은 속이는 기술보다, 힘 있는 쪽이 망신당하는 장면에서 크게 웃었습니다."},
{t:"오늘의 김선달",b:"‘봉이 김선달’은 지금도 남의 것이나 주인 없는 것을 팔아 이익을 챙기는 사람을 빗댈 때 쓰는 말입니다. 2016년에는 같은 이름의 영화가 나왔습니다."}],
sources:[{t:"한국민족문화대백과사전 ‘김선달’ 관련 항목",u:"https://encykorea.aks.ac.kr/"},{t:"한국학중앙연구원, 『한국구비문학대계』"}],
links:[
{id:"hodja",type:"다른 곳에서",rel:"유사한 주제",why:"튀르키예에도 꾀와 말장난으로 사람들을 웃기고 골려 준 인물이 있습니다."},
{id:"seonnyeo",type:"더 깊이",rel:"같은 문화권",why:"같은 땅에서 전해 온, 웃음 대신 그리움이 남는 옛이야기입니다."},
{id:"fox-grapes",type:"다른 시선으로",rel:"편집자의 비교",why:"김선달은 말로 남을 속였고, 이 여우는 말로 자기를 달랩니다."}]},

{id:"hodja",title:"설교하지 않은 설교",orig:"나스레딘 호자의 금요 설교",group:"웃음과 말",kind:"우스개",region:"튀르키예",era:"13세기 무렵 (전승)",basis:"전승",form:"대화형 재화",mood:["웃긴"],tags:["말장난","반복과 반전","재치","설교"],dialogue:true,
hook:"마을 사람들이 그의 설교를 들으러 모였습니다. 그는 단상에 올라 딱 한 가지를 물었습니다.",
depths:{
d1:{min:1,body:[
{n:1,t:"어느 금요일, 마을 사람들이 호자의 설교를 들으러 모였습니다. 호자는 준비한 것이 하나도 없었습니다."},
{w:"호자",t:"여러분, 제가 오늘 무슨 이야기를 할지 아십니까?"},
{w:"사람들",t:"모릅니다."},
{w:"호자",t:"모르시는 분들께 제가 무슨 말을 하겠습니까?"},
{n:1,t:"호자는 그대로 단상에서 내려와 집으로 갔습니다. 다음 금요일, 사람들은 미리 대답을 맞춰 두었습니다."},
{w:"호자",t:"제가 오늘 무슨 이야기를 할지 아십니까?"},
{w:"사람들",t:"압니다!"},
{w:"호자",t:"이미 아신다니, 제가 굳이 말할 필요가 없겠군요."},
{n:1,t:"호자는 또 내려갔습니다. 그다음 금요일, 사람들은 이번에는 반으로 나뉘어 대답하기로 했습니다."},
{w:"호자",t:"제가 오늘 무슨 이야기를 할지 아십니까?"},
{w:"절반",t:"압니다!"},
{w:"나머지 절반",t:"모릅니다!"},
{w:"호자",t:"좋습니다. 그럼 아시는 분들이 모르시는 분들께 알려 드리세요."},
{n:1,t:"그러고는 세 번째에도 단상에서 내려왔습니다."}]},
d2:{min:2,body:[
"같은 사람의 이야기를 두 편 더 들려드리겠습니다. 이웃에게 큰 솥을 빌린 호자는 며칠 뒤 솥 안에 작은 냄비 하나를 넣어 돌려주었습니다. 이게 뭐냐고 묻는 이웃에게 호자는 솥이 새끼를 낳았다고 했습니다. 이웃은 웃으며 냄비까지 받았습니다.",
"얼마 뒤 호자는 또 솥을 빌렸고, 이번에는 한참이 지나도 돌려주지 않았습니다. 이웃이 찾아오자 호자는 안타까운 얼굴로 솥이 죽었다고 했습니다. 솥이 어떻게 죽느냐고 따지는 이웃에게 호자는 되물었습니다. 새끼를 낳는다는 건 믿으면서, 죽는다는 건 왜 못 믿으십니까?",
"또 한 번은 허름한 차림으로 잔치에 갔다가 아무에게도 대접받지 못했습니다. 호자는 집에 가서 좋은 외투를 입고 돌아왔고, 그제야 사람들은 그를 윗자리에 앉히고 음식을 권했습니다. 호자는 외투 소매를 국그릇에 담그며 말했습니다. 먹어라, 외투야. 대접받는 건 네가 아니냐."]}},
parts:[],
beyond:[
{t:"호자는 누구인가",b:"나스레딘 호자는 13세기 무렵 아나톨리아(지금의 튀르키예)에 살았다고 전하는 인물입니다. ‘호자’는 이슬람 학교의 선생이나 성직자를 높여 부르던 말입니다. 튀르키예 악셰히르에는 그의 무덤으로 전해지는 곳이 있지만, 실제 생애를 알려 주는 기록은 거의 없습니다."},
{t:"여러 나라의 같은 얼굴",b:"그의 우스개는 이란, 아랍 세계, 중앙아시아, 발칸반도까지 퍼졌습니다. 지역에 따라 몰라 나스레딘, 아판디 같은 이름으로 불리고, 아랍의 꾀쟁이 주하처럼 비슷한 인물과 이야기가 섞이기도 했습니다."},
{t:"웃음의 구조",b:"설교 이야기는 같은 질문을 세 번 반복하고, 대답이 바뀔 때마다 호자가 빠져나갈 길을 찾아냅니다. 이번에는 꼼짝 못 하겠지 하는 순간 가장 그럴듯한 핑계가 나옵니다. 그래서 이 이야기는 한 줄씩 읽을 때 더 웃깁니다."}],
sources:[{t:"나스레딘 호자 일화집 (튀르키예 구전, 여러 판본)"},{t:"악셰히르 나스레딘 호자 무덤 (전승지)"}],

{id:"last-leaf",type:"다른 시선으로",rel:"편집자의 비교",why:"호자의 이야기가 세 번째에 뒤집히듯, 마지막 장면에서 모든 것이 뒤집히는 단편입니다."}]},

{id:"last-leaf",title:"담벼락의 마지막 잎",orig:"마지막 잎새 (The Last Leaf) · 오 헨리",group:"소설과 창작",kind:"단편소설",region:"미국",era:"1907년 발표",basis:"창작",form:"줄거리 재화 · 원작은 공공 영역",mood:["따뜻한","비극적인"],tags:["우정","희망","예술","반전","병"],spoiler:true,warn:"병과 죽음이 나옵니다.",
hook:"폐렴으로 누운 존시는 창밖 담쟁이 잎을 세고 있었습니다. 마지막 잎이 떨어지면 자기도 떠나리라 믿으면서.",
depths:{
d1:{min:1,body:[
"뉴욕의 가난한 화가 동네에 사는 존시가 폐렴에 걸렸습니다. 의사는 그녀가 살려는 마음을 잃어서 더 위험하다고 했고, 존시는 창밖 벽돌담의 담쟁이 잎이 다 떨어지면 자기도 죽을 거라고 믿었습니다.",
"친구 수는 아래층에 사는 늙은 화가 베어먼에게 이 이야기를 합니다. 평생 걸작을 그리겠다고 말만 하던 그는 어리석은 소리라며 화를 냅니다.",
{e:1,t:"비바람이 몰아친 밤이 지나도 잎 하나가 담에 남아 있었습니다. 그 잎을 보며 존시는 다시 살아 보기로 합니다. 그러나 그 잎은 베어먼이 폭풍우 속에서 담에 그려 넣은 것이었고, 그는 그날 밤 얻은 폐렴으로 며칠 뒤 숨을 거두었습니다."}]},
d2:{min:4,body:[
"뉴욕 그리니치빌리지, 화가들이 모여 사는 낡은 벽돌 건물 꼭대기 층에서 수와 존시가 함께 작업실을 꾸리고 살았습니다. 그해 11월, 동네를 휩쓴 폐렴이 존시에게도 찾아왔습니다.",
"의사는 수를 따로 불러, 존시가 나을 가능성은 열에 하나쯤이고 그것도 본인이 살고 싶어 해야 한다고 했습니다. 존시가 겨울옷 소매 유행이라도 물어본다면 가능성이 다섯에 하나로 늘 거라는 말도 덧붙였습니다.",
"그날 수는 존시가 창밖을 보며 거꾸로 숫자를 세는 소리를 듣습니다. 열둘, 열하나, 열. 마주 보이는 벽돌담을 타고 오른 늙은 담쟁이덩굴의 잎이었습니다. 존시는 마지막 잎이 떨어지면 자기도 가게 될 거라고 담담하게 말했습니다.",
"수는 아래층의 베어먼을 찾아갑니다. 예순이 넘은 그는 40년 동안 그림을 그렸지만 성공하지 못했고, 언젠가 걸작을 그리겠다는 말만 되풀이하며 지냈습니다. 존시 이야기를 들은 그는 그런 바보 같은 생각이 어디 있느냐며 화를 냈습니다.",
{e:1,t:"밤새 비바람이 몰아쳤는데도 다음 날 아침 담에는 잎 하나가 남아 있었습니다. 다음 날 밤이 지나도 그대로였습니다. 존시는 그 잎을 보며 죽기를 바랐던 자신이 부끄럽다고 말하고, 수프를 달라고 하고, 언젠가 나폴리만을 그리고 싶다고 했습니다."},
{e:1,t:"존시가 고비를 넘긴 날 오후, 수는 베어먼이 폐렴으로 병원에서 숨졌다고 전합니다. 그가 앓기 시작한 날 아침, 관리인은 옷과 신발이 흠뻑 젖은 그를 발견했습니다. 곁에는 아직 불이 켜진 등불과 사다리, 흩어진 붓, 초록과 노랑 물감을 섞은 팔레트가 있었습니다. 마지막 잎이 떨어진 그 밤, 그가 담에 잎을 그린 것이었습니다. 수는 그것이 베어먼의 걸작이라고 말합니다."}]}},
parts:[
{t:"그리니치빌리지는 어떤 곳인가",b:"뉴욕 맨해튼 남쪽의 동네로, 20세기 초 집세가 싼 낡은 건물에 가난한 화가와 작가들이 모여 살았습니다. 소설도 이 동네의 엉킨 골목을 묘사하며 시작합니다."}],
beyond:[
{t:"오 헨리",b:"오 헨리는 미국 작가 윌리엄 시드니 포터(1862~1910)의 필명입니다. 약사, 은행원, 기자 등으로 일했고, 뉴욕의 평범한 사람들을 주인공으로 한 짧은 이야기를 수백 편 남겼습니다. 마지막 장면에서 상황을 뒤집는 그의 방식은 ‘오 헨리식 결말’이라고 불립니다."},
{t:"작품 정보",b:"〈마지막 잎새〉는 1907년 단편집 『다듬은 등불(The Trimmed Lamp)』에 실렸습니다. 원제 The Last Leaf는 ‘마지막 잎’에 가깝지만, 한국에서는 ‘마지막 잎새’라는 제목으로 오래 읽혀 왔습니다."}],
original:{t:"저작권 보호 기간이 끝난 공공 영역 작품이라, 영어 원문을 무료 전자책 도서관에서 읽을 수 있습니다.",u:"https://www.gutenberg.org/ebooks/search/?query=The+Trimmed+Lamp",label:"구텐베르크 프로젝트에서 원문 찾기"},
sources:[{t:"O. Henry, “The Last Leaf”, 『The Trimmed Lamp』 (1907)"}],
links:[
{id:"van-gogh",type:"다른 시선으로",rel:"편집자의 비교",why:"평생 인정받지 못한 화가는 소설 속에만 있지 않았습니다. 실제 화가의 삶입니다."},
{id:"orpheus",type:"다른 곳에서",rel:"편집자의 비교",why:"예술로 죽음을 거슬러 보려 한, 가장 오래된 이야기 가운데 하나입니다."},
{id:"shackleton",type:"다른 시선으로",rel:"편집자의 비교",why:"버틸 이유 하나가 사람을 살린다는 것을, 이번에는 실제 기록으로 만납니다."}]},

{id:"jang-yeongsil",title:"가마가 부서진 날",orig:"장영실",group:"사람의 생애",kind:"인물 일화",region:"한국",era:"15세기 조선",basis:"기록",form:"생애 재구성 · 『세종실록』 기준",mood:["통쾌한","씁쓸한"],tags:["신분","발명","시계","몰락","세종"],
hook:"관청의 노비로 태어난 사람이 임금의 시계를 만들었습니다. 그리고 어느 날, 그는 기록에서 사라졌습니다.",
depths:{
d1:{min:1,body:[
"장영실은 동래현(지금의 부산 지역) 관청에 딸린 노비였습니다. 손재주가 뛰어나 궁궐에 불려 왔고, 세종은 그에게 벼슬을 주어 천문 기구와 시계를 만들게 했습니다.",
"그는 1434년 스스로 시각을 알리는 물시계 자격루를 완성했고, 이후로도 여러 과학 기구를 만드는 데 참여했습니다.",
"그러나 1442년, 그가 감독해 만든 임금의 가마가 부서지는 일이 일어났습니다. 그는 벌을 받고 관직에서 물러났고, 그 뒤의 삶은 기록에 남아 있지 않습니다."]},
d2:{min:4,body:[
"장영실이 언제 태어났는지는 알려져 있지 않습니다. 『세종실록』에는 그의 아버지가 원나라 소주·항주 지방 사람이고, 어머니는 동래현의 기생이었다고 적혀 있습니다. 어머니의 신분을 따라 그도 관청의 노비가 되었습니다.",
"그의 솜씨는 태종 때부터 궁궐에 알려졌습니다. 세종은 그에게 상의원(임금의 옷과 궁중 물건을 만들던 관청)의 별좌라는 벼슬을 주려 했고, 노비 출신에게 벼슬을 줄 수 없다는 반대를 넘어 뜻을 이루었습니다.",
"장영실은 천문 관측 기구를 만드는 일에 참여했고, 1434년 자격루를 완성했습니다. 사람이 지키지 않아도 정해진 시각이 되면 나무 인형이 종과 북, 징을 쳐서 시간을 알렸습니다. 같은 해 금속활자 갑인자를 만드는 일에도 참여했고, 1438년에는 해와 계절의 움직임을 보여 주는 옥루를 만들었습니다.",
"공이 쌓이며 그는 대호군(종3품의 무관 벼슬)까지 올랐습니다. 그러나 1442년, 그가 감독해 만든 임금의 가마 ‘안여’가 튼튼하지 못해 부서졌습니다. 그는 조사를 받고 벌을 받은 뒤 파직되었습니다.",
"실록에서 장영실의 이름은 이 사건 무렵을 끝으로 더 나오지 않습니다."]},
d3:{min:7,body:[
"조선의 법에서 노비의 신분은 어머니를 따랐습니다. 동래현 관청에 딸린 기생의 아들이었던 장영실은 태어나면서부터 관청의 노비였습니다. 그의 이름이 처음 궁궐에 알려진 것은 태종 때였습니다.",
"훗날 세종은 신하들 앞에서 그를 이렇게 회고했습니다. 영실은 솜씨만 좋은 것이 아니라 성품과 머리도 뛰어나, 아버지 태종께서도 그를 아끼셨다는 것입니다.",
"실록에 남은 세종의 회고에 따르면, 그에게 상의원 별좌 벼슬을 주는 문제를 두고 신하들의 의견이 갈렸습니다. 이조판서 허조는 관청 노비에게 벼슬을 줄 수 없다고 반대했고, 병조판서 조말생은 이런 사람이라면 맡길 만하다고 했습니다. 세종은 다시 대신들에게 의견을 물은 끝에 벼슬을 주었습니다.",
"1432년부터 경복궁에서는 해와 별을 관측하는 기구들을 만드는 큰 사업이 벌어졌고, 장영실은 그 일의 실무를 맡았습니다. 그 가운데 그가 가장 공들인 것이 자격루였습니다. 1434년 여름, 경복궁 보루각에 놓인 자격루가 처음으로 스스로 시각을 알렸습니다. 세종은 그의 공을 크게 칭찬하며 벼슬을 높여 주었습니다.",
"같은 해 그는 금속활자 갑인자를 주조하는 일에 참여했고, 1438년에는 경복궁 흠경각에 옥루를 만들었습니다. 옥루는 물의 힘으로 해가 움직이고 계절에 따라 풍경이 바뀌는 모습을 보여 주는 장치였습니다.",
"1442년 봄, 그가 감독해 만든 임금의 가마 ‘안여’가 튼튼하지 못해 부서졌습니다. 그는 죄인을 다루던 의금부로 넘겨져 조사를 받았고, 함께 일한 관원들과 함께 벌을 받았습니다. 그리고 관직에서 물러났습니다.",
"이후 실록에서 장영실의 이름은 다시 나오지 않습니다."]}},
limit:"가마 사건 이후 장영실이 어떻게 살았는지, 언제 태어나 언제 세상을 떠났는지는 기록으로 확인되지 않습니다. 그가 왜 다시 등용되지 않았는지에 대한 여러 이야기는 모두 후대의 추측입니다.",
parts:[
{t:"자격루는 어떻게 움직였나",b:"큰 물그릇에서 작은 물그릇으로 물이 일정하게 흘러내리면, 길쭉한 물받이 통에 물이 차면서 떠 있는 잣대가 조금씩 올라갑니다. 잣대가 정해진 높이에 닿을 때마다 작은 구슬을 건드리고, 구슬이 굴러 큰 쇠구슬을 움직이면 그것이 인형의 팔을 쳐서 종과 북, 징이 울렸습니다. 사람이 밤새 물시계를 지켜보지 않아도 시각을 알 수 있게 된 것입니다."},
{t:"측우기도 장영실이 만들었을까",b:"흔히 장영실의 발명품으로 소개되지만, 『세종실록』의 1441년 기록은 세자(훗날의 문종)가 그릇에 빗물을 받아 양을 재는 방법을 시험했다고 전합니다. 이듬해 측우기 제도가 정해졌습니다. 장영실이 여기에 참여했는지는 실록으로 확인되지 않습니다."}],
beyond:[
{t:"지금 남아 있는 자격루",b:"세종 때 만든 자격루는 남아 있지 않습니다. 1536년 중종 때 다시 만든 자격루의 물그릇 일부가 전해져 국보로 지정되었고, 국립고궁박물관에서 볼 수 있습니다. 2007년에는 기록을 바탕으로 세종 때의 자격루를 작동하는 모습으로 되살렸습니다."},
{t:"드라마와 영화 속 장영실",b:"그가 세종과 깊은 우정을 나누었다거나, 가마 사건이 누군가의 음모였다는 이야기는 소설과 드라마, 영화가 만든 상상입니다. 2019년 영화 〈천문: 하늘에 묻는다〉도 그런 상상 위에 지어진 작품입니다."}],
sources:[{t:"『조선왕조실록』 세종실록",u:"https://sillok.history.go.kr/"},{t:"국립고궁박물관 자격루 소장품 정보"}],
links:[

{id:"van-gogh",title:"편지로 남은 화가",orig:"빈센트 반 고흐",group:"창작과 도전",kind:"창작자의 생애",region:"네덜란드·프랑스",era:"1853–1890",basis:"기록 · 일부 논쟁",form:"생애 재구성 · 편지와 기록 기준",mood:["씁쓸한","따뜻한"],tags:["화가","형제","실패","편지","재평가"],warn:"정신 질환과 죽음에 대한 언급이 있습니다.",
hook:"그는 스물일곱 살에야 그림을 그리기로 마음먹었습니다. 그리고 십 년 동안, 동생에게 수백 통의 편지를 썼습니다.",
depths:{
d1:{min:1,body:[
"빈센트 반 고흐는 화랑 직원, 교사, 전도사 일을 거친 뒤 스물일곱 살에 화가가 되기로 했습니다. 그때부터 세상을 떠날 때까지 약 10년 동안 860점이 넘는 유화를 그렸습니다.",
"살아 있는 동안 그의 그림은 거의 팔리지 않았고, 생활비는 미술품 거래상으로 일하던 동생 테오가 보내 주었습니다. 형은 그림과 함께 편지를 보내 무엇을 그리고 있는지, 왜 그렇게 그리는지를 적었습니다.",
"그는 1890년 서른일곱 살에 세상을 떠났고, 테오도 반년 뒤 숨졌습니다. 테오의 아내 요가 그림과 편지를 지키고 알린 덕분에, 그는 오늘날 가장 사랑받는 화가 가운데 한 사람이 되었습니다."]},
d2:{min:5,body:[
"빈센트는 1853년 네덜란드 남부의 목사 집안에서 태어났습니다. 미술품을 파는 화랑에서 일하다 그만두었고, 영국에서 교사로, 벨기에 탄광 지대에서 전도사로 일했지만 어느 일도 오래가지 못했습니다. 1880년, 스물일곱의 그는 화가가 되기로 했습니다.",
"처음 그가 그리고 싶었던 것은 가난하게 일하는 사람들의 삶이었습니다. 1885년의 〈감자 먹는 사람들〉은 등불 아래 감자를 나눠 먹는 농부 가족을 어둡고 무거운 색으로 그린 그림입니다.",
"1886년 파리로 간 그는 인상파 화가들의 그림과 일본 목판화를 보며 색이 눈에 띄게 밝아졌습니다. 1888년에는 남프랑스 아를로 옮겨 노란 집을 빌리고, 화가들이 함께 사는 작업실을 꿈꾸며 폴 고갱을 불렀습니다.",
"고갱과 함께한 두 달은 다툼으로 끝났습니다. 1888년 12월 그는 발작 끝에 자기 귀의 일부를 잘랐고, 발작이 되풀이되자 이듬해 생레미의 요양원에 스스로 들어갔습니다. 〈별이 빛나는 밤〉은 그곳 병실 창밖 풍경을 바탕으로 그린 그림입니다.",
"1890년 초, 브뤼셀 전시에 나간 〈붉은 포도밭〉이 팔렸고, 한 비평가가 그의 그림을 높이 평가하는 글을 썼습니다. 그해 봄 파리 근교 오베르쉬르우아즈로 옮긴 그는 두 달 남짓 동안 70점이 넘는 그림을 그렸습니다. 7월 말, 그는 총상을 입고 이틀 뒤 숨을 거두었습니다.",
"테오는 반년 뒤 세상을 떠났습니다. 테오의 아내 요 반고흐봉어르는 남은 그림을 전시하고, 형제가 주고받은 편지를 정리해 1914년 책으로 펴냈습니다. 사람들이 고흐를 그림과 함께 그가 남긴 말로도 기억하게 된 것은 이 편지들 덕분입니다."]}},
parts:[
{t:"정말 단 한 점만 팔았을까",b:"‘살아서 단 한 점을 팔았다’는 말이 널리 알려져 있습니다. 판매가 분명히 확인되는 대표적인 그림은 〈붉은 포도밭〉이지만, 그 밖에도 작은 그림이나 소묘를 팔거나 그림을 물건과 바꾼 기록이 있다는 연구가 있습니다. ‘단 한 점’은 확인된 사실이라기보다 이야기를 극적으로 만든 표현에 가깝습니다."},
{t:"편지에 남은 것",b:"그가 쓴 편지는 800통이 넘게 남아 있고, 그 대부분은 테오에게 보낸 것입니다. 그는 지금 그리는 그림을 스케치해 넣고, 어떤 색을 왜 썼는지, 무엇이 잘 안 되는지를 적었습니다."}],
beyond:[
{t:"기록과 이야기 사이",b:"고흐의 삶은 ‘귀를 자른 천재’라는 짧은 이야기로 자주 줄어듭니다. 그러나 편지 속의 그는 색과 구도를 끈질기게 공부하고, 돈과 건강을 걱정하고, 동생에게 기대어 사는 것을 미안해하는 사람이었습니다."},
{t:"죽음에 대한 논쟁",b:"그가 스스로 총을 쏜 것으로 보는 것이 오랫동안 받아들여진 견해입니다. 2011년 출간된 전기에서 다른 사람에 의한 사고였을 가능성이 제기되었지만, 많은 연구자는 이 주장을 받아들이지 않습니다."},
{t:"직접 읽어 보기",b:"반 고흐 미술관은 그의 편지를 원문, 번역, 해설과 함께 온라인으로 공개하고 있습니다."}],
sources:[{t:"반 고흐 미술관, 『빈센트 반 고흐 편지』 온라인판",u:"https://vangoghletters.org/"},{t:"반 고흐 미술관 소장품 정보",u:"https://www.vangoghmuseum.nl/"}],

{id:"jang-yeongsil",type:"다른 시선으로",rel:"편집자의 비교",why:"솜씨 하나로 신분을 넘었지만 마지막 기록이 끊긴 조선의 기술자입니다."},

{id:"fox-grapes",title:"신 포도",orig:"여우와 포도 · 이솝 우화",group:"신화와 전승",kind:"우화",region:"그리스",era:"고대 (전승)",basis:"전승",form:"축약 재화",mood:["웃긴","씁쓸한"],tags:["핑계","자존심","욕망","말"],
hook:"여우는 높이 매달린 포도를 향해 몇 번이고 뛰어올랐습니다. 그리고 돌아서면서 한마디를 남겼습니다.",
depths:{
d1:{min:1,body:[
"배고픈 여우가 포도밭을 지나다 높은 덩굴에 매달린 잘 익은 포도송이를 보았습니다.",
"여우는 몇 번이고 뛰어올랐지만 포도에 닿지 않았습니다.",
"결국 여우는 돌아서며 말했습니다. 어차피 저건 시어서 못 먹을 포도야."]},
d2:{min:2,body:[
"이솝 우화로 전하는 이야기는 대개 이 정도로 짧습니다. 끝에는 제 힘이 모자라 얻지 못한 것을 두고 상황 탓을 하는 사람들이 있다는 교훈이 붙습니다.",
"17세기 프랑스 시인 라 퐁텐도 이 이야기를 시로 다시 썼습니다. 그의 여우는 가스코뉴 출신, 혹은 노르망디 출신이라고 소개됩니다. 여우는 포도가 아직 덜 익어 하인들이나 먹을 것이라 말하고 돌아섭니다.",
"그런데 라 퐁텐은 마지막 줄에서, 투덜대는 것보다는 그편이 낫지 않으냐고 묻습니다. 같은 장면이 이솝에게는 핑계였고, 라 퐁텐에게는 체면을 지키는 방법이기도 했던 셈입니다."]}},
parts:[],
beyond:[
{t:"이솝은 누구인가",b:"이솝(아이소포스)은 기원전 6세기 그리스에서 살았던 노예 출신 이야기꾼으로 전하지만, 생애 대부분은 전설에 가깝습니다. 그의 이름으로 전하는 우화는 여러 시대에 걸쳐 모이고 다듬어졌습니다. 연구자들이 쓰는 페리 색인에서 이 이야기는 15번입니다."},
{t:"말이 된 이야기",b:"영어의 ‘sour grapes’, 한국어의 ‘신 포도’는 이 우화에서 나온 표현입니다. 심리학에서는 1957년 레온 페스팅어가 정리한 ‘인지 부조화’를 설명할 때 자주 이 이야기를 예로 듭니다. 인지 부조화는 원하는 것과 현실이 어긋날 때, 생각을 바꿔서라도 그 불편함을 줄이려는 마음의 움직임을 말합니다."}],
sources:[{t:"이솝 우화 (페리 색인 15번)"},{t:"라 퐁텐, 『우화』 3권 11편 「여우와 포도」 (1668)"}],
links:[

{id:"van-gogh",type:"다른 시선으로",rel:"편집자의 비교",why:"닿지 않는 인정을 향해 십 년 동안 계속 뛰어오른 사람의 이야기입니다."},
{id:"kimseondal",type:"다른 곳에서",rel:"편집자의 비교",why:"여우는 자기를 속였고, 김선달은 남을 속였습니다."}]},

{id:"coffee-kaldi",title:"춤추는 염소들",orig:"칼디와 커피의 전설",group:"생활과 문화",kind:"유래담",region:"에티오피아·예멘",era:"전설은 연대 미상 · 커피 기록은 15세기",basis:"전승 + 기록",form:"유래담과 확인된 역사",mood:["기묘한","따뜻한"],tags:["음식","커피","기원","수도자","염소"],
hook:"염소들이 밤새 잠들지 않고 뛰어다녔습니다. 목동은 염소들이 먹은 빨간 열매를 따라 맛보기로 했습니다.",
depths:{
d1:{min:1,body:[
"에티오피아 고원의 염소지기 칼디는 어느 날 염소들이 이상할 만큼 들떠 뛰어다니는 것을 보았습니다. 염소들은 어떤 나무의 빨간 열매를 먹은 뒤였습니다.",
"칼디가 직접 열매를 먹어 보니 몸이 가볍고 잠이 달아났습니다. 이야기는 이 열매가 수도자들에게 전해져, 밤 기도 동안 깨어 있게 해 주는 음료가 되었다고 전합니다.",
"다만 이 전설이 글로 처음 확인되는 것은 1671년 유럽의 책입니다. 사람들이 커피를 마셨다는 믿을 만한 가장 이른 기록은 15세기 예멘의 수피 수도자들에게서 나옵니다."]},
d2:{min:3,body:[
"전해지는 이야기에서 칼디는 염소들이 밤새 잠들지 않고 뛰노는 것을 보고 열매를 맛보았습니다. 기분이 들뜬 그는 열매를 가까운 수도원으로 가져갔습니다.",
"그다음은 판본에 따라 갈립니다. 수도원장이 열매로 음료를 만들어 밤 기도 시간에 졸지 않게 되었다는 이야기도 있고, 악마의 열매라며 불에 던졌다가 볶이는 향기에 마음을 바꿨다는 이야기도 있습니다. 불에서 건진 열매를 물에 넣은 것이 첫 커피였다는 식입니다.",
"예멘에도 다른 기원 이야기가 있습니다. 수피 수도자 알리 이븐 우마르 알샤질리가 커피를 처음 마셨다거나 널리 알렸다는 이야기로, 커피 항구로 이름난 모카와 함께 자주 언급됩니다.",
"전설은 이처럼 여럿이지만, 어느 쪽도 실제 있었던 일로 확인되지는 않습니다."]}},
limit:"칼디가 실존했는지, 염소 이야기가 언제부터 전해졌는지는 확인되지 않습니다. 확인되는 것은 커피나무의 원산지와 15세기 이후의 음용 기록입니다.",
parts:[
{t:"‘커피’라는 말의 여행",b:"아랍어 ‘카흐와’가 튀르키예어 ‘카흐베’가 되었고, 이것이 유럽 여러 언어로 건너가 커피, 카페가 되었습니다."}],
beyond:[
{t:"기록으로 확인되는 이야기",b:"아라비카 커피나무는 에티오피아 고원에서 자라던 식물입니다. 15세기 중반 예멘의 수피 수도자들이 밤 수행을 위해 커피를 마셨다는 기록이 남아 있고, 이후 메카와 카이로, 이스탄불에 커피하우스가 생겼습니다. 유럽에는 17세기에 본격적으로 퍼졌습니다."},
{t:"전설을 처음 글로 남긴 사람",b:"칼디 이야기를 처음 글로 남긴 사람은 로마에서 활동한 레바논 출신 학자 파우스투스 나이로니(Faustus Nairon)로, 1671년 커피에 관한 라틴어 책에 실었습니다. 이 이야기가 그보다 얼마나 오래되었는지는 알 수 없습니다."}],
sources:[{t:"Faustus Nairon, 『De saluberrima potione Cahue』 (1671)"},{t:"Ralph S. Hattox, 『Coffee and Coffeehouses』 (1985)"}],
links:[
{id:"hodja",type:"다른 곳에서",rel:"같은 지역권",why:"커피가 퍼져 나간 아나톨리아에서 오래 사랑받은 우스개의 주인공입니다."},
{id:"jang-yeongsil",type:"다른 시선으로",rel:"편집자의 비교",why:"발명가와 발견자의 이름은 전설과 기록 사이에서 자주 흔들립니다."},
{id:"seonnyeo",type:"다른 곳에서",rel:"편집자의 비교",why:"짐승이 사람을 새로운 세계로 이끄는 한국의 옛이야기입니다."}]},

{id:"shackleton",title:"얼음에 갇힌 배",orig:"섀클턴과 인듀어런스호",group:"역사와 사건",kind:"탐험 기록",region:"남극",era:"1914–1916",basis:"기록",form:"사건 재구성",mood:["통쾌한","따뜻한"],tags:["생존","탐험","귀환","리더","바다"],
hook:"배는 남극의 얼음에 갇혀 결국 바닷속으로 가라앉았습니다. 도움을 청할 수 있는 곳은 1,000km도 넘게 떨어져 있었습니다.",
depths:{
d1:{min:1,body:[
"1914년, 어니스트 섀클턴은 남극 대륙을 처음으로 걸어서 가로지르겠다며 인듀어런스호를 이끌고 떠났습니다. 그러나 배는 웨들해의 얼음에 갇혔고, 열 달 가까이 떠밀리다 1915년 11월 가라앉았습니다.",
"대원 28명은 얼음 위에서 몇 달을 버틴 뒤 구명보트 세 척으로 무인도인 엘리펀트섬에 닿았습니다. 섀클턴은 다섯 명과 함께 작은 보트로 약 1,300km의 거친 바다를 건너 사우스조지아섬으로 갔고, 산맥을 넘어 고래잡이 기지에 도착했습니다.",
"네 번째 시도 끝에 1916년 8월, 엘리펀트섬에 남아 있던 22명이 모두 구조되었습니다. 대륙 횡단은 실패했지만, 인듀어런스호 대원은 한 명도 목숨을 잃지 않았습니다."]},
d2:{min:5,body:[
"섀클턴의 계획은 남극 대륙을 바다에서 바다까지 걸어서 가로지르는 것이었습니다. 인듀어런스호는 1914년 8월 영국을 떠나, 12월 사우스조지아섬의 고래잡이 기지를 마지막으로 남쪽으로 향했습니다.",
"1915년 1월, 배는 대륙을 코앞에 두고 웨들해의 바다 얼음에 붙잡혔습니다. 대원들은 배 안에서 겨울을 나며 얼음이 풀리기를 기다렸지만, 얼음에 짓눌린 배는 점점 부서졌습니다. 10월 말 그들은 배를 버리고 얼음 위로 나왔고, 11월 21일 배는 가라앉았습니다.",
"대원들은 떠다니는 얼음 위에 천막을 치고 바다표범과 펭귄을 잡아먹으며 버텼습니다. 1916년 4월 얼음이 갈라지자 구명보트 세 척에 나눠 타고 노를 저어, 일주일쯤 뒤 엘리펀트섬에 닿았습니다. 배를 떠난 뒤 처음 밟은 땅이었습니다.",
"그 섬에는 지나가는 배가 없었습니다. 섀클턴은 4월 24일 길이 7m가 안 되는 보트 제임스 커드호에 다섯 명과 함께 올라 사우스조지아섬으로 떠났습니다. 항해사 프랭크 워슬리가 흔들리는 배 위에서 해를 겨우 몇 번 관측해 길을 잡았고, 16일 만에 섬에 닿았습니다.",
"닿은 곳은 고래잡이 기지의 반대편 해안이었습니다. 섀클턴과 워슬리, 톰 크린 세 사람은 제대로 된 지도도 없는 산과 빙하를 36시간 동안 걸어 넘어, 5월 20일 스트롬니스 기지에 도착했습니다.",
"엘리펀트섬의 22명은 뒤집은 보트 두 척 아래에서 넉 달 넘게 기다렸습니다. 섀클턴의 구조 시도는 얼음에 막혀 세 번 실패했고, 8월 30일 칠레 해군의 배 옐초호가 마침내 그들을 모두 태웠습니다."]}},
parts:[
{t:"‘한 명도 잃지 않았다’의 정확한 뜻",b:"이 원정에는 반대편 로스해 쪽에서 보급 기지를 놓던 또 하나의 팀이 있었고, 그 팀에서는 세 명이 목숨을 잃었습니다. 모두 살아 돌아왔다는 말은 인듀어런스호에 탔던 28명에 대한 것입니다."},
{t:"그 유명한 대원 모집 광고",b:"위험한 여행에 함께할 사람을 구한다는 짧은 신문 광고가 섀클턴의 것으로 널리 인용됩니다. 그러나 그 광고가 실제 신문에 실린 원본은 지금까지 찾지 못했습니다. 확인되지 않은 이야기입니다."}],
beyond:[
{t:"바다 밑 3,000m의 배",b:"인듀어런스호는 2022년 3월, 탐사대가 웨들해 수심 약 3,000m에서 찾아냈습니다. 차가운 바다 덕분에 배는 형태가 잘 남아 있었고, 뒤쪽에 적힌 배 이름까지 읽을 수 있었습니다."},
{t:"누가 기록했나",b:"섀클턴은 1919년 원정 기록 『사우스』를 펴냈고, 원정에 함께한 사진가 프랭크 헐리가 얼음에 갇힌 배와 대원들의 모습을 사진과 필름으로 남겼습니다. 여러 대원의 일기도 전합니다."}],

function subscribeDb(){

    db.collection("stories").orderBy("at","desc").limit(1000).onSnapshot(snap=>{
      if(!snap.metadata.fromCache){clearTimeout(t);robot.dbNote="";setTimeout(kickVisit,1200)}

const normName=t=>String(t||"").toLowerCase().replace(/[\s·・,.:;'"“”‘’()（）\[\]「」『』〈〉《》\-–—]/g,"");
function findDup(orig){
  const n=normName(orig);if(!n)return null;
  return STORIES.find(s=>{const m=normName(s.orig);if(!m)return false;if(m===n)return true;return Math.min(m.length,n.length)>=4&&(m.includes(n)||n.includes(m))})||null;
}
function normalizeRobot(o,laneId){
  if(!o||typeof o!=="object"||Array.isArray(o))return null;
  const S=(x,n)=>typeof x==="string"?x.trim().slice(0,n||600):"";
  const P=(x,m)=>Array.isArray(x)?x.map(v=>S(v,900)).filter(Boolean).slice(0,m):[];
  const title=S(o.title,60),orig=S(o.orig,120),d1=P(o.d1,4),d2=P(o.d2,7);
  if(!title||!orig||d1.length<2)return null;
  const sp=o.spoiler===true,d1End=sp?P(o.d1End,2):[],d2End=sp?P(o.d2End,3):[];
  const mins=a=>Math.max(1,Math.round(a.join("").length/450));
  const depths={d1:{min:mins(d1.concat(d1End)),body:d1.concat(d1End.map(t=>({e:1,t})))}};
  if(d2.length>=2)depths.d2={min:Math.max(2,mins(d2.concat(d2End))),body:d2.concat(d2End.map(t=>({e:1,t})))};
  const pairs=(x,m)=>Array.isArray(x)?x.filter(p=>p&&typeof p==="object").map(p=>({t:S(p.t,80),b:S(p.b,1400)})).filter(p=>p.t&&p.b).slice(0,m):[];
  const TYPES=["더 깊이","다른 곳에서","다른 시선으로"],BASIS=["전승","기록","창작","기록 · 일부 논쟁"];
  const links=Array.isArray(o.links)?o.links.filter(l=>l&&byId[S(l.id,60)]).slice(0,3).map(l=>({id:S(l.id,60),type:TYPES.includes(l.type)?l.type:"다른 시선으로",rel:S(l.rel,20)||"편집자의 비교",why:S(l.why,200)})):[];
  return {id:"r-"+Date.now().toString(36)+Math.random().toString(36).slice(2,6),robot:true,at:Date.now(),lane:laneId,
    title,orig,group:GROUPS.includes(o.group)?o.group:"생활과 문화",kind:S(o.kind,20)||"이야기",region:S(o.region,30)||"미상",era:S(o.era,40)||"미상",
    basis:BASIS.includes(o.basis)?o.basis:"전승",form:S(o.form,70)||"축약 재화",
    mood:(Array.isArray(o.mood)?o.mood:[]).filter(m=>MOODS.includes(m)).slice(0,2),tags:P(o.tags,5).map(t=>t.slice(0,16)),
    warn:S(o.warn,140),spoiler:sp&&(d1End.length+d2End.length)>0,hook:S(o.hook,260)||d1[0],depths,
    parts:pairs(o.parts,3),beyond:pairs(o.beyond,4),limit:S(o.limit,400),sources:P(o.sources,5).map(t=>({t:t.slice(0,160)})),links,why:S(o.pick_reason,200),art:cleanArt(o.art)};
}
function buildPrompt(laneId,brief){

[이야기의 범위]
신화·전설·설화·민담·우화, 소설·동화·희곡, 실제 인물의 생애와 일화, 작가·예술가·발명가·크리에이터의 창작 과정, 만담·재담·우스개, 역사적 사건과 탐험, 음식·물건·풍습의 유래. 세계 모든 지역과 시대가 대상입니다.

[반드시 지킬 것]
1. 실제로 전해지거나 기록된 이야기만 고릅니다. 이야기를 새로 지어내지 않습니다.
2. 원전에 없는 대사, 장면, 속마음을 덧붙이지 않습니다. 확실하지 않은 사실은 본문에 쓰지 말고 limit에 확인되지 않는 부분으로 적습니다.

  return({not_granted:"로봇 사용을 허락하지 않으셨어요. 도서관에 있는 이야기로 계속 읽을 수 있어요.",

    capability_disabled:"이 화면에서는 로봇을 쓸 수 없어요.",capability_removed:"이 앱 버전에서는 로봇을 쓸 수 없어요.",
    rate_limited:"로봇이 잠시 쉬어야 해요. 조금 뒤에 다시 눌러 주세요.",session_expired:"다시 로그인한 뒤 눌러 주세요.",

    empty_completion:"로봇이 빈손으로 돌아왔어요. 다시 눌러 주세요.",skip:"확실한 자료가 없어 지어내지 않고 건너뛰었어요."}[code])||"연결이 잠시 끊겼어요. 다시 눌러 주세요.";

async function robotFetch(laneId,brief,opt){
  const silent=!!(opt&&opt.silent);
  if(!sampleFn||robot.busy||robot.state!=="ready")return null;
  robot.busy=true;robot.silent=silent;robot.lane=laneId;robot.got=0;if(!silent)robot.err=null;
  const ctl=new AbortController();robot.ctl=ctl;updateRobotUI();
  try{
    const o=await sampleFn.json(buildPrompt(laneId,brief),{cache:false,signal:ctl.signal,onText:({text})=>{robot.got=text.length;updateRobotUI()}});
    if(o&&o.skip)throw{code:"skip"};
    const s=normalizeRobot(o,laneId);
    if(!s)throw{code:"bad_shape"};
    const dup=findDup(s.orig);if(dup)return dup;
    if(opt&&opt.catId){s.catId=opt.catId;if(CAT[opt.catId])s.shelf=CAT[opt.catId].shelf}
    if(opt&&opt.shelf)s.shelf=opt.shelf;
    addStory(s);robot.count=STORIES.filter(x=>x.robot).length;
    await saveRobot(s);
    if(ui.view!=="today"&&ui.view!=="read"&&ui.view!=="list")rerender();
    return s;
  }catch(e){
    const code=e&&e.code;
    if(["not_granted","sampling_disabled","not_declared","capability_disabled","capability_removed"].includes(code)){robot.state="off";robot.err=errCopy(code)}
    else if(code!=="cancelled"&&!silent)robot.err=errCopy(code);
    return null;
  }finally{robot.busy=false;robot.silent=false;robot.ctl=null;updateRobotUI()}
}
function robotLine(){
  if(robot.state==="wait")return `<span class="rdot"></span><span>로봇 준비 중…</span>`;
  if(robot.state==="off")return `<span class="rdot off"></span><span>${esc(robot.err||"이 이야기는 아직 안 썼어요. 로봇이 매일 새벽 5편씩 채우고 있으니 다른 이야기를 먼저 읽어 주세요.")}</span>`;
  if(robot.busy)return `<span class="rdot on"></span><span>${robot.visit?"오늘의 새 이야기를 쓰는":robot.lane==="cat"?"목록의 다음 이야기를 쓰는":robot.lane==="list"?"새 이야기 5편을 쓰는":robot.lane==="deep"?"자세한 이야기를 쓰는":robot.silent?"다음 이야기를 미리 찾는":"‘"+esc(laneName(robot.lane))+"’ 길에서 이야기를 찾는"} 중${robot.got?` · ${robot.got.toLocaleString()}자 받음`:"…"}</span><button class="link quiet" data-act="stopbot">멈추기</button>`;
  if(robot.err)return `<span class="rdot off"></span><span>${esc(robot.err)}</span>`;
  return `<span class="rdot"></span><span>로봇 대기 중 · 지금까지 ${robot.count}편을 가져왔어요${robot.dbNote?" · "+esc(robot.dbNote):""}</span>`;
}
function updateRobotUI(){
  if(ui.view==="today")renderFeedTail();
  if(ui.view==="list")updateListTail();
  document.querySelectorAll("[data-robot]").forEach(el=>el.innerHTML=robotLine());

}

function stats(){
  const met=Object.keys(store.levels).filter(id=>store.levels[id]>0&&byId[id]).map(id=>byId[id]);
  const gc={},mc={},rs=new Set();
  met.forEach(s=>{gc[s.group]=(gc[s.group]||0)+1;s.mood.forEach(m=>mc[m]=(mc[m]||0)+1);rs.add(s.region)});
  const minG=Math.min(...GROUPS.map(g=>gc[g]||0));
  return{met,gc,mc,rs,least:GROUPS.filter(g=>(gc[g]||0)===minG),
    topG:Object.keys(gc).sort((a,b)=>gc[b]-gc[a]).slice(0,2),topM:Object.keys(mc).sort((a,b)=>mc[b]-mc[a]).slice(0,2)};
}
function anchor(){
  const l=store.last&&byId[store.last.id];if(l)return l;
  const x=store.log.slice().reverse().find(x=>byId[x.id]);return x?byId[x.id]:null;
}
function lanePicks(laneId,exclude,n){
  const st=stats(),ex=exclude||new Set(),fresh=STORIES.filter(s=>lvl(s.id)===0&&!ex.has(s.id));
  let out=[];
  if(laneId==="link"){
    const a=anchor();
    if(a){
      a.links.forEach(l=>{const t=byId[l.id];if(t&&lvl(t.id)===0&&!ex.has(t.id))out.push({s:t,why:`「${a.title}」에서 ${l.type}`})});
      fresh.forEach(s=>{const l=s.links.find(l=>l.id===a.id);if(l&&!out.some(o=>o.s.id===s.id))out.push({s,why:`「${a.title}」와 ${l.rel}`})});
    }
  }else if(laneId==="far"){
    out=fresh.filter(s=>st.least.includes(s.group)&&!st.rs.has(s.region)).map(s=>({s,why:`아직 덜 만난 ‘${s.group}’ · ${s.region}`}));
    if(!out.length)out=fresh.filter(s=>!st.rs.has(s.region)).map(s=>({s,why:`처음 만나는 문화권 · ${s.region}`}));
  }else if(laneId==="taste"){
    if(st.topG.length)out=fresh.filter(s=>st.topG.includes(s.group)||s.mood.some(m=>st.topM.includes(m))).map(s=>({s,why:`즐겨 읽은 ‘${st.topG.includes(s.group)?s.group:s.mood.find(m=>st.topM.includes(m))}’ 쪽`}));
    else out=fresh.filter(s=>s.depths.d1.min<=1&&(s.mood.includes("웃긴")||s.mood.includes("따뜻한"))).map(s=>({s,why:"취향 기록이 아직 없어 짧고 가벼운 이야기"}));
  }else if(laneId==="odd"){
    QUESTIONS.forEach(q=>q.ids.forEach(id=>{const s=byId[id];if(s&&lvl(id)===0&&!ex.has(id)&&!out.some(o=>o.s.id===id))out.push({s,why:`질문: ${q.q}`})}));
  }
  const now=Date.now();out.forEach(o=>o.k=freshScore(o.s,now)-(laneId==="link"?0:0));out.sort((a,b)=>a.k-b.k);
  return out.slice(0,n||3);
}
function laneBrief(laneId){
  const st=stats(),a=anchor();
  if(laneId==="link")return a?`기준 이야기: 「${a.orig}」(id: ${a.id}, ${a.kind}, ${a.region}). 같은 인물, 같은 모티프, 비슷한 주제 가운데 하나로 분명히 이어지는 다른 이야기를 고르세요. links의 첫 항목에 이 기준 이야기(id: ${a.id})와의 관계를 적으세요.`:"독자가 아직 아무것도 읽지 않았습니다. 처음 만나기 좋은, 누구나 빠져들 만한 이야기를 고르세요.";
  if(laneId==="far")return `독자가 아직 덜 만난 갈래: ${st.least.join(", ")}. 독자가 이미 만난 지역: ${[...st.rs].join(", ")||"없음"}. 이 지역들과 다른 대륙이나 문화권에서, 덜 만난 갈래의 이야기를 고르세요.`;
  if(laneId==="taste")return st.topG.length?`독자가 끝까지 즐겨 읽은 갈래: ${st.topG.join(", ")}. 즐겨 읽은 분위기: ${st.topM.join(", ")||"정보 없음"}. 이와 가까운 이야기를 고르되, 최근에 읽은 지역(${a?a.region:"없음"})은 피하세요.`:"아직 취향 기록이 없습니다. 3분 안에 즐길 수 있는 짧고 재미있는 이야기를 고르세요.";
  if(laneId==="odd")return `취향과 상관없이, 다음 질문에 답이 되는 뜻밖의 이야기를 고르세요: “${ODD_QS[robot.count%ODD_QS.length]}”`;
  return "독자가 아직 모르는 뜻밖의 이야기를 고르세요.";
}
function laneNow(laneId){
  const st=stats(),a=anchor();
  if(laneId==="link")return a?`지금 기준: 「${a.title}」`:"아직 읽은 이야기가 없어 기준이 없어요. 한 편을 읽으면 여기서부터 이어집니다.";
  if(laneId==="far")return `덜 만난 갈래: ${st.least.slice(0,4).join(", ")}${st.rs.size?` · 이미 가 본 곳: ${[...st.rs].slice(0,4).join(", ")}`:""}`;
  if(laneId==="taste")return st.topG.length?`즐겨 읽은 갈래: ${st.topG.join(", ")}${st.topM.length?` · 분위기: ${st.topM.join(", ")}`:""}`:"‘다 읽었어요’가 쌓이면 여기에 취향이 나타납니다.";
  return `다음 질문: “${ODD_QS[robot.count%ODD_QS.length]}”`;
}

/* ───────── 오늘의 편성 ───────── */
/* 본 적 있는 이야기를 기억해서, 안 본 것·오래전에 본 것을 먼저 꺼냅니다 */
function markShown(ids){const n=Date.now();ids.forEach(id=>{if(!byId[id])return;store.seen[id]=n;store.shownN[id]=(store.shownN[id]||0)+1});persist()}
const recentlySeen=(id,hours)=>(store.seen[id]||0)>Date.now()-(hours||6)*3600e3;
function freshScore(s,now){
  const seen=store.seen[s.id]||0,h=(now-seen)/3600e3;
  let v=0;
  if(lvl(s.id)>0)v+=1000;
  if(seen){v+=200;if(h<6)v+=400;else if(h<48)v+=150}
  v+=(store.shownN[s.id]||0)*8;
  if(!seen&&s.at)v-=60;
  return v+Math.random()*40;
}
function freshOrder(list){const now=Date.now(),sc=new Map(list.map(s=>[s.id,freshScore(s,now)]));return list.slice().sort((a,b)=>sc.get(a.id)-sc.get(b.id))}
function pickFive(exclude){
  const order=freshOrder(STORIES.filter(s=>!exclude.has(s.id))),five=[],used=new Set();
  for(const s of order){if(five.length<5&&!used.has(s.group)){five.push(s.id);used.add(s.group)}}
  for(const s of order){if(five.length<5&&!five.includes(s.id))five.push(s.id)}
  return five;
}
function makePlan(){
  const hero=freshOrder(STORIES)[0].id,five=pickFive(new Set([hero])),undo={};
  [hero,...five].forEach(id=>undo[id]=[store.seen[id],store.shownN[id]]);
  markShown([hero,...five]);
  return{hero,five,at:Date.now(),undo};
}
function undoPlan(p){Object.keys(p.undo||{}).forEach(id=>{const[a,b]=p.undo[id];if(a==null)delete store.seen[id];else store.seen[id]=a;if(b==null)delete store.shownN[id];else store.shownN[id]=b});persist()}
function weekTrip(){
  const q=QUESTIONS[Math.floor(Date.now()/(7*864e5))%QUESTIONS.length];
  return{title:q.q,intro:"이번 주에는 질문 하나를 따라 서로 다른 이야기를 이어 읽어요.",ids:q.ids.filter(id=>byId[id]).slice(0,3)};
}
const shownSet=()=>new Set([ui.plan.hero,...ui.plan.five,...ui.feed.map(f=>f.id)]);

/* ───────── 조각 ───────── */
function body(s,k){
  const d=s.depths[k];
  if(s.dialogue&&k==="d1")return dialogue(s,d.body);
  let out="";const ends=[];
  d.body.forEach(it=>{if(typeof it==="string")out+=`<p>${esc(it)}</p>`;else if(it&&it.e)ends.push(it.t)});
  if(ends.length){
    if(ui.showEnd[s.id])out+=`<div class="endwrap"><p class="endlabel">결말</p>${ends.map(t=>`<p>${esc(t)}</p>`).join("")}<div><button class="link quiet" data-act="hideend" data-id="${s.id}">결말 다시 접기</button></div></div>`;
    else out+=`<div class="spoil"><p>이 이야기는 마지막 장면이 중요합니다. 결말을 지금 읽을지 고를 수 있어요.</p><div class="row"><button class="btn" data-act="showend" data-id="${s.id}">결말까지 읽기</button></div></div>`;
  }
  return `<div class="prose">${out}</div>`;
}
function dialogue(s,lines){
  const all=ui.mode[s.id]==="all",n=all?lines.length:Math.min(ui.reveal[s.id]||2,lines.length),more=n<lines.length;
  const html=lines.slice(0,n).map(l=>l.n?`<div class="ln narr"><span>${esc(l.t)}</span></div>`:`<div class="ln ${l.w==="호자"?"me":""}"><b>${esc(l.w)}</b><span>${esc(l.t)}</span></div>`).join("");
  return `<div class="dlg" aria-live="polite">${html}</div><div class="row dctl">${more?`<button class="btn primary" data-act="nextline" data-id="${s.id}">다음 줄</button><span class="cnt">${n} / ${lines.length}</span>`:""}<button class="link quiet" data-act="dmode" data-id="${s.id}">${all?"한 줄씩 읽기":"한 번에 읽기"}</button></div>`;
}
function after(s,k){
  const ks=keys(s),nx=ks[ks.indexOf(k)+1],done=lvl(s.id)>=lvOf(k),deepLv=robot.state!=="ready"?0:k==="d1"&&!s.depths.d2?2:k==="d2"&&!s.depths.d3?3:0;
  const nxLabel=!nx?"":nx==="d2"?"조금 더 자세히":nx==="d3"?"더 깊이 읽기":"이야기 너머로";
  return `<div class="after">
  <button class="check" data-act="done" data-id="${s.id}" data-d="${k}" aria-pressed="${done}"><span class="box">${done?"✓":""}</span>${done?`${LV_SENT[lvOf(k)]}까지 읽었다고 기록했어요`:"다 읽었어요"}</button>
  <div class="row">${deepLv?`<button class="btn primary" data-act="deepen" data-id="${s.id}" data-lv="${deepLv}">${deepLv===3?"더 깊이 읽기 · Claude가 이어 쓰기":"조금 더 자세히"}</button>`:""}${nx?`<button class="btn ${deepLv?"":"primary"}" data-act="open" data-id="${s.id}" data-d="${nx}" data-mark="${k}">${nxLabel}</button>`:""}
  <button class="btn" data-act="other" data-id="${s.id}">다른 이야기</button>
  ${D?D.bar("iyagi",s.id,{kw:[s.orig||s.title].concat((s.tags||[]).slice(-2)),title:s.title,url:appUrl("#read-"+s.id),text:s.title+(s.hook?"\n"+s.hook:"")}):""}
  <button class="btn ${isSaved(s.id)?"saved":""}" data-act="save" data-id="${s.id}">${isSaved(s.id)?"담아둠":"담아두기"}</button></div></div>`;
}
/* ───────── 그림: 이야기마다 자동으로 그리는 표지 + Claude가 그린 삽화 ───────── */
function hashStr(x){let h=2166136261;for(const c of String(x)){h^=c.codePointAt(0);h=Math.imul(h,16777619)}return h>>>0}
function rng(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let q=Math.imul(a^a>>>15,1|a);q=q+Math.imul(q^q>>>7,61|q)^q;return((q^q>>>14)>>>0)/4294967296}}
const PAL={"웃긴":["#E9B44C","#7A2E1F","#F6E7C1"],"기묘한":["#7FA7C9","#1F2F45","#33465F"],"따뜻한":["#D98E73","#5A2E22","#F3E3C3"],"씁쓸한":["#A3A07A","#2B2622","#DDD5C4"],"비극적인":["#B23A48","#EDE4D3","#2B2D42"],"통쾌한":["#2A9D8F","#1D3B36","#F1E3A0"]};
const fx=n=>Math.round(n*10)/10;
function cover(s,W,H){
  const r=rng(hashStr(s.id)),[a,k,bg]=PAL[(s.mood||[])[0]]||["#C8963E","#2B2622","#EDE4D3"];
  const cx=W/2,cy=H/2,m=Math.min(W,H);let g="";
  switch(s.group){
    case"신화와 전승":{const R=m*(0.2+r()*0.08);for(let i=0;i<16;i++){const q=i/16*Math.PI*2+r()*0.15,L=R*(1.7+r()*0.7);g+=`<line x1="${fx(cx+Math.cos(q)*R*1.3)}" y1="${fx(cy+Math.sin(q)*R*1.3)}" x2="${fx(cx+Math.cos(q)*L)}" y2="${fx(cy+Math.sin(q)*L)}" stroke="${k}" stroke-width="${fx(m*0.025)}" stroke-linecap="round"/>`}g+=`<circle cx="${cx}" cy="${cy}" r="${fx(R)}" fill="${a}"/>`;break}
    case"소설과 창작":{const n=6+Math.floor(r()*4),gp=H/(n+1),mid=Math.ceil(n/2);for(let i=1;i<=n;i++){const w=W*(0.4+r()*0.45);g+=`<rect x="${fx((W-w)/2)}" y="${fx(i*gp-gp*0.18)}" width="${fx(w)}" height="${fx(gp*0.36)}" fill="${i===mid?a:k}" opacity="${i===mid?1:0.7}"/>`}break}
    case"사람의 생애":{for(let j=0;j<3;j++){const y=H*(0.45+j*0.18);let d=`M0 ${fx(y)}`;for(let x=0;x<W;x+=W/4)d+=` Q${fx(x+W/8)} ${fx(y-H*(0.06+r()*0.14))} ${fx(x+W/4)} ${fx(y)}`;g+=`<path d="${d} V${H} H0Z" fill="${j===1?a:k}" opacity="${0.55+j*0.2}"/>`}g+=`<circle cx="${fx(W*(0.25+r()*0.5))}" cy="${fx(H*0.22)}" r="${fx(m*0.07)}" fill="${a}"/>`;break}
    case"창작과 도전":{const c=W>H?8:4,rw=W>H?4:5,z=Math.min(W/(c+1),H/(rw+1));for(let i=0;i<c;i++)for(let j=0;j<rw;j++){const f=r();g+=`<rect x="${fx((W-c*z)/2+i*z+z*0.12)}" y="${fx((H-rw*z)/2+j*z+z*0.12)}" width="${fx(z*0.76)}" height="${fx(z*0.76)}" fill="${f<0.2?a:k}" opacity="${f<0.2?1:f<0.6?0.75:0.15}"/>`}break}
    case"웃음과 말":{for(let i=0;i<3;i++){const x=W*(0.25+i*0.25+(r()-0.5)*0.1),y=H*(0.35+(i%2)*0.28),rr=m*(0.15+r()*0.07),c=i===1?a:k,o=i===1?1:0.8;g+=`<circle cx="${fx(x)}" cy="${fx(y)}" r="${fx(rr)}" fill="${c}" opacity="${o}"/><path d="M${fx(x-rr*0.3)} ${fx(y+rr*0.85)} l${fx(-rr*0.3)} ${fx(rr*0.5)} l${fx(rr*0.6)} ${fx(-rr*0.3)}z" fill="${c}" opacity="${o}"/>`}break}
    case"역사와 사건":{for(let i=0;i<5;i++)g+=`<rect y="${fx(i*H/5)}" width="${W}" height="${fx(H/10)}" fill="${k}" opacity="0.2"/>`;const x=W*(0.3+r()*0.4);g+=`<path d="M${fx(x-m*0.15)} ${H} L${fx(x+m*0.1)} 0 L${fx(x+m*0.3)} 0 L${fx(x+m*0.05)} ${H}Z" fill="${a}"/>`;break}
    default:{for(let i=0;i<14;i++){const x=r()*W,y=r()*H,rr=m*(0.03+r()*0.06);g+=`<ellipse cx="${fx(x)}" cy="${fx(y)}" rx="${fx(rr*1.6)}" ry="${fx(rr)}" transform="rotate(${Math.floor(r()*180)} ${fx(x)} ${fx(y)})" fill="${i%3===0?a:k}" opacity="${i%3===0?1:0.6}"/>`}}
  }
  return `<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false"><rect width="${W}" height="${H}" fill="${bg}"/>${g}</svg>`;
}
function cleanArt(x){
  if(typeof x!=="string")return"";let a=x.trim();
  if(!/^<svg[\s>]/i.test(a)||a.length>9000||!/<\/svg>$/i.test(a))return"";
  if(/<script|<foreignObject|<image|\son\w+\s*=|href\s*=|url\(\s*['"]?(?!#)/i.test(a))return"";
  if(!/xmlns=/.test(a))a=a.replace(/^<svg/i,'<svg xmlns="http://www.w3.org/2000/svg"');
  return a;
}
function artFig(s){
  const a=cleanArt(s.art);
  if(a)return `<figure class="art"><img alt="${esc(s.title)} 삽화" src="data:image/svg+xml;charset=utf-8,${encodeURIComponent(a)}"><figcaption>그림: Claude가 이야기의 한 장면을 그렸어요</figcaption></figure>`;
  const wt=wtOf(s);
  if(wt)return `<figure class="art cov wtf"><div class="wtbox">${cover(s,320,140)}<img class="wtp" data-wt="${esc(wt)}" alt="${esc(s.title)} 관련 사진" decoding="async"></div><figcaption class="wtc">사진: 위키백과 「${esc(wt.split(":").slice(1).join(":"))}」 문서의 대표 그림</figcaption></figure>`;
  return `<figure class="art cov">${cover(s,320,140)}</figure>`;
}
const robotTag=s=>s.robot?`<span class="robotag">${s.web?"웹 수집 · 출처 있음":"Claude 작성 · 검수 전"}</span>`:"";
// 위키백과 대표 사진: 출처에 위키백과 문서가 있으면 그 문서, 없으면 원작 이름으로 (못 찾으면 원래 그림 그대로)
function wtOf(s){
  for(const x of (s.sources||[])){const m=/^https?:\/\/([a-z-]+)\.(?:m\.)?wikipedia\.org\/wiki\/([^#?]+)/.exec(x.u||x.url||"");if(m){try{return m[1]+":"+decodeURIComponent(m[2]).replace(/_/g," ")}catch(e){}}}
  const o=String(s.orig||"").split(" · ")[0].trim();
  return o&&o.length<=30?"ko:"+o:"";
}
function card(s){
  const L=lvl(s.id), wt=wtOf(s);
  return `<article class="card has-thumb"><div class="thumb">${cover(s,60,80)}${wt?`<img class="wth" data-wt="${esc(wt)}" alt="" loading="lazy" decoding="async">`:""}</div><div class="cbody"><h3><button class="tbtn" data-act="open" data-id="${s.id}" data-d="d1">${esc(s.title)}</button></h3>
  <p class="hook">${esc(s.hook)}</p>
  <div class="meta"><span>${esc(s.kind)}</span><span>·</span><span>${esc(s.region)}</span><span>·</span><span>약 ${s.depths.d1.min}분부터</span>${robotTag(s)}${L?`<span class="lvl">${LV[L]}</span>`:""}</div>
  <div class="acts"><button class="link" data-act="open" data-id="${s.id}" data-d="d1">이야기 읽기</button><button class="link quiet ${isSaved(s.id)?"on":""}" data-act="save" data-id="${s.id}">${isSaved(s.id)?"담아둠":"담아두기"}</button></div></div></article>`;
}
function resumeBlock(){
  const l=store.last;if(!l||!byId[l.id])return"";
  const s=byId[l.id];if(lvl(s.id)>=3)return"";
  return `<section class="block"><h2 class="sec">읽던 이야기</h2><div class="resume"><span><b>${esc(s.title)}</b> · ${DM[l.depth]?DM[l.depth].name:"한눈에"}에서 멈췄어요</span><button class="btn primary" data-act="resume">이어 읽기</button></div></section>`;
}
const dateLabel=()=>{const d=new Date();return `${d.getMonth()+1}월 ${d.getDate()}일`};

/* ───────── 화면: 오늘 + 끝없는 이야기 ───────── */
/* 들어올 때마다 새 이야기: 열 때 목록에서 2편을 골라 조용히 써 둡니다 */
function freshHTML(){
  const p=ui.plan,now=Date.now();if(!p)return"";
  const fresh=STORIES.filter(s=>s.at&&(s.at>prevVisit||(!store.seen[s.id]&&s.at>now-3*864e5))&&lvl(s.id)===0&&s.id!==p.hero&&!p.five.includes(s.id)).sort((a,b)=>b.at-a.at).slice(0,4);
  const on=store.visitAuto!==false,rdy=robot.state==="ready";
  const st=robot.visit&&robot.busy?"오늘의 새 이야기를 쓰고 있어요. 1~2분 걸려요.":robot.visit?"오늘의 새 이야기를 이어서 쓰고 있어요.":on?(rdy?"열 때마다 새 이야기 2편을 미리 써 둡니다.":"Claude를 쓸 수 있는 화면에서 열면 새 이야기를 미리 써 둡니다."):"자동으로 새 이야기 쓰기가 꺼져 있어요.";
  return (fresh.length?`<section class="block"><h2 class="sec"><span>새로 들어온 이야기</span><span>${fresh.length}편</span></h2><div class="list">${fresh.map(card).join("")}</div></section>`:"")
   +`<p class="sub" style="font-size:13.5px;margin:10px 0 0">${st} <button class="link quiet" data-act="visittoggle">${on?"끄기":"켜기"}</button></p>`;

function kickVisit(){if(visitDone)return;visitDone=true;setTimeout(visitWrite,800)}
async function visitWrite(){
  if(store.visitAuto===false||robot.state!=="ready")return;
  robot.visit=true;refreshFresh();
  const keys=catOrder().slice(0,2);
  if(!keys.length){while(robot.busy)await new Promise(r=>setTimeout(r,1500));await robotBatch(2)}
  for(const k of keys){
    if(robot.state!=="ready"||store.visitAuto===false||!robot.visit)break;
    while(robot.busy)await new Promise(r=>setTimeout(r,1500));
    if(!catOpen(CAT[k]))continue;
    await robotFetch("cat",catBrief(CAT[k]),{catId:k,silent:true});
    refreshFresh();
  }
  robot.visit=false;refreshFresh();updateRobotUI();
}

function pushFeed(f){
  ui.feed.push(f);markShown([f.id]);
  const el=document.getElementById("feed");if(el)el.insertAdjacentHTML("beforeend",feedItem(f));
  renderFeedTail();
}
function renderFeedTail(){
  const el=document.getElementById("feed-tail");if(!el)return;
  let h=`<p class="robot-line" data-robot>${robotLine()}</p>`;
  const waiting=robot.busy&&(!robot.silent||ui.waitAhead);
  if(ui.feedEnd)h+=`<div class="empty">도서관에 있는 이야기를 모두 만났어요. 로봇을 쓸 수 있는 화면에서는 이야기가 계속 이어집니다.</div>`;
  else if(!waiting)h+=`<div class="row" style="align-items:center"><button class="btn primary" data-act="feednext">${ui.feed.length?"다음 이야기":"이어서 읽기 시작"}</button>${ui.feedAuto&&!robot.err?`<span class="note">아래로 내리면 저절로 이어집니다</span>`:""}</div>`;
  el.innerHTML=h;
}
let io=null;
function watchSentinel(){
  if(io)io.disconnect();io=null;
  const el=document.getElementById("feed-sentinel");if(!el||!("IntersectionObserver" in window))return;
  io=new IntersectionObserver(es=>{
    if(es.some(e=>e.isIntersecting)&&ui.view==="today"&&ui.feedAuto&&!robot.err&&!ui.feedEnd&&!(robot.busy&&!robot.silent)&&!ui.waitAhead)nextFeed();
  },{rootMargin:"500px 0px"});
  io.observe(el);
}
async function nextFeed(){
  if(robot.busy&&!robot.silent)return;
  const shown=shownSet(),laneId=CYCLE[ui.cycleI%CYCLE.length];
  if(robot.ahead&&!shown.has(robot.ahead.s.id)){
    const a=robot.ahead;robot.ahead=null;ui.cycleI++;
    pushFeed({id:a.s.id,lane:a.lane,why:a.s.why||""});maybePrefetch();return;
  }
  const p=lanePicks(laneId,shown,1)[0];
  const stale=p&&recentlySeen(p.s.id,24);
  if(p&&!(stale&&robot.state==="ready"&&!robot.busy)){ui.cycleI++;pushFeed({id:p.s.id,lane:laneId,why:p.why});return}
  if(robot.state==="ready"){
    if(robot.busy){ui.waitAhead=true;renderFeedTail();return}
    ui.cycleI++;
    const s=await robotFetch(laneId,laneBrief(laneId));
    if(s&&!shownSet().has(s.id)&&lvl(s.id)===0){pushFeed({id:s.id,lane:laneId,why:s.why||""});maybePrefetch()}
    else if(s){robot.err="이미 만난 이야기를 다시 가져왔어요. 다시 눌러 다른 이야기를 찾아보세요.";ui.feedAuto=false;updateRobotUI()}
    else if(p){pushFeed({id:p.s.id,lane:laneId,why:p.why})}
    else{ui.feedAuto=false;renderFeedTail()}
    return;
  }
  const f=freshOrder(STORIES.filter(s=>lvl(s.id)===0&&!shown.has(s.id)))[0];
  if(f){ui.cycleI++;pushFeed({id:f.id,lane:laneId,why:"도서관에서 아직 만나지 않은 이야기"});return}
  ui.feedEnd=true;renderFeedTail();
}
function maybePrefetch(){
  if(!ui.feedAuto||robot.busy||robot.ahead||robot.state!=="ready"||robot.prefetchOff)return;
  const laneId=CYCLE[ui.cycleI%CYCLE.length];
  if(lanePicks(laneId,shownSet(),1).length)return;
  robotFetch(laneId,laneBrief(laneId),{silent:true}).then(s=>{
    if(s&&!shownSet().has(s.id)&&lvl(s.id)===0)robot.ahead={s,lane:laneId};
    else if(!s)robot.prefetchOff=true;
    if(ui.waitAhead){ui.waitAhead=false;nextFeed()}else updateRobotUI();
  });
}

function classify(o){
  const g=o.group,r=o.region||"",e=o.era||"",all=(o.orig||"")+" "+e+" "+r+" "+(o.kind||"");
  const yr=+((e.match(/(\d{4})년/)||[])[1]||0);
  if(/창세기|출애굽기|민수기|신명기|여호수아|사사기|룻기|사무엘|열왕기|요나서|다니엘|욥기|복음|마태|누가|마가|요한|사도행전|에스더|느헤미야|이사야|예레미야|에스겔/.test(e))return "성경";
  if(/쿠란|코란/.test(all))return "코란";
  if(/불교|자타카|붓다|불전|본생/.test(all))return "불경";
  if(/리그베다|우파니샤드|브라흐마나/.test(e))return "베다 설화";
  if(/이솝|그림 형제|페로|안데르센|라 퐁텐|우화/.test(all))return "우화와 동화";
  if(/한국/.test(r)){
    if(g===GROUPS[1])return "한국 고전 소설";
    if(g===GROUPS[0])return /신화|삼국유사|삼국사기|무가/.test(e)?"한국 신화":"한국 설화";
    if(g===GROUPS[4])return "한국 설화";
    if(g===GROUPS[6])return "생활과 문화";
    return yr>=1863?"한국 근현대사":"한국사";
  }
  if(g===GROUPS[0]){
    if(/인도/.test(r))return "인도 신화";
    if(/이집트/.test(r))return "이집트 신화";
    if(/로마/.test(r))return "로마 신화";
    if(/그리스|프리기아|아테네/.test(r))return "그리스 신화";
    if(/일본/.test(r))return "일본 신화";
    if(/중국/.test(r))return /신화|산해경/.test(e)?"중국 신화":"중국 설화";
    if(/북유럽|노르웨이|스웨덴|덴마크|아이슬란드/.test(r))return /에다/.test(e)?"북유럽 신화":"북유럽 설화";
    if(/핀란드/.test(r))return "북유럽 설화";
    if(/메소포타미아|수메르|페르시아|히타이트|가나안|근동|아라비아/.test(r))return "고대 설화";
    return "세계 신화와 전설";
  }
  if(g===GROUPS[1])return /이집트/.test(r)&&/왕국/.test(e)?"이집트 신화":"세계 고전 소설";
  if(g===GROUPS[4])return /중국/.test(r)?"고사성어":"웃음과 재치";
  if(g===GROUPS[5])return "세계사";
  if(g===GROUPS[2])return "인물";
  if(g===GROUPS[3])return "과학과 예술";
  return "생활과 문화";
}
const CATALOG=CAT_RAW.map((r,i)=>{const[o,g,rg,era,sh]=r.split("|");const c={id:"c"+i,orig:o,group:GROUPS[+g]||GROUPS[0],region:rg,era};c.shelf=sh||classify(c);return c});
function shelfOf(s){return s.shelf||(s.catId&&CAT[s.catId]&&CAT[s.catId].shelf)||classify(s)}

function catOrder(){
  /* 소설과 창작(고전 소설)을 먼저: 소설 2편마다 다른 갈래 1편 */
  const all=CATALOG.filter(catOpen).sort(()=>Math.random()-0.5),nov=all.filter(c=>c.group===GROUPS[1]),oth=all.filter(c=>c.group!==GROUPS[1]);
  const pool=[];while(nov.length||oth.length){for(let i=0;i<2&&nov.length;i++)pool.push(nov.shift());if(oth.length)pool.push(oth.shift())}
  const out=[],last=[];
  while(pool.length){let i=pool.findIndex(c=>!last.includes(c.region));if(i<0)i=0;const c=pool.splice(i,1)[0];out.push(c.id);last.push(c.region);if(last.length>2)last.shift()}
  return out;
}
const isReadKey=k=>{const s=resolveKey(k);return !!s&&lvl(s.id)>0};
function purgeRead(){
  const L=ui.list;if(!L.keep)L.keep={};
  let removed=0;
  L.order=L.order.filter((k,i)=>{if(isReadKey(k)&&!L.keep[k]){if(i<L.n)removed++;return false}return true});
  L.n=Math.max(0,L.n-removed);
}

function wikiParas(d,max){const ko=d.ko_lead&&d.ko_lead.length?d.ko_lead:null;return (ko||d.lead||[]).slice(0,max||99)}
function wikiNote(d){return `<p class="note">출처: <a href="${esc(d.u)}" target="_blank" rel="noopener">위키백과${d.l==="ko"?"":"(영어)"} ‘${esc(d.t)}’</a> · ${esc(d.lic||"CC BY-SA 4.0")} · AI 없이 문서를 기계적으로 정리했어요${d.ko_lead?" · 영어 첫 부분은 무료 번역 모델로 옮겼어요(어색할 수 있어요)":""}.</p>`}
function deckKeys(){
  const sh=store.homeShelf||"",q=(ui.homeQ||"").trim();
  let ks;
  if(!sh&&!q){
    const unread=freshOrder(STORIES.filter(s=>lvl(s.id)===0)).map(s=>s.id);
    const have=new Set(STORIES.map(s=>s.catId).filter(Boolean));
    const wk=WIKI.filter(w=>!have.has(w.id)).sort((a,b)=>(b.pv||0)-(a.pv||0)).map(w=>w.id);
    ks=unread.concat(wk);
  }else ks=homeKeys(false);
  return ks.filter(k=>byId[k]||WIKIBY[k]||ORIGBY[k]);
}

    ${d?wikiNote(d):""}<button class="vdk-more" data-act="hopen" data-key="${k}">전체 읽기 (문단 ${d?d.lead.length+d.secs.length:"…"}) ›</button></div>`}

    <p class="note">${o.tr?"한국어 번역 · 영어 원문":"영어 원문"} · 약 ${Math.max(1,Math.round(o.chars/10000))}만 자</p><button class="vdk-more" data-act="hopen" data-key="${k}">원문 읽기 ›</button></div>`;

function homeDeck(){
  return D.create({id:"iyagi-home",app:"iyagi",emptyTitle:"이 서가에 넘겨 볼 이야기가 없어요",emptyNote:"위키백과 정리 로봇을 한 번 돌리면 목록 전체가 채워져요.",
    items:()=>deckKeys().map(k=>{const s=byId[k],w=WIKIBY[k],o=ORIGBY[k];const t=s?s.title:w?w.o:o.ko;
      return {key:k,title:t,url:appUrl(s?"#read-"+k:o?"#orig-"+k:"#cat-"+k),shareText:t+(s&&s.hook?"\n"+s.hook:w&&w.h?"\n"+w.h:""),html:()=>deckCardHtml(k),k}}),
    onShow(x){if(WIKIBY[x.k]&&!wdocNow(x.k))wikiDoc(x.k).then(()=>{const d=D.get("iyagi-home");if(d&&d.curKey()===x.k)d.paint()})},
    onList(){try{localStorage.setItem("vfm:mode:iyagi-home",'"list"')}catch(e){}renderHome()}});

fetch("../data/iyagi/orig/index.json").then(r=>r.ok?r.json():[]).then(a=>{if(Array.isArray(a)){ORIG=a;a.forEach(o=>ORIGBY[o.id]=o);if(ui.view==="home")renderHome()}}).catch(()=>{});
const origDone=id=>!!(store.opos&&store.opos[id]&&store.opos[id].done);
const isReadH=k=>ORIGBY[k]?origDone(k):(!!byId[k]&&lvl(k)>0);
const shelfLabel=x=>x==="@원문"?"원문 읽기 (영어)":x;
function shelfCounts(){const n={};ORIG.forEach(o=>n[o.shelf]=(n[o.shelf]||0)+1);if(ORIG.length)n["@원문"]=ORIG.length;CATALOG.forEach(c=>n[c.shelf]=(n[c.shelf]||0)+1);STORIES.forEach(s=>{if(!s.catId){const k=shelfOf(s);n[k]=(n[k]||0)+1}});return n}
function homeKeys(read){
  const sh=store.homeShelf||"",q=(ui.homeQ||"").trim().toLowerCase(),byCat={};
  STORIES.forEach(s=>{if(s.catId)byCat[s.catId]=s});
  let keys=[];
  if(sh==="@원문")keys=ORIG.map(o=>o.id);
  else if(sh){ORIG.filter(o=>o.shelf===sh).forEach(o=>keys.push(o.id));STORIES.filter(s=>!s.catId&&shelfOf(s)===sh).forEach(s=>keys.push(s.id));CATALOG.forEach(c=>{if(c.shelf===sh)keys.push(byCat[c.id]?byCat[c.id].id:c.id)})}
  else{if(!ui.homeMix)ui.homeMix=catOrder();if(!ui.homeFirst)ui.homeFirst=freshOrder(STORIES).map(s=>s.id);
    STORIES.forEach(s=>{if(!ui.homeFirst.includes(s.id))ui.homeFirst.unshift(s.id)});
    keys=ui.homeFirst.concat(ui.homeMix.filter(k=>!byCat[k]))}
  const seenK=new Set();keys=keys.filter(k=>!seenK.has(k)&&seenK.add(k)&&(byId[k]||CAT[k]||ORIGBY[k]));
  keys=keys.filter(k=>{const r=isReadH(k);return read?r:!r});
  if(q)keys=keys.filter(k=>{const s=byId[k],c=CAT[k],o=ORIGBY[k];if(o)return (o.ko+" "+o.title+" "+o.author+" "+o.shelf).toLowerCase().includes(q);return (s?s.title+" "+s.orig+" "+s.region+" "+shelfOf(s):c.orig+" "+c.region+" "+c.era+" "+c.shelf).toLowerCase().includes(q)});
  return keys;
}
function hrow(k){
  const s=byId[k],c=CAT[k],o=ORIGBY[k];
  if(o){const ps=store.opos&&store.opos[k],pc=ps&&!ps.done?Math.round(((ps.n||1)-1)/o.parts*100):0;return `<button class="hrow" data-act="hopen" data-key="${k}"><span class="ht">${esc(o.ko)} <span class="otag">${o.tr?"한국어 번역 · 영어 원문":"원문 · 영어"}</span></span><span class="hm">${esc(o.shelf)} · ${esc(o.author)} · 약 ${Math.max(1,Math.round(o.chars/10000))}만 자${pc?" · 읽던 곳 "+pc+"%":""}${ps&&ps.done?" · 다 읽음":""}</span></button>`}
  if(s)return `<button class="hrow" data-act="hopen" data-key="${k}"><span class="ht">${esc(s.title)}</span><span class="hm">${esc(shelfOf(s))} · ${esc(s.orig)}${lvl(k)?" · "+LV[lvl(k)]:""}</span></button>`;
  return `<button class="hrow" data-act="hopen" data-key="${k}"><span class="ht">${esc(c.orig)}</span><span class="hm">${esc(c.shelf)} · ${esc(c.region)} · ${esc(c.era)} · <em>아직 안 쓴 이야기 · 로봇이 매일 새벽 채워요</em></span></button>`;
}

function renderHomeList(){

  el.innerHTML=keys.length?keys.slice(0,ui.homeN).map(hrow).join(""):`<div class="empty">${rd?"이 서가에서 읽은 이야기가 아직 없어요.":ui.homeQ?"찾는 이야기가 목록에 없어요.":"이 서가의 이야기를 모두 읽었어요."}</div>`;

function buildBatchPrompt(n){
  const st=stats(),rc={};STORIES.forEach(s=>rc[s.region]=(rc[s.region]||0)+1);
  const many=Object.keys(rc).sort((a,b)=>rc[b]-rc[a]).slice(0,6);

  return `당신은 ‘이야기 도서관’의 수집 로봇입니다. 실제로 전해지거나 기록된 이야기 ${n}편을 골라, JSON 배열 하나로만 답하세요.

[이야기의 범위]
신화·전설·설화·민담·우화, 공공 영역의 소설·동화·희곡, 실제 인물의 생애와 일화, 창작자와 발명가의 이야기, 만담·재담·우스개, 역사적 사건과 탐험, 음식·물건·풍습의 유래.

1. 실제로 전해지거나 기록된 이야기만 고릅니다. 새로 지어내지 않습니다.
2. 원전에 없는 대사, 장면, 속마음을 덧붙이지 않습니다. 확실하지 않은 것은 본문에 쓰지 말고 limit에 적습니다.

async function robotBatch(n){
  if(!sampleFn||robot.busy||robot.state!=="ready")return[];
  robot.busy=true;robot.silent=false;robot.lane="list";robot.got=0;robot.err=null;
  const ctl=new AbortController();robot.ctl=ctl;updateRobotUI();
  try{
    const res=await sampleFn.json(buildBatchPrompt(n),{cache:false,signal:ctl.signal,onText:({text})=>{robot.got=text.length;updateRobotUI()}});
    const arr=Array.isArray(res)?res:(res&&Array.isArray(res.stories)?res.stories:[]);
    const added=[];
    for(const o of arr){const s=normalizeRobot(o,"list");if(!s||findDup(s.orig))continue;addStory(s);await saveRobot(s);added.push(s)}
    robot.count=STORIES.filter(x=>x.robot).length;
    if(!added.length)throw{code:"bad_shape"};
    return added;
  }catch(e){
    const code=e&&e.code;
    if(["not_granted","sampling_disabled","not_declared","capability_disabled","capability_removed"].includes(code)){robot.state="off";robot.err=errCopy(code)}
    else if(code!=="cancelled")robot.err=errCopy(code);
    return[];
  }finally{robot.busy=false;robot.ctl=null;updateRobotUI()}
}

[형식]
{"body":["문단"],"end":[],"parts":[{"t":"제목","b":"문단"}],"beyond":[{"t":"제목","b":"문단"}],"limit":"","art":""}`;

    const P=(x,m)=>Array.isArray(x)?x.map(v=>S(v)).filter(Boolean).slice(0,m):[];
    const pairs=(x,m)=>Array.isArray(x)?x.filter(p=>p&&typeof p==="object").map(p=>({t:S(p.t,80),b:S(p.b,1400)})).filter(p=>p.t&&p.b).slice(0,m):[];
    const bd=P(o&&(o.body||o[key]),14),end=s.spoiler?P(o&&o.end,3):[];
    if(bd.length<3)throw{code:"bad_shape"};

    s.beyond=s.beyond.concat(be.filter(p=>!s.beyond.some(q=>q.t===p.t))).slice(0,5);
    if(!s.limit&&o.limit)s.limit=S(o.limit,400);

const EKEY="iyagi-extra-v1";
async function saveRobotUpdate(s,fields){
  const plain=JSON.parse(JSON.stringify(fields));
  if(!s.robot){try{const ex=JSON.parse(localStorage.getItem(EKEY)||"{}");ex[s.id]=Object.assign(ex[s.id]||{},plain);localStorage.setItem(EKEY,JSON.stringify(ex))}catch(e){}return}
  if(db){try{await db.collection("stories").doc(s.id).update(plain);return}catch(e){}}
  try{const arr=JSON.parse(localStorage.getItem(RKEY)||"[]");const i=arr.findIndex(x=>x.id===s.id);if(i>=0){Object.assign(arr[i],plain);localStorage.setItem(RKEY,JSON.stringify(arr))}}catch(e){}
}
try{const ex=JSON.parse(localStorage.getItem(EKEY)||"{}");Object.keys(ex).forEach(id=>{const s=SEED.find(x=>x.id===id);if(s)Object.assign(s,ex[id])})}catch(e){}
