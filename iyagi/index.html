  if(ui.view==="home"){renderHome();return}
  if(ui.view==="catread"){renderCatRead();return}
  if(ui.view==="read"){renderRead();nextBar(byId[ui.id]);return}
  if(ui.view==="read")renderRead();else if(ui.view==="explore")renderExplore();else if(ui.view==="library")renderLibrary();else if(ui.view==="flow")renderFlow();else if(ui.view==="list")renderList();else renderToday();
}
function route(){
  const h=decodeURIComponent(location.hash.slice(1))||"home";
  closeSheet();
  if(h.startsWith("orig-")){
    const k=h.slice(5);
    if(ORIGBY[k]){ui.view="orig";ui.oid=k;const ps=store.opos&&store.opos[k];ui.onum=(ps&&ps.n)||1;render();scrollTo(0,(ps&&ps.y)||0);return}
    if(!ORIG.length){ui.view="wait";$view.innerHTML=`<p class="sub" style="margin-top:40px">원문 목록을 불러오는 중이에요…</p>`;setTimeout(()=>{if(ORIGBY[k])route();else go("home",true)},2500);return}
  }
  if(h.startsWith("cat-")){
    const k=h.slice(4),s=CAT[k]&&catStory(k);
    if(s){try{history.replaceState(history.state,"","#read-"+s.id)}catch(e){}ui.pending="d1";route();return}
    if(CAT[k]){ui.view="catread";ui.catKey=k;render();scrollTo(0,0);return}
  }
  if(h.startsWith("read-")){
    const id=h.slice(5);
    if(byId[id]){
      ui.view="read";if(ui.id!==id){ui.id=id;ui.depth="d1"}
      if(ui.pending){ui.depth=ui.pending;ui.pending=null}
      render();
      if(ui.resumeY!=null){const y=ui.resumeY;ui.resumeY=null;requestAnimationFrame(()=>scrollTo(0,y))}else scrollTo(0,0);
      return;
    }
    if((id.startsWith("r-")||id.startsWith("w-"))&&(robot.state!=="off"||db)){ui.waitingId=id;ui.view="wait";$view.innerHTML=`<p class="sub" style="margin-top:40px">로봇이 가져온 이야기를 불러오는 중이에요…</p>`;return}
  }
  ui.view=["home","today","list","explore","library","flow"].includes(h)?h:"home";
  render();scrollTo(0,0);
}
function openStory(id,d){
  markShown([id]);seenAdd(id);
  if(ui.view==="read"&&ui.id===id){
    ui.depth=d||"d1";render();
    const el=document.getElementById("depths");if(el)el.scrollIntoView({behavior:matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth",block:"start"});
    return;
  }
  if(ui.view!=="read"&&ui.view!=="catread")ui.from=ui.view;
  ui.pending=d||"d1";
  go("read-"+id);
}
function markRead(id,k){
  const v=lvOf(k);if(lvl(id)<v)store.levels[id]=v;
  store.log.push({id,at:Date.now(),depth:k});if(store.log.length>500)store.log=store.log.slice(-500);
  persist();
}
function rerender(){const y=scrollY;render();scrollTo(0,y)}

document.addEventListener("click",e=>{
  const a=e.target.closest("[data-act]");
  if(!a){if(e.target===$sheet)closeSheet();return}
  if(a.disabled)return;
  const id=a.dataset.id;
  switch(a.dataset.act){
    case"nav":closeSheet();navStack.length=0;go(a.dataset.v,true);if(a.dataset.focus)setTimeout(()=>{const q=document.getElementById("q");if(q)q.focus()},60);break;
    case"open":closeSheet();if(a.dataset.mark)markRead(id,a.dataset.mark);openStory(id,a.dataset.d);break;
    case"back":goBack();break;
    case"done":{const k=a.dataset.d,v=lvOf(k);if(lvl(id)>=v){store.levels[id]=v-1;if(!store.levels[id])delete store.levels[id];persist()}else markRead(id,k);rerender();break}
    case"save":{const i=store.saved.indexOf(id);if(i<0){store.saved.unshift(id);toast("보관함에 담아두었습니다",true)}else{store.saved.splice(i,1);toast("담아둔 목록에서 뺐습니다")}persist();rerender();break}
    case"other":openOther(id);break;
    case"close":closeSheet();break;
    case"showend":ui.showEnd[id]=true;rerender();break;
    case"hideend":ui.showEnd[id]=false;rerender();break;
    case"nextline":ui.reveal[id]=(ui.reveal[id]||2)+1;rerender();break;
    case"dmode":ui.mode[id]=ui.mode[id]==="all"?"line":"all";if(ui.mode[id]==="line")ui.reveal[id]=2;rerender();break;
    case"font":store.font=Math.max(0,Math.min(2,store.font+Number(a.dataset.f)));applyFont();persist();break;
    case"want":{const w=WANTS[+a.dataset.i],hero=ui.plan?ui.plan.hero:null;
      const fresh=STORIES.filter(x=>w.f(x)&&x.id!==hero&&lvl(x.id)===0);
      if(fresh.length){const f=freshOrder(fresh)[0];if(recentlySeen(f.id,24)&&robot.state==="ready"){fetchAndOpen("ask",w.brief);break}openStory(f.id,"d1");break}
      if(robot.state==="ready"){fetchAndOpen("ask",w.brief);break}
      const pool=STORIES.filter(x=>w.f(x)&&x.id!==hero);openStory((pool[Math.floor(Math.random()*pool.length)]||STORIES[0]).id,"d1");break}
    case"filter":{const f=a.dataset.f,v=a.dataset.v;ui.ex[f]=ui.ex[f]===v?"":v;renderExplore();break}
    case"question":{const i=+a.dataset.i;ui.ex.question=ui.ex.question===i?-1:i;renderExplore();break}
    case"clear":ui.ex={q:"",group:"",mood:"",region:"",question:-1};renderExplore();break;
    case"gogroup":ui.ex={q:"",group:a.dataset.v,mood:"",region:"",question:-1};go("explore");break;
    case"reset":delete store.levels[id];persist();rerender();break;
    case"resume":{const l=store.last;if(l&&byId[l.id]){const p=store.pos[l.id];if(p&&p.d===l.depth)ui.resumeY=p.y;openStory(l.id,l.depth)}break}
    case"visittoggle":store.visitAuto=store.visitAuto===false;persist();if(store.visitAuto===false)robot.visit=false;else if(!robot.visit){visitDone=false;kickVisit()}refreshFresh();toast(store.visitAuto===false?"자동 쓰기를 껐어요":"자동 쓰기를 켰어요");break;
    case"feednext":robot.err=robot.state==="off"?robot.err:null;robot.prefetchOff=false;ui.feedAuto=true;nextFeed();break;
    case"stopbot":if(robot.ctl)robot.ctl.abort();ui.feedAuto=false;ui.waitAhead=false;break;
    case"lanefetch":{closeSheet();const lane=a.dataset.lane;
      let brief=laneBrief(lane);
      if(a.dataset.from&&byId[a.dataset.from]){const s=byId[a.dataset.from];brief=`기준 이야기: 「${s.orig}」(id: ${s.id}, ${s.kind}, ${s.region}). 같은 인물, 같은 모티프, 비슷한 주제 가운데 하나로 분명히 이어지는 다른 이야기를 고르세요. links의 첫 항목에 이 기준 이야기(id: ${s.id})와의 관계를 적으세요.`}
      fetchAndOpen(lane,brief);break}
    case"askbot":fetchAndOpen("ask",askBrief());break;
    case"lopen":{const k=a.dataset.key,lv=+a.dataset.lv||2;ui.list.open[k]=lv;ui.list.keep[k]=1;const s=resolveKey(k);if(s)markRead(s.id,lv===3?"d2":"d1");replaceItem(k);break}
    case"ldone":{const k=a.dataset.key,s=resolveKey(k);if(!s)break;const o=ui.list.open[k]||0;markRead(s.id,o>=3&&s.depths.d3?"d2":"d1");
      const el=document.getElementById("li-"+k);ui.list.order=ui.list.order.filter(x=>x!==k);ui.list.n=Math.max(0,ui.list.n-1);if(el)el.remove();updateListTail();toast("읽은 이야기로 옮겼어요");break}
    case"ltab":ui.listTab=a.dataset.v==="read"?"read":"new";window.scrollTo(0,0);render();break;
    case"unread":delete store.levels[id];persist();render();toast("안 읽은 이야기로 되돌렸어요");break;
    case"olang":store.olang=a.dataset.v;persist();renderOrig();break;
    case"onext":ui.onum++;osave();scrollTo(0,0);renderOrig();break;
    case"oprev":ui.onum=Math.max(1,ui.onum-1);osave();scrollTo(0,0);renderOrig();break;
    case"odone":osave(true);toast("다 읽었어요. 읽은 것으로 옮겼어요");goBack();break;
    case"hshelf":store.homeShelf=a.dataset.v||"";persist();if(D){const d=D.get("iyagi-home");if(d)d.refresh()}ui.homeQ="";window.scrollTo(0,0);renderHome();break;
    case"htab":ui.homeTab=a.dataset.v==="read"?"read":"new";renderHomeList();document.querySelectorAll("[data-act=htab]").forEach(b=>b.setAttribute("aria-pressed",String(b===a)));break;
    case"hopen":{const k=a.dataset.key;if(ui.view!=="read"&&ui.view!=="catread")ui.from=ui.view;
      if(ORIGBY[k]){go("orig-"+k);break}
      if(byId[k]){openStory(k,"d1");break}
      const s=CAT[k]&&catStory(k);if(s){openStory(s.id,"d1");break}
      if(CAT[k])go("cat-"+k);break}
    case"cwretry":ui.cw=null;renderCatRead();break;
    case"shelffetch":shelfFetch();break;
    case"fullscreen":try{if(document.fullscreenElement)document.exitFullscreen();else{const r=document.documentElement.requestFullscreen&&document.documentElement.requestFullscreen();if(r&&r.catch)r.catch(()=>toast("이 화면에서는 브라우저 전체 화면을 쓸 수 없어요"));else if(!r)toast("이 화면에서는 브라우저 전체 화면을 쓸 수 없어요")}}catch(e){toast("이 화면에서는 브라우저 전체 화면을 쓸 수 없어요")}break;
    case"lwrite":listWrite(a.dataset.key);break;
    case"llong":store.listLong=a.dataset.v==="1";persist();rerender();break;
    case"lbatch":robot.err=null;listFetch();break;
    case"deepen":{const s=byId[id];if(!s)break;if(robot.busy){toast("Claude가 다른 이야기를 쓰는 중이에요");break}
      const lv=+a.dataset.lv||2,k=a.dataset.key;
      a.disabled=true;a.textContent="이어 쓰는 중… (1분 안팎)";
      robotDeepen(s,lv).then(ok=>{
        if(!ok){toast(robot.err||"이어 쓰지 못했어요");if(k&&ui.view==="list")replaceItem(k);else rerender();return}
        markRead(id,lv===3?"d2":"d1");
        if(k&&ui.view==="list"&&ui.list){ui.list.open[k]=lv;replaceItem(k)}else openStory(id,lv===3?"d3":"d2");
      });break}
    case"reshuffle":{const ex=new Set([ui.plan.hero,...ui.plan.five,...ui.feed.map(f=>f.id)]);let f=pickFive(ex);if(f.length<3)f=pickFive(new Set([ui.plan.hero]));ui.plan.five=f;ui.plan.undo=null;markShown(f);
      const el=document.getElementById("five");if(el)el.innerHTML=f.map(id=>card(byId[id])).join("");
      if(f.every(id=>recentlySeen(id,24)))toast(robot.state==="ready"?"도서관 이야기를 다 둘러봤어요. 아래 끝없는 이야기에서 로봇이 새로 가져옵니다":"도서관 이야기를 다 둘러봤어요. 수집기가 새 이야기를 넣으면 바뀝니다");break}
  }
});
document.addEventListener("input",e=>{if(e.target.id==="q"){ui.ex.q=e.target.value;renderResults()}});
let hqT;document.addEventListener("input",e=>{if(e.target.id==="hq"){ui.homeQ=e.target.value;clearTimeout(hqT);hqT=setTimeout(renderHomeList,180)}});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&!$sheet.hidden)closeSheet()});
let posT;
let oposT;addEventListener("scroll",()=>{if(ui.view!=="orig")return;clearTimeout(oposT);oposT=setTimeout(()=>osave(),500)},{passive:true});
addEventListener("scroll",()=>{if(ui.view!=="read")return;clearTimeout(posT);posT=setTimeout(()=>{store.pos[ui.id]={d:ui.depth,y:Math.round(scrollY)};persist()},400)},{passive:true});
/* ───────── 뒤로가기: 화면을 닫지 않고 앱 안에서 한 단계씩 돌아가기 ───────── */
const navStack=[],scrollMem={};let exitArm=0;
function curHash(){return decodeURIComponent(location.hash.slice(1))||"home"}
function go(h,isBack){
  const c=curHash();
  if(h===c){route();return}
  scrollMem[c]=scrollY;
  if(!isBack){navStack.push(c);if(navStack.length>60)navStack.shift()}
  try{history.replaceState(history.state,"","#"+h)}catch(e){location.hash=h;return}
  route();
  if(isBack&&scrollMem[h]!=null){const y=scrollMem[h];requestAnimationFrame(()=>scrollTo(0,y))}
}
function goBack(){
  if(!$sheet.hidden){closeSheet();return true}
  if(navStack.length){go(navStack.pop(),true);return true}
  if(curHash()!=="home"){go("home",true);return true}
  return false;
}
// 뒤로가기 = 한 단계 위로 (자판기 공통 규칙, assets/shell.js 가 처리)
window.vfmApp={back:goBack,go:h=>go(decodeURIComponent(String(h).replace(/^#/,""))||"home"),route,top:()=>{if(!$sheet.hidden)closeSheet();go("home")}};
route();

</script>
