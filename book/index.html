.yband button{flex:0 0 auto;border:0;border-radius:10px;padding:6px 10px;background:var(--ap-fill);font-size:13px;font-weight:600;min-width:52px;text-align:center}
.yband button small{display:block;font-size:10.5px;font-weight:500;color:var(--muted)}.yband button.on{background:var(--accent);color:var(--accent-ink)}.yband button.on small{color:inherit;opacity:.8}
.diff{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin:8px 0}.diff div{background:var(--surface);border-radius:12px;padding:8px;text-align:center}.diff b{display:block;font:800 20px var(--ap-display)}.diff small{color:var(--muted);font-size:11.5px}
.bar{display:flex;align-items:center;gap:8px;font-size:13px;margin:4px 0}.bar span{width:84px;flex:none;color:var(--muted)}.bar i{display:block;height:8px;border-radius:4px;background:var(--accent);min-width:2px}.bar b{font-size:12px;color:var(--muted);font-weight:500}

</style></head><body>
<div class="wrap" id="app"></div>
<nav class="tabs" id="tabs">
  <button data-v="today" aria-current="page"><b>☀︎</b>오늘</button>
  <button data-v="find"><b>⌕</b>탐색</button>
  <button data-v="school"><b>🏛</b>학교별</button>
  <button data-v="shelf"><b>☆</b>보관함</button>
</nav>
<script>
"use strict";
/* ───── 상태 (폰 브라우저에 저장 · 구글 로그인하면 기기끼리 맞춤) ─────
   star = 내 책 {id:{at, st:'want'|'reading'|'done', r:별점, item:{t,a,cv}}} — 보관함 공통 화면도 이걸 읽음
   memo = {id:글} · toc = {id:{줄번호:1}} 어디까지 읽었나 · seen = 본 책 */
const LS = { g(k, d) { try { const v = localStorage.getItem("vfm:book:" + k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
             s(k, v) { try { localStorage.setItem("vfm:book:" + k, JSON.stringify(v)); } catch (e) { toast("저장 공간이 꽉 찼어요"); } } };
const S = { star: LS.g("star", {}), memo: LS.g("memo", {}), toc: LS.g("toc", {}), seen: LS.g("seen", {}), view: LS.g("view", "grid"),
            f: LS.g("filter", {}), sort: LS.g("sort", "rec"), q: "", lim: 60, shelfTab: "reading" };
function save(k) { LS.s(k, S[k]); }
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
function toast(m) { const t = document.createElement("div"); t.className = "toast"; t.textContent = m; document.body.appendChild(t); setTimeout(() => t.remove(), 2000); }
const getJ = p => fetch("../data/book/" + p, { cache: "no-cache" }).then(r => { if (!r.ok) throw new Error(p + " " + r.status); return r.json(); });
const DAY = () => Math.floor((Date.now() + 9 * 3600e3) / 864e5);
function ago(iso) { if (!iso) return ""; const m = Math.round((Date.now() - Date.parse(iso)) / 60000); if (!(m >= 0)) return ""; if (m < 60) return Math.max(m, 1) + "분 전"; const h = Math.round(m / 60); if (h < 24) return h + "시간 전"; return Math.round(h / 24) + "일 전"; }
const STN = { want: "읽고 싶음", reading: "읽는 중", done: "다 읽음" };

let IDX = null, TOP = null, ALL = null, COLS = null, SHARD = {}, SRCD = {}, LINK = null;
let KP = "https://contents.kyobobook.co.kr/sih/fit-in/300x0/pdt/";
const ku = u => typeof u === "string" && u.startsWith("k:") ? KP + u.slice(2) + ".jpg" : u;      // 교보 표지 주소는 줄여 담음
const row2o = r => { const o = {}; COLS.forEach((c, i) => o[c] = r[i]); o.cv = ku(o.cv); o.cv2 = ku(o.cv2); return o; };
async function loadTop() { const [i, t] = await Promise.all([getJ("_index.json"), getJ("top.json")]); IDX = i; COLS = t.cols; TOP = t.rows.map(row2o); }
let allP = null;
function loadAll() { if (!allP) allP = getJ("all.json").then(x => { if (x.kp) KP = x.kp; ALL = x.rows.map(row2o); ALL.forEach((b, i) => b.rank = i + 1); return ALL; }); return allP; }
async function detail(id) { const sh = id.slice(1, 3); if (!SHARD[sh]) SHARD[sh] = await getJ("w/" + sh + ".json"); return SHARD[sh][id]; }
async function srcList(id) { if (!SRCD[id]) SRCD[id] = await getJ("src/" + id + ".json"); return SRCD[id]; }
const SRCMAP = () => Object.fromEntries(((IDX && IDX.sources) || []).map(s => [s.id, s]));
const byId = id => (ALL || TOP || []).find(b => b.id === id);

/* ───── 표지 (저장 안 하고 주소만 — 안 뜨면 다음 주소, 그래도 없으면 글자 표지) ───── */
function cover(b, o = {}) {
  const a = b.cv || "", c2 = b.cv2 || "";
  const ph = `<div class="ph">${esc(b.t)}<small>${esc(b.a || "")}</small></div>`;
  const img = a ? `<img loading="lazy" alt="" referrerpolicy="no-referrer" src="${esc(a)}" data-alt="${esc(c2)}" onerror="if(this.dataset.alt){this.src=this.dataset.alt;this.dataset.alt=''}else{this.remove()}" onload="if(this.naturalWidth<8)this.onerror()">` : "";
  const st = (S.star[b.id] || {}).st;
  return `<div class="cv">${ph}${img}${o.rank ? `<span class="rk">${o.rank}</span>` : ""}${st ? `<span class="st">${STN[st]}</span>` : ""}</div>`;
}
function bk(b, o = {}) {
  const sub = o.sub != null ? o.sub : (b.r > 1 ? `${b.r}곳 추천` : (b.a || ""));
  return `<button class="bk${S.seen[b.id] ? " seen" : ""}" data-b="${b.id}">${cover(b, o)}<p>${esc(b.t)}</p><span>${esc(sub)}</span></button>`;
}
function li(b, o = {}) {
  return `<button class="li" data-b="${b.id}">${o.n != null ? `<span class="n">${o.n}</span>` : ""}<div class="lcv">${cover(b)}</div><div class="bx"><p class="t">${esc(b.t)}</p>
    <p class="s">${esc(b.a || "")}${b.y ? " · " + esc(b.y) : ""}</p><div class="meta" style="margin-top:4px"><span class="bd src">${b.r}곳 추천</span><span>${esc(b.f)}</span>${b.n && b.n !== "미상" ? `<span>${esc(b.n)}</span>` : ""}${(b.x || "").includes("t") ? "<span>목차</span>" : ""}${(b.x || "").includes("o") ? '<span class="bd new">원문</span>' : ""}${(b.x || "").includes("e") ? "<span>전자책</span>" : ""}${o.extra || ""}</div></div></button>`;
}
const books = (l, o = {}) => S.view === "list" || o.list ? `<div class="list">${l.map((b, i) => li(b, { n: o.num ? i + 1 : null, extra: o.extra && o.extra(b) })).join("")}</div>` : `<div class="shelf">${l.map(b => bk(b, { rank: o.num ? b.rank : 0, sub: o.sub && o.sub(b) })).join("")}</div>`;
function viewSwitch() { return `<div class="seg" style="max-width:220px"><button data-vw="grid" class="${S.view !== "list" ? "on" : ""}">표지</button><button data-vw="list" class="${S.view === "list" ? "on" : ""}">목록</button></div>`; }

/* ───── 화면: 오늘 ───── */
function head(title, sub, right = "") { return `<div class="top"><h1 class="lt">${title}</h1><div class="row">${right}</div></div>${sub ? `<p class="sub">${sub}</p>` : ""}`; }
const D = window.VfmDeck || null, MODE = "book";
const isDeck = () => !!D && D.mode(MODE) === "deck";
function dayPick(l, n) { const d = DAY(); const out = [], used = new Set(); for (let i = 0; out.length < Math.min(n, l.length) && i < n * 5; i++) { const k = (d * 7919 + i * 104729) % l.length; if (!used.has(k)) { used.add(k); out.push(l[k]); } } return out; }
function deckCard(b) {
  return `<div class="vdk-body"><div class="vdk-k"><span class="bd src">${b.r}곳 추천</span><span>${esc(b.f)}${b.n && b.n !== "미상" ? " · " + esc(b.n) : ""}</span></div>

const FKEYS = [["f", "분야", "fieldOrder", "fields"], ["n", "나라", "nationOrder", "nations"], ["e", "시대", "eraOrder", "eras"], ["l", "난이도", null, "levels"]];
function filtered() {
  const f = S.f, q = S.q.trim().toLowerCase().replace(/\s+/g, "");
  let l = ALL || TOP;
  if (f.f) l = l.filter(b => b.f === f.f); if (f.n) l = l.filter(b => b.n === f.n); if (f.e) l = l.filter(b => b.e === f.e); if (f.l) l = l.filter(b => b.l === f.l);
  if (f.k === "univ") l = l.filter(b => b.u > 0); else if (f.k === "org") l = l.filter(b => b.r > b.u);
  if (f.src) { const m = SRCMAP(); l = l.filter(b => b.s.some(s => (m[s] || {}).short === f.src)); }
  if (f.x) l = l.filter(b => (b.x || "").includes(f.x));
  if (f.multi) l = l.filter(b => b.r >= 2);
  if (q) l = l.filter(b => (b.t + b.a).toLowerCase().replace(/\s+/g, "").includes(q));
  const s = S.sort;
  if (s === "title") l = l.slice().sort((a, b) => a.t.localeCompare(b.t, "ko"));
  else if (s === "year") l = l.slice().sort((a, b) => (b.y || "0").localeCompare(a.y || "0"));

}

    h += `<div class="diff"><div><b>${now.size}</b><small>${sel}년 목록</small></div><div><b style="color:var(--ok)">+${prev ? added.length : now.size}</b><small>${prev ? prev + "년보다 새로" : "첫 해"}</small></div><div><b style="color:var(--ng)">−${gone.length}</b><small>${prev ? "빠진 책" : ""}</small></div></div>`;

  const life = au.b || au.d ? ` (${au.b != null ? (au.b < 0 ? "기원전 " + (-au.b) : au.b) : "?"}~${au.d != null ? (au.d < 0 ? "기원전 " + (-au.d) : au.d) : ""})` : "";
  h += `<div class="bhead">${cover({ ...b, cv: d.cv, cv2: d.cv2 })}<div style="min-width:0"><h1 class="bt">${esc(d.t)}</h1><p class="ba">${esc(d.a || "지은이 미상")}${esc(life)}</p>
    ${d.tr && d.tr.length ? `<p class="bs">옮긴이 ${esc(d.tr.join(", "))}</p>` : ""}<p class="bs">${esc([d.pub, d.y, d.pg ? d.pg + "쪽" : ""].filter(Boolean).join(" · "))}</p>${d.ot ? `<p class="bs">원제 ${esc(d.ot)}</p>` : ""}
    <div style="margin-top:8px">${[["f", d.f], ["n", d.n], ["e", d.e], ["l", d.l]].filter(([, v]) => v && v !== "미상").map(([k, v]) => `<button class="rc g" data-ff="${k}:${esc(v)}">${esc(v)}</button>`).join("")}</div></div></div>`;
  // 추천한 곳 (연도·판까지)
  const recs = {};
  for (const [s, lb] of d.recs || []) { const k = (m[s] || {}).short || s; (recs[k] = recs[k] || []); if (lb) recs[k].push(lb); }
  h += `<div class="kv"><h4>추천한 곳 ${Object.keys(recs).length}곳</h4><div>${Object.entries(recs).map(([k, ls]) => `<button class="rc" data-go="#sc=${encodeURIComponent(k)}">${esc(k)}${ls.length ? ` <span style="font-weight:500">${esc([...new Set(ls)].sort().slice(0, 4).join("·"))}${ls.length > 4 ? "…" : ""}</span>` : ""}</button>`).join("")}</div></div>`;
  // 내 책
  h += `<div class="box"><div class="stbtn">${Object.entries(STN).map(([k, v]) => `<button data-st="${k}" class="${my.st === k ? "on" : ""}">${v}</button>`).join("")}</div>
    ${my.st === "done" || my.r ? `<div class="stars" style="margin-top:8px">${[1, 2, 3, 4, 5].map(i => `<button data-rate="${i}" class="${(my.r || 0) >= i ? "on" : ""}">★</button>`).join("")}</div>` : ""}</div>`;
  // 소개 · 목차
  if (d.intro) h += `<div class="kv"><h4>책 소개</h4><div class="txt">${esc(d.intro)}</div></div>`;
  if (d.toc) {
    const lines = d.toc.split("\n"), done = S.toc[id] || {}, n = Object.keys(done).length;
    h += `<div class="kv"><h4>목차 <span>${n ? `${n}/${lines.length} 읽음` : `${lines.length}칸 · 읽은 곳을 체크`}</span></h4>${n ? `<div class="prog"><i style="width:${Math.round(n / lines.length * 100)}%"></i></div>` : ""}<div class="toc">${lines.map((ln, i) => {
      const lv = /^\s*(제\s*\d+\s*[부편]|part|PART|[IVX]+\.|\d+부\b|[1-9]\.\s|[1-9]장|제\s*\d+\s*장|chapter)/i.test(ln) ? 0 : /^\s*(\d+\.\d+|[-·•]|\(\d+\)|[가-하]\.)/.test(ln) ? 2 : 1;
      return `<label class="l${lv}${done[i] ? " dn" : ""}"><input type="checkbox" data-tc="${i}" ${done[i] ? "checked" : ""}><span>${esc(ln)}</span></label>`;
    }).join("")}</div></div>`;
  } else h += `<div class="kv"><h4>목차</h4><p class="note">${IDX.keys && IDX.keys.yes24 ? "아직 못 찾았어요. 로봇이 매일 다른 판·다른 곳에서 다시 찾아요." : "목차는 YES24 열쇠가 들어오면 로봇이 채워요."} <a target="_blank" rel="noopener" href="${esc(d.y24 || L.yes24)}">서점에서 목차 보기 ↗</a></p></div>`;
  // 바로가기
  const L = d.links || {};
  const lk = (u, i, t, s) => `<a href="${esc(u)}" target="_blank" rel="noopener"><i>${i}</i><span>${t}${s ? `<small>${s}</small>` : ""}</span></a>`;
  let full = "";
  if (d.full && (d.full.iy || d.full.ws || d.full.gb)) {
    full = `<div class="kv"><h4>원문 읽기 <span style="font-weight:500;color:var(--muted)">저작권이 끝난 고전</span></h4><div class="lk">`;
    if (d.full.iy) full += `<a href="../iyagi/#${esc(d.full.iy)}"><i>📖</i><span>이야기 앱에서 읽기<small>원문 + 한국어 기계번역</small></span></a>`;
    if (d.full.ws) full += `<button data-go="#ws=${encodeURIComponent(d.full.ws)}"><i>文</i><span>한국어 위키문헌<small>여기서 바로 읽기</small></span></button>`;
    if (d.full.gb) full += lk(`https://www.gutenberg.org/ebooks/${d.full.gb}`, "G", "구텐베르크 원문", "영어 · 무료") + (D ? lk(D.koUrl(`https://www.gutenberg.org/ebooks/${d.full.gb}.html.images`), "가", "번역해서 열기", "구글 번역") : "");
    full += `</div></div>`;
  }
  h += full;
  h += `<div class="kv"><h4>찾기 · 빌리기 · 전자책</h4><div class="lk">${lk(L.google, "G", "구글 검색")}${lk(L.lib, "🏛", "동네 도서관에 있나", "도서관 정보나루")}
    ${lk(L.millie, "M", "밀리의서재에서 찾기", "구독")}${(d.eb || []).map(([n, u]) => lk(u, "e", esc(n), "전자책")).join("")}${lk(L.ridi, "R", "리디에서 찾기", "셀렉트·구매")}${lk(L.welaaa, "🎧", "윌라 오디오북", "듣는 책")}
    ${lk(L.kyobo, "K", "교보문고", "종이책·eBook")}${lk(L.yes24, "Y", "YES24", "종이책·eBook")}</div></div>`;
  // 다른 앱
  if ((d.rel || []).length) h += `<div class="kv"><h4>다른 앱에서 더 보기</h4><div>${d.rel.map(([k, rid, t]) => k === "h" ? `<a class="rc" href="../history/#p=${encodeURIComponent(rid)}">역사 · ${esc(t)}</a>` : `<a class="rc" href="../iyagi/#${esc(rid)}">이야기 · ${esc(t)}</a>`).join("")}</div></div>`;
  // 메모·생각
  h += `<div class="kv"><h4>내 메모</h4><textarea class="memo" id="bmemo" placeholder="읽으며 든 생각, 밑줄 그은 문장…">${esc(S.memo[id] || "")}</textarea>
    <div class="row" style="margin-top:8px"><button class="btn sm" data-act="think">✎ 생각 3줄</button><button class="btn sm" data-act="share">공유</button></div></div>`;
  h += `<p class="note" style="margin-top:16px">정보: ${[d.daum ? `<a href="${esc(d.daum)}" target="_blank" rel="noopener">카카오(다음) 책</a>` : "", d.y24 ? `<a href="${esc(d.y24)}" target="_blank" rel="noopener">YES24</a>` : "", "추천 목록: 각 대학·기관"].filter(Boolean).join(" · ")}${d.isbn ? " · ISBN " + esc(d.isbn) : ""}</p>`;
  return h;
}

/* ───── 화면: 위키문헌 원문 ───── */
async function renderWs(title) {
  title = decodeURIComponent(title);
  let h = `<div class="top"><button class="ib" data-act="back" aria-label="뒤로">‹</button></div>` + head(esc(title), `한국어 위키문헌 원문 · <a href="https://ko.wikisource.org/wiki/${encodeURIComponent(title)}" target="_blank" rel="noopener">위키문헌에서 열기 ↗</a>`);
  try {
    const r = await fetch(`https://ko.wikisource.org/w/api.php?action=parse&page=${encodeURIComponent(title)}&prop=text&format=json&formatversion=2&redirects=1&origin=*`);
    const j = await r.json();
    const doc = new DOMParser().parseFromString((j.parse && j.parse.text) || "", "text/html");
    doc.querySelectorAll("script,style,link,meta,iframe,form,input,button,img").forEach(x => x.remove());
    doc.querySelectorAll("*").forEach(x => { for (const at of [...x.attributes]) if (!["href", "class", "colspan", "rowspan"].includes(at.name)) x.removeAttribute(at.name); });
    doc.querySelectorAll("a").forEach(a => { const href = a.getAttribute("href") || ""; const m2 = href.match(/^\/wiki\/([^#?]+)/); if (m2 && !/^(특수|틀|분류|파일|위키문헌|저자):/.test(decodeURIComponent(m2[1]))) { a.setAttribute("href", "#ws=" + m2[1]); a.setAttribute("data-ws", "1"); } else if (href.startsWith("/")) { a.setAttribute("href", "https://ko.wikisource.org" + href); a.setAttribute("target", "_blank"); } });
    h += `<div class="reader">${doc.body.innerHTML || "<p>본문이 비어 있어요</p>"}</div><p class="note">출처: 한국어 위키문헌 (저작권 만료 · 퍼블릭 도메인)</p>`;
  } catch (e) { h += `<p class="empty">원문을 못 불러왔어요</p>`; }
  return h;
}

/* ───── 화면: 보관함 ───── */
function renderShelf() {
  const all = Object.entries(S.star).map(([id, v]) => ({ id, ...(v.item || {}), st: v.st, r: v.r, at: v.at }));
  const cnt = k => all.filter(b => b.st === k).length;
  let h = head("보관함", `내 책 ${all.length}권 · 메모 ${Object.keys(S.memo).filter(k => S.memo[k]).length}개`);
  h += `<div class="seg">${[["reading", "읽는 중"], ["want", "읽고 싶음"], ["done", "다 읽음"], ["memo", "메모"]].map(([k, v]) => `<button data-sh="${k}" class="${S.shelfTab === k ? "on" : ""}">${v} ${k === "memo" ? Object.keys(S.memo).filter(x => S.memo[x]).length : cnt(k)}</button>`).join("")}</div>`;
  let l;
  if (S.shelfTab === "memo") l = Object.keys(S.memo).filter(k => S.memo[k]).map(id => { const v = S.star[id] || {}; const it = v.item || byId(id) || {}; return { id, t: it.t || id, a: it.a || "", cv: it.cv || "", cv2: it.cv2 || "", r: 0, s: [], memo: S.memo[id] }; });
  else l = all.filter(b => b.st === S.shelfTab).sort((a, b) => (b.at || 0) - (a.at || 0)).map(b => ({ ...b, t: b.t || "", a: b.a || "", s: [] }));
  if (!l.length) return h + `<p class="empty">아직 없어요.<br>책 화면에서 '${S.shelfTab === "memo" ? "내 메모" : STN[S.shelfTab]}'를 눌러 보세요.</p>`;
  if (S.shelfTab === "memo") return h + `<div class="list">${l.map(b => `<button class="li" data-b="${b.id}"><div class="lcv">${cover(b)}</div><div class="bx"><p class="t">${esc(b.t)}</p><p class="s">${esc(b.memo.slice(0, 120))}</p></div></button>`).join("")}</div>`;
  return h + `<div class="shelf">${l.map(b => bk(b, { sub: S.shelfTab === "done" && b.r ? "★".repeat(b.r) : S.shelfTab === "reading" ? tocPct(b.id) : (b.a || "") })).join("")}</div>
    <p class="note">자판기 공통 <a href="../box/">보관함</a>에도 함께 보여요. 구글 로그인하면 폰·PC가 같은 기록을 써요.</p>`;
}

/* ───── 길 찾기 (뒤로가기 = 한 단계 위로, 기록은 안 쌓음) ───── */
const TABS = ["#today", "#find", "#school", "#shelf"];
let navStack = [];
function nav(h, isBack) {
  const cur = location.hash || "#today"; if (h === cur) return paint();
  if (!isBack) { if (TABS.includes(h)) navStack = []; else { navStack.push({ h: cur, y: scrollY }); if (navStack.length > 30) navStack.shift(); } }
  try { history.replaceState(history.state, "", location.pathname + location.search + h); } catch (e) { location.hash = h; return; }
  scrollTo(0, 0); paint();
}
function closeSheet() { const b = document.querySelector(".back"); if (!b) return false; b.remove(); return true; }
function back() {
  if (closeSheet()) return true;
  if (navStack.length) { const o = navStack.pop(); nav(o.h, true); setTimeout(() => scrollTo(0, o.y), 80); return true; }
  const h = location.hash || "#today"; if (h !== "#today") { nav("#today", true); return true; }
  return false;
}
let painting = 0;
async function paint() {
  const h = location.hash || "#today", app = document.getElementById("app"), my = ++painting;
  const tab = h.startsWith("#find") ? "find" : h.startsWith("#school") || h.startsWith("#sc=") ? "school" : h.startsWith("#shelf") ? "shelf" : h.startsWith("#b=") || h.startsWith("#ws=") ? "" : "today";
  document.querySelectorAll("#tabs button").forEach(b => { if (b.dataset.v === tab) b.setAttribute("aria-current", "page"); else b.removeAttribute("aria-current"); });
  let out;
  try {
    if (h.startsWith("#b=")) out = await renderBook(h.slice(3));
    else if (h.startsWith("#ws=")) out = await renderWs(h.slice(4));
    else if (h.startsWith("#sc=")) { const [sh, lid, ed] = h.slice(4).split("@"); out = await renderSchool(sh, ed, lid); }
    else if (h.startsWith("#find")) out = renderFind();
    else if (h.startsWith("#school")) out = renderSchools();
    else if (h.startsWith("#shelf")) out = renderShelf();
    else out = renderToday();
  } catch (e) { out = `<p class="empty">화면을 못 그렸어요<br><small>${esc(e.message)}</small></p>`; console.error(e); }
  if (my !== painting) return;
  app.innerHTML = out;
  const q = document.getElementById("q");
  if (q) { q.addEventListener("input", () => { S.q = q.value; S.lim = 60; clearTimeout(q._t); q._t = setTimeout(() => { const pos = q.selectionStart; paint().then(() => { const q2 = document.getElementById("q"); if (q2) { q2.focus(); try { q2.setSelectionRange(pos, pos); } catch (e) { } } }); }, 250); }); }
  const ta = document.getElementById("bmemo");
  if (ta) ta.addEventListener("input", () => { const id = location.hash.slice(3); if (ta.value.trim()) S.memo[id] = ta.value; else delete S.memo[id]; clearTimeout(ta._t); ta._t = setTimeout(() => save("memo"), 400); });
  document.querySelectorAll("[data-intro]").forEach(el => fillIntro(el.dataset.intro));
  const fm = document.getElementById("fmore"); if (fm) fm.addEventListener("toggle", () => { S.fOpen = fm.open; });
  const yb = document.getElementById("yband"); if (yb) { const on = yb.querySelector(".on"); if (on) yb.scrollLeft = on.offsetLeft - yb.clientWidth / 2; }
  if (h.startsWith("#b=")) { const id = h.slice(3); detail(id).then(d => { if (d) { S.star[id] && (S.star[id].item = itemOf(id, d)); } }).catch(() => { }); }
}
function itemOf(id, d) { const b = byId(id) || {}; return { t: (d && d.t) || b.t || "", a: (d && d.a) || b.a || "", cv: (d && d.cv) || b.cv || "", cv2: (d && d.cv2) || b.cv2 || "" }; }

document.addEventListener("click", async e => {
  const t = e.target.closest("[data-v],[data-go],[data-b],[data-act],[data-fk],[data-ff],[data-sort],[data-vw],[data-st],[data-rate],[data-sh],[data-tc],a[data-ws]"); if (!t) return;
  const d = t.dataset;
  if (t.matches("a[data-ws]")) { e.preventDefault(); return nav(t.getAttribute("href")); }
  if (d.tc != null) { const id = location.hash.slice(3); const m = S.toc[id] || (S.toc[id] = {}); if (t.checked) m[d.tc] = 1; else delete m[d.tc]; if (!Object.keys(m).length) delete S.toc[id]; save("toc");
    if (t.checked && (!S.star[id] || S.star[id].st === "want")) { const dd = await detail(id); S.star[id] = { ...(S.star[id] || {}), at: Date.now(), st: "reading", item: itemOf(id, dd) }; save("star"); }
    t.closest("label").classList.toggle("dn", t.checked); return; }
  if (d.v) { closeSheet(); return nav("#" + d.v); }
  if (d.go) { closeSheet(); return nav(d.go); }
  if (d.b) { e.stopPropagation(); return nav("#b=" + d.b); }
  if (d.fk != null) { const [k, ...v] = d.fk.split(":"); const val = v.join(":"); if (k === "multi") S.f.multi = S.f.multi ? 0 : 1; else S.f[k] = S.f[k] === val ? "" : val; LS.s("filter", S.f); S.lim = 60; return paint(); }
  if (d.ff != null) { const [k, ...v] = d.ff.split(":"); S.f = { [k]: v.join(":") }; S.q = ""; LS.s("filter", S.f); S.lim = 60; return nav("#find"); }
  if (d.sort) { S.sort = d.sort; LS.s("sort", S.sort); return paint(); }
  if (d.vw) { S.view = d.vw; save("view"); return paint(); }
  if (d.sh) { S.shelfTab = d.sh; return paint(); }
  if (d.st) { const id = location.hash.slice(3); const dd = await detail(id); const cur = S.star[id] || {};
    if (cur.st === d.st) { delete S.star[id]; toast("내 책에서 뺐어요"); } else { S.star[id] = { ...cur, at: Date.now(), st: d.st, item: itemOf(id, dd) }; toast(STN[d.st] + "에 넣었어요"); }
    save("star"); return paint(); }
  if (d.rate) { const id = location.hash.slice(3); const cur = S.star[id] || { at: Date.now(), st: "done" }; cur.r = cur.r === +d.rate ? 0 : +d.rate; S.star[id] = cur; save("star"); return paint(); }
  const a = d.act;
  if (a === "back") { if (!back()) nav("#today"); return; }
  if (a === "helpok") { LS.s("helpSeen", 1); return paint(); }
  if (a === "more") { S.lim += 120; return paint(); }
  if (a === "clearf") { S.f = {}; S.q = ""; LS.s("filter", S.f); return paint(); }
  if (a === "think" || a === "share") {
    const id = location.hash.slice(3), dd = await detail(id); const url = location.origin + location.pathname + "#b=" + id;
    if (a === "think") { if (window.vfm && window.vfm.think) window.vfm.think({ app: "book", key: id, title: dd.t + " — " + (dd.a || ""), url }); else toast("생각 남기기를 준비 중이에요"); return; }
    const text = `${dd.t} — ${dd.a || ""}\n${(dd.shorts || []).join(" · ")} 추천\n${url}`;
    if (navigator.share) navigator.share({ title: dd.t, text, url }).catch(() => { }); else { try { await navigator.clipboard.writeText(text); toast("복사했어요"); } catch (x) { } }
  }
});

window.vfmApp = { back, go: h => nav(h), route: paint, top: () => nav("#today") };
(async () => {
  try { await loadTop(); } catch (e) {
    document.getElementById("app").innerHTML = `<div class="top"><h1 class="lt">책</h1></div><p class="empty">아직 책 목록이 없어요.<br>로봇이 처음 목록을 모으는 중이에요 (약 30분).<br><small>${esc(e.message)}</small></p>`; return; }
  paint();
  if (/^#(find|sc=)/.test(location.hash || "")) loadAll().then(() => paint());
  else setTimeout(() => loadAll(), 2500);
})();
</script>
