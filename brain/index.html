<script>
"use strict";
/* ───── 상태 (폰 브라우저에 저장 · 구글 로그인하면 기기끼리 맞춤) ───── */
const LS = { g(k, d) { try { const v = localStorage.getItem("vfm:brain:" + k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
             s(k, v) { try { localStorage.setItem("vfm:brain:" + k, JSON.stringify(v)); } catch (e) { toast("저장 공간이 꽉 찼어요"); } } };
const S = { srs: LS.g("srs", {}), star: LS.g("star", {}), memo: LS.g("memo", {}), nstar: LS.g("nstar", {}), read: LS.g("read", {}), log: LS.g("log", {}),
            per: LS.g("per", 5), color: LS.g("color", 1), depth: LS.g("depth", "s"), view: LS.g("view", "lat"), nick: LS.g("nick", ""), nf: "",
            sread: LS.g("sread", {}), sstar: LS.g("sstar", {}), sf: "" };
function save(k) { LS.s(k, S[k]); }
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
function toast(m) { const t = document.createElement("div"); t.className = "toast"; t.textContent = m; document.body.appendChild(t); setTimeout(() => t.remove(), 2000); }
const getJ = p => fetch("../data/brain/" + p, { cache: "no-cache" }).then(r => { if (!r.ok) throw new Error(p + " " + r.status); return r.json(); });
const DAY = () => Math.floor((Date.now() + 9 * 3600e3) / 864e5);                                  // 한국 날짜 번호
const dstr = n => new Date(n * 864e5).toISOString().slice(0, 10);
function ago(iso) { if (!iso) return ""; const m = Math.round((Date.now() - Date.parse(iso.length <= 16 ? iso + ":00+09:00" : iso)) / 60000); if (!(m >= 0)) return iso.slice(5, 10).replace("-", "/"); if (m < 60) return Math.max(m, 1) + "분 전"; const h = Math.floor(m / 60); if (h < 48) return h + "시간 전"; return Math.floor(h / 24) + "일 전"; }
const shuf = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const IV = [0, 1, 2, 4, 7, 15, 30, 60];                                                           // 상자별 다음 복습까지 날짜
const LOBE_COL = { frontal: "#5B8DEF", parietal: "#34C38F", temporal: "#F5A623", occipital: "#B36AE2", insula: "#FF6B8A", limbic: "#E8C21C", basal: "#2EC4D6", dien: "#F2784B", stem: "#9AA0A6", cerebellum: "#B08860", csf: "#6EC1FF", wm: "#CFCFCF" };
const GROUPS = [
  ["1단계 · 큰 덩어리 12", ["frontal", "parietal", "temporal", "occipital", "hippocampus", "amygdala", "thalamus", "hypothalamus", "cerebellum", "midbrain", "pons", "medulla"]],
  ["묶어 부르는 이름", ["cortex", "limbic", "basal", "brainstem", "diencephalon"]],
  ["전두엽 안", ["prefrontal", "dlpfc", "vmpfc", "ofc", "motor", "sma", "broca"]],
  ["두정엽 안", ["somato", "spl", "ipl", "angular", "precuneus"]],
  ["측두엽·후두엽 안", ["auditory", "wernicke", "fusiform", "parahipp", "temporalpole", "v1"]],
  ["깊이 숨은 피질", ["insula", "acc", "pcc"]],
  ["기저핵 안", ["caudate", "putamen", "pallidus", "accumbens"]],
  ["뇌간의 작은 핵", ["sn", "vta", "lc", "raphe"]],
  ["샘 · 길 · 방", ["pituitary", "pineal", "cc", "fornix", "ventricle", "whitematter"]],
];
let R = {}, RL = [], A = null, NEWS = null, IDX = null, WIKI = null, ORDER = [], ST = null;

/* ───── 자료 ───── */
async function loadAll() {
  const [rg, at] = await Promise.all([getJ("regions.json"), getJ("atlas.json")]);
  RL = rg.regions; ORDER = rg.order; R = Object.fromEntries(RL.map(r => [r.id, r])); A = at; A.lobeOf = rg.lobeOf; A.lobes = rg.lobes; A.credit = rg.credit;
  for (const v of A.views) v.meta = (rg.views.find(x => x.id === v.id) || {});
  // 조각마다 '가장 좁은 부위' (지도에서 눌렀을 때 뜰 이름)
  A.best = {};
  for (const key of A.atoms) {
    let best = null, bn = 1e9;
    for (const r of RL) { if (!hasAtom(r, key)) continue; const n = r.atoms.length + (r.lv === 1 ? 0.5 : 0); if (n < bn) { bn = n; best = r.id; } }
    A.best[key] = best;
  }
  getJ("_index.json").then(x => { IDX = x; if ((location.hash || "").startsWith("#news") && NEWS) paint(); }).catch(() => { });
  getJ("news.json").then(x => { NEWS = x; if (/^#(today|news)?$/.test(location.hash || "") || (location.hash || "").startsWith("#news")) paint(); }).catch(() => { NEWS = { items: [] }; });
  getJ("wiki.json").then(x => { WIKI = x; }).catch(() => { WIKI = {}; });
  getJ("stories.json").then(x => { ST = x; addExp(); const h = location.hash || ""; if (/^(#today|#)?$/.test(h) || h.startsWith("#st")) paint(); }).catch(() => { ST = { items: [] }; });
}
function hasAtom(r, key) { const base = key.split(":")[0]; return r.atoms.some(s => s.includes(":") ? s === key : s === base); }
function atomsOf(id) { const r = R[id]; return r ? A.atoms.filter(k => hasAtom(r, k)) : []; }
function pxIn(view, keys) { let n = 0; for (const k of keys) if (view.atoms[k]) n += view.atoms[k][1]; return n; }
function bestView(id) {
  const ks = atomsOf(id); let best = A.views[0], bn = -1;
  for (const v of A.views) { const n = pxIn(v, ks) * (v.kind === "proj" ? 1.25 : 1); if (n > bn) { bn = n; best = v; } }
  return best;
}
const viewsOf = id => { const ks = atomsOf(id); return A.views.filter(v => pxIn(v, ks) > 0); };
const childrenOf = id => RL.filter(r => r.up.includes(id));

/* ───── 지도 그리기 (평면) ───── */
function mapSvg(view, o = {}) {
  const hl = new Set(o.hl || []), hl2 = new Set(o.hl2 || []);
  const col = o.color != null ? o.color : S.color;
  let s = `<div class="mapw${col ? " col" : ""}" data-view="${view.id}"><svg viewBox="0 0 ${view.w} ${view.h}" role="img" aria-label="${esc(view.name)}"><image href="../data/brain/${view.img}" width="${view.w}" height="${view.h}"/>`;
  let ring = null, hpx = 0;
  for (const k of hl) if (view.atoms[k]) hpx += view.atoms[k][1];
  for (const [k, v] of Object.entries(view.atoms)) {
    const lobe = A.lobeOf[k.split(":")[0]];
    const cls = (o.mark && o.mark[k]) || (hl.has(k) ? "hl" : hl2.has(k) ? "hl2" : "");
    s += `<path class="at ${cls}" data-a="${k}" d="${v[0]}"${col ? ` style="fill:${LOBE_COL[lobe] || "#999"}"` : ""}/>`;
    if (cls === "hl" && hpx < 40 && !ring) ring = v[0];
  }

  } else if (k === "one") q = [{ t: "pick", id: arg }, { t: "tap", id: arg }, { t: "func", id: arg }].filter(x => okType(x.t, x.id));

}

    else if (h === "#st") app.innerHTML = renderStories();
    else if (h.startsWith("#st=")) { app.innerHTML = renderStories(); if (ST) { const sid = h.slice(4); try { history.replaceState(history.state, "", location.pathname + "#st"); } catch (x) { } setTimeout(() => openStory(sid), 0); } }
    else if (h === "#find") { app.innerHTML = `<div class="top"><button class="ib" data-act="back" aria-label="뒤로">‹</button></div>` + head("찾기", "부위 이름·영어·다른 이름, 그리고 소식 제목에서") + `<input class="search" id="fq" type="search" placeholder="예: 해마, amygdala, 도파민" value="${esc(mapQ)}" autofocus><div id="fres"></div>`; const q = document.getElementById("fq"); const run = () => { mapQ = q.value; const t = mapQ.trim().toLowerCase(); const rs = t ? RL.filter(r => [r.ko, r.en, ...r.alt, r.one].join(" ").toLowerCase().includes(t)) : []; const ns = t.length > 1 ? ((NEWS && NEWS.items) || []).filter(p => [p.title, p.ko, p.ksum].join(" ").toLowerCase().includes(t)) : []; document.getElementById("fres").innerHTML = (rs.length ? `<div class="list">${rs.map(r => regionLi(r.id)).join("")}</div>` : "") + ns.slice(0, 30).map(newsCard).join("") || (t ? '<p class="empty">못 찾았어요</p>' : ""); }; q.addEventListener("input", run); run(); }
    else app.innerHTML = renderToday();
  } catch (e) { app.innerHTML = `<p class="empty">못 그렸어요<br><small>${esc(e.message)}</small></p>`; console.error(e); }
  if (!document.querySelector(".back") && !h.startsWith("#s=")) scrollTo(0, y);
}

document.addEventListener("click", async e => {
  const t = e.target.closest("[data-v],[data-go],[data-r],[data-n],[data-st],[data-sf],[data-view],[data-rview],[data-depth],[data-act],[data-grade],[data-pick],[data-per],[data-nf],[data-t3],path.at"); if (!t) return;
  const d = t.dataset;
  if (t.matches("path.at")) {
    if (location.hash.startsWith("#s=") && SES) { const it = SES.q[SES.i]; if (it && it.t === "tap" && !SES.ans) { answer(atomsOf(it.id).includes(d.a), d.a); paint(); } return; }
    if (t.closest(".mini") && !t.closest(".back")) return;
    return tapAtom(d.a, t.closest(".mapw").dataset.view);
  }
  if (d.v) { closeSheet(); SES = null; return nav("#" + d.v); }
  if (d.go) { closeSheet(); if (d.sf != null) S.sf = d.sf; return nav(d.go); }
  if (d.r) { e.stopPropagation(); closeSheet(); return nav("#r=" + d.r); }
  if (d.n) return openNews(d.n);
  if (d.st) { closeSheet(); return openStory(d.st); }
  if (d.sf != null) { S.sf = d.sf; if (D) D.stale("brain"); return paint(); }
  if (d.view) { if (d.view !== "3d") { S.view = d.view; save("view"); } return nav("#map=" + d.view); }
  if (d.rview) { const id = location.hash.slice(3).split("@")[0]; try { history.replaceState(history.state, "", location.pathname + "#r=" + id + "@" + d.rview); } catch (x) { } return paint(); }
  if (d.depth) { S.depth = d.depth; save("depth"); return paint(); }
  if (d.per) { S.per = +d.per; save("per"); return paint(); }
  if (d.nf != null) { S.nf = d.nf; if (D) D.stale("brain"); return paint(); }
  if (d.t3) { const cv = document.getElementById("three"); if (cv && cv._t3) { cv._t3.toggle(d.t3); if (d.t3 !== "reset") t.classList.toggle("pri"); } return; }
  if (d.grade != null) { answer(d.grade === "1"); return next(); }
  if (d.pick) { if (!SES || SES.ans) return; answer(d.pick === SES.q[SES.i].id, d.pick); return paint(); }
  const a = d.act;
  if (a === "back") { if (!back()) nav("#today"); return; }
  if (a === "find") return nav("#find");
  if (a === "helpok") { LS.s("helpSeen", 1); return paint(); }
  if (a === "color") { S.color = S.color ? 0 : 1; save("color"); return paint(); }
  if (a === "reveal") { SES.ans = { shown: 1 }; return paint(); }
  if (a === "next") return next();
  if (a === "quit") { SES = null; navStack = []; return nav(location.hash.includes("today") ? "#today" : "#learn"); }
  if (a === "star") { const id = d.id; if (S.star[id]) delete S.star[id]; else S.star[id] = { at: Date.now(), item: { ko: R[id].ko } }; save("star"); toast(S.star[id] ? "보관함에 넣었어요" : "별표 해제"); return paint(); }
  if (a === "think") { const id = d.id; if (window.vfm && window.vfm.think) window.vfm.think({ app: "brain", key: id, title: R[id].ko + " (" + R[id].en + ")", url: location.origin + location.pathname + "#r=" + id }); return; }
  if (a === "quiz1") { SES = null; if (startSession("one:" + d.id)) { navStack.push({ h: location.hash, y: scrollY }); try { history.replaceState(history.state, "", location.pathname + "#s=one:" + d.id); } catch (x) { } paint(); } return; }
  if (a === "add1") { S.srs[d.id] = { b: 0, f: DAY(), due: DAY(), ok: 0, ng: 0, at: Date.now() }; save("srs"); logIt("n"); toast("오늘 복습에 넣었어요"); return paint(); }
  if (a === "reset1") { S.srs[d.id] = { b: 0, f: S.srs[d.id].f, due: DAY(), ok: 0, ng: 0, at: Date.now() }; save("srs"); toast("오늘 다시 나와요"); return paint(); }
  if (a === "clearread") { S.read = {}; save("read"); toast("지웠어요"); return paint(); }
  if (a === "resetall") { if (!confirm("외우기 진도를 모두 지울까요? (별표·메모는 남아요)")) return; S.srs = {}; save("srs"); S.log = {}; save("log"); pushBoard(); toast("처음부터!"); return paint(); }
  if (a === "nick") { const v = prompt("점수판에 보일 이름", S.nick || ""); if (v != null) { S.nick = v.trim().slice(0, 20); save("nick"); BOARD = null; pushBoard(); setTimeout(loadBoard, 1200); } return; }
  if (a === "leaveboard") { const c = sbClient(); LS.s("noBoard", 1); if (c) { try { await c.from("brain_board").delete().eq("user_id", window.vfmSync.user().id); } catch (x) { } } toast("점수판에서 빠졌어요"); return paint(); }
  if (a === "joinboard") { LS.s("noBoard", 0); BOARD = null; return paint(); }
  const ss = t.closest(".back");
  if (ss && ss.dataset.s) {
    const id = ss.dataset.s, c = ((ST && ST.items) || []).find(x => x.id === id) || {};
    const url = location.origin + location.pathname + "#st=" + id;
    if (a === "sstar") { if (S.sstar[id]) delete S.sstar[id]; else S.sstar[id] = { at: Date.now() }; save("sstar"); t.textContent = S.sstar[id] ? "★ 별표 해제" : "☆ 별표"; toast(S.sstar[id] ? "보관함에 넣었어요" : "별표 해제"); }
    else if (a === "sthink") { if (window.vfm && window.vfm.think) window.vfm.think({ app: "brain", key: "s:" + id, title: c.title, url }); }
    else if (a === "sshare") { const text = `${c.title}\n${c.insight}\n${url}`; if (navigator.share) navigator.share({ title: c.title, text, url }).catch(() => { }); else { try { await navigator.clipboard.writeText(text); toast("복사했어요"); } catch (x) { } } }
    return;
  }
  const sh = t.closest(".back"); if (!sh || !sh.dataset.n) return;
  const id = sh.dataset.n, p = ((NEWS && NEWS.items) || []).find(x => x.id === id) || (S.nstar[id] && S.nstar[id].item) || {};
  if (a === "nstar") { if (S.nstar[id]) delete S.nstar[id]; else { const keep = {}; for (const k of ["src", "lang", "title", "ko", "sum", "ksum", "url", "date", "pub", "rs"]) if (p[k]) keep[k] = p[k]; S.nstar[id] = { at: Date.now(), item: keep }; } save("nstar"); t.textContent = S.nstar[id] ? "★ 별표 해제" : "☆ 별표"; toast(S.nstar[id] ? "보관함에 넣었어요" : "별표 해제"); }
  else if (a === "nthink") { if (window.vfm && window.vfm.think) window.vfm.think({ app: "brain", key: id, title: p.ko || p.title, url: p.url }); }
  else if (a === "nshare") { const text = `${p.ko || p.title}\n${p.url}`; if (navigator.share) navigator.share({ title: p.title, text, url: p.url }).catch(() => { }); else { try { await navigator.clipboard.writeText(text); toast("복사했어요"); } catch (x) { } } }
});

window.vfmApp = { back, go: h => nav(h), route: paint, top: () => { SES = null; nav("#today"); } };
(async () => {
  try { await loadAll(); } catch (e) { document.getElementById("app").innerHTML = `<div class="top"><h1 class="lt">뇌</h1></div><p class="empty">자료를 못 불러왔어요<br><small>${esc(e.message)}</small></p>`; return; }
  if ((location.hash || "").startsWith("#s=")) { try { history.replaceState(history.state, "", location.pathname + "#learn"); } catch (e) { } }
  paint();
  setTimeout(() => { if (window.vfmSync && window.vfmSync.user && window.vfmSync.user()) pushBoard(); }, 4000);
})();
</script>
