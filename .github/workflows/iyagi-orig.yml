name: 이야기 원문 번역 로봇 (주 2회, 토큰 0)

on:
  schedule:
    - cron: "0 17 * * 2,5"      # 한국시간 수·토 새벽 2시 (UTC 화·금 17시)
  workflow_dispatch:
    inputs:
      book:
        description: "특정 책 id (비우면 안 된 책 중 짧은 것부터)"
        required: false

concurrency:
  group: data-iyagi
  cancel-in-progress: false

permissions:
  contents: write
  actions: read

jobs:
  guard:   # GitHub 자체 예약(예비)으로 깨어났는데, 정시 알람(Supabase → 실행 버튼)이 이미 최근에 돌렸으면 건너뜀
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      skip: ${{ steps.g.outputs.skip }}
    steps:
      - id: g
        env:
          GH_TOKEN: ${{ github.token }}
          WINDOW_MIN: "2880"
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then echo "skip=0" >> "$GITHUB_OUTPUT"; exit 0; fi
          ref="${GITHUB_WORKFLOW_REF%%@*}"; wf="${ref##*/}"
          last=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/$wf/runs?per_page=10" --jq "[.workflow_runs[] | select(.id != $GITHUB_RUN_ID) | select(.conclusion == \"success\" or .status == \"in_progress\" or .status == \"queued\") | .created_at][0] // empty" || true)
          if [ -n "$last" ]; then
            age=$(( ($(date +%s) - $(date -d "$last" +%s)) / 60 ))
            echo "지난 실행: $last ($age분 전) · 기준 $WINDOW_MIN분"
            if [ "$age" -lt "$WINDOW_MIN" ]; then echo "skip=1" >> "$GITHUB_OUTPUT"; echo "→ 최근에 이미 돌았으니 건너뜀"; exit 0; fi
          fi
          echo "skip=0" >> "$GITHUB_OUTPUT"
  translate:
    needs: guard
    if: needs.guard.outputs.skip != '1'
    runs-on: ubuntu-latest
    timeout-minutes: 345          # GitHub 무료 러너 최대 6시간
    env:
      TG_MINUTES: "330"           # 원문 번역은 전부 구글 TranslateGemma 로 (문단마다 중간 저장 → 다음 실행에 이어서)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 번역 모델 캐시
        uses: actions/cache@v4
        with:
          path: |
            /tmp/nllb-600m-ct2
            ~/.cache/huggingface
          key: nllb-600m-ct2-v1
      - name: 구글 번역 모델 캐시 (TranslateGemma 4B, 약 2.5GB)
        uses: actions/cache@v4
        with:
          path: /tmp/tgemma
          key: tgemma-4b-q4km-v1
      - name: 라이브러리 설치
        run: |
          pip install -q requests
          pip install -q llama-cpp-python --extra-index-url https://abetlen.github.io/llama-cpp-python/whl/cpu || echo "구글 번역기 설치 실패"
          python -c "import llama_cpp" 2>/dev/null || pip install -q "ctranslate2>=4" "transformers>=4.40" sentencepiece "torch>=2.2" --index-url https://download.pytorch.org/whl/cpu --extra-index-url https://pypi.org/simple
      - name: 번역
        run: python robot/iyagi_translate.py --max-minutes 300 ${{ inputs.book && format('--book {0}', inputs.book) || '' }}
      - name: 저장소에 올리기
        if: always()
        run: |
          git config user.name "iyagi-robot"
          git config user.email "robot@users.noreply.github.com"
          git add data/iyagi/orig
          git diff --cached --quiet && echo "변경 없음" && exit 0
          git commit -m "이야기: 원문 번역 추가 $(TZ=Asia/Seoul date '+%m/%d')"
          for i in 1 2 3; do git pull --rebase --autostash && git push && break || sleep 10; done
