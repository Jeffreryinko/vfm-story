name: 이야기 위키백과 모으기 (매일 새벽 3시 40분 · 클로드 작가 대신, 토큰 0)

# Actions 탭 → 이 작업 → "Run workflow" 를 누르면 돌아요. 자동으로는 돌지 않아요.
# 목록(카탈로그) 약 1,500개를 위키백과에서 모아 data/iyagi/wiki/ 에 정리합니다.
# 시간 안에 다 못 하면 다음에 다시 누르면 이어서 합니다.
on:
  schedule:
    - cron: "40 18 * * *"       # 한국시간 03:40 — 아직 안 모은 이야기를 이어서, 요청 들어온 것 먼저
  workflow_dispatch:
    inputs:
      translate:
        description: "영어 문서 앞부분을 무료 번역 모델로 한국어로 (yes/no)"
        required: false
        default: "yes"
      minutes:
        description: "최대 몇 분 돌릴지"
        required: false
        default: "300"

concurrency:
  group: data-iyagi
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  wiki:
    runs-on: ubuntu-latest
    timeout-minutes: 345
    env:
      TG_MINUTES: "20"      # 구글 번역기(TranslateGemma)에 쓸 시간 — 넘으면 NLLB로 이어서
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 번역 모델 캐시 (원문 번역 로봇과 공유)
        if: (github.event_name == 'schedule' || inputs.translate == 'yes')
        uses: actions/cache@v4
        with:
          path: |
            /tmp/nllb-600m-ct2
            ~/.cache/huggingface
          key: nllb-600m-ct2-v1
      - name: 구글 번역 모델 캐시 (TranslateGemma 4B, 약 2.5GB)
        if: (github.event_name == 'schedule' || inputs.translate == 'yes')
        uses: actions/cache@v4
        with:
          path: /tmp/tgemma
          key: tgemma-4b-q4km-v1
      - name: 라이브러리 설치
        run: |
          pip install -q requests
          if [ "${{ github.event_name == 'schedule' || inputs.translate == 'yes' }}" = "true" ]; then
            pip install -q "ctranslate2>=4" "transformers>=4.40" sentencepiece "torch>=2.2" --index-url https://download.pytorch.org/whl/cpu --extra-index-url https://pypi.org/simple
            pip install -q llama-cpp-python --extra-index-url https://abetlen.github.io/llama-cpp-python/whl/cpu || echo "구글 번역기 설치 실패 — 예전 번역기(NLLB)로"
          fi
      - name: 위키백과에서 모으기
        run: python robot/iyagi_wiki.py --max-minutes ${{ inputs.minutes || '150' }} ${{ (github.event_name == 'schedule' || inputs.translate == 'yes') && '--translate' || '' }}
      - name: 저장소에 올리기
        run: |
          git config user.name "iyagi-robot"
          git config user.email "robot@users.noreply.github.com"
          git add data/iyagi/wiki data/iyagi/_meta.json data/requests.json
          git diff --cached --quiet && echo "변경 없음" && exit 0
          git commit -m "이야기: 위키백과 원문 정리 $(TZ=Asia/Seoul date '+%m/%d')"
          for i in 1 2 3; do git pull --rebase --autostash && git push && break || sleep 10; done
