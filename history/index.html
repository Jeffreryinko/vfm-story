    lnk.innerHTML = hits.map(x => `<button data-open="${x.i}" class="${S.read[x.i] ? "" : "on"}">${esc(x.t)}</button>`).join("") || '<span class="sub">아직 받은 글 중엔 없어요 (로봇이 더 받으면 생겨요)</span>'; }
}
let BOOKLINK = null;
async function bookBox(p) {   // 책 탭과 잇기: 이 글(사람·책)과 맞는 권장도서
  try { if (!BOOKLINK) BOOKLINK = await fetch("../data/book/link.json", { cache: "no-cache" }).then(r => r.ok ? r.json() : { h: {} }); } catch (e) { BOOKLINK = { h: {} }; }
  const l = (BOOKLINK.h || {})[p.id] || []; const el = document.getElementById("bookBox"); if (!el || !l.length || S.page !== p) return;
  el.innerHTML = `<h2 class="sec">이 주제 권장도서 <small>대학·기관이 권한 책</small></h2><div class="chips">${l.slice(0, 12).map(([id, t, a]) => `<a style="text-decoration:none;padding:7px 13px;border-radius:999px;background:var(--ap-fill);font-size:14px;color:var(--ink)" href="../book/#b=${esc(id)}">📖 ${esc(t)}${a ? ` <small>${esc(a)}</small>` : ""}</a>`).join("")}</div>`;
}
function relList(l) { return l.map(x => x.i ? (x.n != null || x.y !== undefined ? card(x) : `<button class="card" data-open="${x.i}"><p class="t">${esc(x.t)}</p></button>`) : x.wiki ? `<a class="card" href="https://ko.wikipedia.org/wiki/${encodeURIComponent(x.wiki.replace(/ /g, "_"))}" target="_blank" rel="noopener" style="text-decoration:none;color:inherit"><p class="t">${esc(x.t)} ↗</p><p class="one">아직 안 받은 글 — 위키백과에서 열기</p></a>` : `<div class="card"><p class="t">${esc(x.t)}</p></div>`).join(""); }

/* ───── 낱말 길게 누르기 ───── */
function openWord(word) {
  const w = word.trim(); const key = "w:" + w.toLowerCase(); const saved = S.words[key];
  const back = document.createElement("div"); back.className = "back";
  back.innerHTML = `<div class="sheet"><h3>${esc(w)}</h3><p class="k">${saved ? "낱말장에 있어요." : "이 말을 메모하거나, 찾아보거나, 낱말장에 저장할 수 있어요."}</p>
    <div class="acts"><button data-a="memo">메모<small>이 말에 내 메모</small></button><button data-a="save">${saved ? "낱말장에 있음 ✓" : "낱말장 저장"}<small>보관함 › 낱말</small></button>
      <button data-a="wiki">위키 미리보기<small>첫 문단만</small></button><button data-a="pages">이 말이 든 글<small>역사 자판기 안에서</small></button><button data-a="tag">태그로 추가<small>${S.page ? "이 글에 #" + esc(w) : "(읽기 화면에서)"}</small></button><button data-a="copy">복사</button></div>
    <div class="row"><a class="btn sm" href="${esc(window.vfm.namu(w))}" target="_blank" rel="noopener">나무위키</a><a class="btn sm" href="https://ko.wikipedia.org/wiki/Special:Search?search=${encodeURIComponent(w)}" target="_blank" rel="noopener">위키백과</a><a class="btn sm" href="https://www.google.com/search?q=${encodeURIComponent(w + " 역사")}" target="_blank" rel="noopener">구글</a><a class="btn sm" href="https://encykorea.aks.ac.kr/Article/Search/${encodeURIComponent(w)}" target="_blank" rel="noopener">민족문화대백과</a></div><div id="wsub"></div></div>`;
  document.body.appendChild(back); const sub = back.querySelector("#wsub");
  const saveWord = () => { const e = S.words[key] || { at: Date.now(), w, pages: {} }; if (S.page) e.pages[S.page.id] = S.page.title; S.words[key] = e; save("words"); };
  back.addEventListener("click", async ev => {
    if (ev.target === back) return back.remove(); const a = ev.target.closest("[data-a]"); if (!a) return; const act = a.dataset.a;
    if (act === "copy") { try { await navigator.clipboard.writeText(w); toast("복사했어요"); } catch (x) { toast("복사 실패"); } }
    else if (act === "save") { saveWord(); a.firstChild.textContent = "낱말장에 있음 ✓"; toast("낱말장에 저장"); }
    else if (act === "memo") { sub.innerHTML = `<textarea class="memo" id="tmemo" placeholder="이 말에 대한 내 메모">${esc(S.tmemo[key] || "")}</textarea><div class="row" style="margin-top:6px"><button class="btn sm pri" data-a="memosave">저장</button></div>`; }
    else if (act === "memosave") { const v = back.querySelector("#tmemo").value.trim(); if (v) { S.tmemo[key] = v; saveWord(); } else delete S.tmemo[key]; save("tmemo"); toast("메모 저장"); }
    else if (act === "wiki") { sub.innerHTML = '<div class="wiki">위키백과 읽는 중…</div>'; sub.querySelector(".wiki").innerHTML = await wikiSummary(w, key); }
    else if (act === "pages") { sub.innerHTML = '<p class="note">찾는 중…</p>'; const bk = await bucket(sbucket(w)); const hits = bk.list.filter(x => x[0].includes(w)).slice(0, 20); sub.innerHTML = hits.length ? `<div class="list">${hits.map(x => liRow(sRow(x))).join("")}</div>` : '<p class="empty">이 말로 시작하는 제목이 없어요. 탐색에서 ‘전부 찾기’를 써 보세요.</p>'; }
    else if (act === "tag") { if (!S.page) return toast("읽기 화면에서 쓸 수 있어요"); addTag(S.page.id, w); back.remove(); toast("태그 추가"); }
  });
}
async function wikiSummary(w, key) {
  for (const lang of ["ko", "en"]) {
    try { const r = await fetch(`https://${lang}.wikipedia.org/api/rest_v1/page/summary/${encodeURIComponent(w.replace(/ /g, "_"))}`); if (!r.ok) continue; const j = await r.json(); if (!j.extract) continue;
      if (S.words[key]) { S.words[key].wiki = j.extract; save("words"); }
      return `<b>${esc(j.title)}</b>${lang === "en" ? ' <span class="sub">(영문판)</span>' : ""}<br>${esc(j.extract)} <a href="${esc(j.content_urls.desktop.page)}" target="_blank" rel="noopener">더 →</a>`; } catch (e) { }
  }
  return "위키백과에 없어요.";
}
function addTag(id, tag) { const l = S.tags[id] || []; if (!l.includes(tag)) l.push(tag); S.tags[id] = l; save("tags"); if (!S.tagdefs.includes(tag)) { S.tagdefs.push(tag); save("tagdefs"); } if (S.star[id]) { S.star[id].tags = l; save("star"); } }
function tagSheet(id) {
  const back = document.createElement("div"); back.className = "back"; const cur = S.tags[id] || [];
  back.innerHTML = `<div class="sheet"><h3>태그</h3><div class="chips">${S.tagdefs.map(t => `<button data-t="${esc(t)}" class="${cur.includes(t) ? "on" : ""}">${esc(t)}</button>`).join("")}</div><div class="row"><input class="search" id="newtag" placeholder="새 태그" style="flex:1;margin:0"><button class="btn" data-a="add">추가</button><button class="btn" data-a="close">닫기</button></div></div>`;
  document.body.appendChild(back);
  back.addEventListener("click", e => {
    if (e.target === back) return back.remove(); const b = e.target.closest("button"); if (!b) return;
    if (b.dataset.t) { const l = S.tags[id] || []; const i = l.indexOf(b.dataset.t); if (i >= 0) l.splice(i, 1); else l.push(b.dataset.t); S.tags[id] = l; save("tags"); b.classList.toggle("on"); if (S.star[id]) { S.star[id].tags = l; save("star"); } }
    else if (b.dataset.a === "add") { const v = back.querySelector("#newtag").value.trim(); if (v) { addTag(id, v); back.remove(); tagSheet(id); } }
    else if (b.dataset.a === "close") { back.remove(); route(); }
  });
}

/* ───── 설정 ───── */
function cfgSheet() {
  const back = document.createElement("div"); back.className = "back"; const bu = S.idx.budget || {};
  back.innerHTML = `<div class="sheet"><h3>역사 탭 설정</h3><div class="acts">
    <button data-a="fs">글자 크기: ${Math.round((S.cfg.fs || 1) * 100)}%<small>누를 때마다 (90→100→110→125)</small></button><button data-a="pics">사진: ${S.cfg.pics ? "보임" : "숨김"}<small>위키백과 대표 사진</small></button>
    <button data-a="hr">읽은 글: ${S.cfg.hideRead ? "탐색에서 숨김" : "흐리게만"}</button><button data-a="depth">기본 읽기: ${{ short: "짧게", more: "자세히", deep: "깊게" }[S.depth] || "짧게"}<small>글을 열 때 처음 보이는 깊이</small></button>
    <button data-a="export">내 기록 내보내기<small>별표·메모·태그·낱말·읽음</small></button><button data-a="hidden">숨긴 글 ${Object.keys(S.hide).length}개 되살리기</button></div>
    <p class="k">로봇: 매일 새벽 5시 (남은 게 있으면 이어서) · 마지막 갱신 ${esc((S.idx.at || "").slice(0, 16).replace("T", " "))}<br>받은 글 ${((S.idx.counts || {}).total || 0).toLocaleString()}편 (전문 ${((S.idx.counts || {}).full || 0).toLocaleString()}) · 받을 차례 ${(S.idx.queue || 0).toLocaleString()}편 · 역사 글 아니라서 뺀 것 ${(S.idx.skipped || 0).toLocaleString()}편 · 저장 용량 ${bu.usedMB || 0} / ${bu.limitMB || 0} MB</p>
    <div class="row"><button class="btn" data-a="close">닫기</button></div></div>`;
  document.body.appendChild(back);
  back.addEventListener("click", e => {
    if (e.target === back) return back.remove(); const a = e.target.closest("[data-a]"); if (!a) return;
    if (a.dataset.a === "fs") { const st = [0.9, 1, 1.1, 1.25]; S.cfg.fs = st[(st.indexOf(S.cfg.fs || 1) + 1) % st.length]; save("cfg"); document.documentElement.style.setProperty("--fs", S.cfg.fs); a.firstChild.textContent = `글자 크기: ${Math.round(S.cfg.fs * 100)}%`; }
    else if (a.dataset.a === "pics") { S.cfg.pics = !S.cfg.pics; save("cfg"); back.remove(); route(); }
    else if (a.dataset.a === "hr") { S.cfg.hideRead = !S.cfg.hideRead; save("cfg"); back.remove(); route(); }
    else if (a.dataset.a === "depth") { const st = ["short", "more", "deep"]; S.depth = st[(st.indexOf(S.depth) + 1) % 3]; save("depth"); a.firstChild.textContent = `기본 읽기: ${{ short: "짧게", more: "자세히", deep: "깊게" }[S.depth]}`; }
    else if (a.dataset.a === "export") exportMine();
    else if (a.dataset.a === "hidden") { S.hide = {}; save("hide"); toast("숨긴 글을 되살렸어요"); back.remove(); route(); }
    else if (a.dataset.a === "close") back.remove();
  });
}
function exportMine() {
  const out = { app: "vendingForMe", part: "history", exportedAt: new Date().toISOString(), star: S.star, memo: S.memo, tags: S.tags, tagdefs: S.tagdefs, read: S.read, recent: S.recent, words: S.words, tmemo: S.tmemo, ep: S.ep };
  const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([JSON.stringify(out, null, 1)], { type: "application/json" })); a.download = "자판기-역사-기록-" + new Date().toISOString().slice(0, 10) + ".json"; a.click(); toast("내보냈어요");
}

/* ───── 낱말 선택 → 떠 있는 막대 ───── */
let selBar = null, selTimer = null;
document.addEventListener("selectionchange", () => {
  const sel = document.getSelection(); const txt = sel ? sel.toString().trim() : ""; clearTimeout(selTimer);
  if (!txt || txt.length > 40 || !S.page) { selTimer = setTimeout(() => { if (selBar) { selBar.remove(); selBar = null; } }, 500); return; }
  if (selBar) { selBar.remove(); selBar = null; }
  const n = sel.anchorNode && sel.anchorNode.parentElement; if (!n || !n.closest("#body, .title, .oneb, .lead")) return;
  selBar = document.createElement("button"); selBar.className = "selbar"; selBar.textContent = "“" + txt + "” 메모·검색·저장";
  selBar.addEventListener("click", () => { clearTimeout(selTimer); const t = txt; try { document.getSelection().removeAllRanges(); } catch (x) { } if (selBar) selBar.remove(); selBar = null; openWord(t); });
  document.body.appendChild(selBar);
});

/* ───── 라우팅·클릭 ───── */
function setTab(v) { document.querySelectorAll("nav.tabs button").forEach(b => b.setAttribute("aria-current", b.dataset.v === v ? "page" : "false")); }
async function route() {
  const h = location.hash || "#today"; document.querySelector(".rbar")?.remove();
  setTimeout(() => HP.pill(), 80);                                    // 이야기에서 나왔으면 ‘돌아가기’ 단추
  if (h.startsWith("#p=")) { setTab(""); document.getElementById("tabs").hidden = true; return renderPage(decodeURIComponent(h.slice(3))); }
  if (h.startsWith("#ts") && window.VFM_TS) { setTab(""); document.getElementById("tabs").hidden = true; S.page = null; return VFM_TS.render(h); }
  if (h.startsWith("#ep=")) { setTab(""); document.getElementById("tabs").hidden = true; S.page = null; return HP.render(decodeURIComponent(h.slice(4))); }
  document.getElementById("tabs").hidden = false; document.body.classList.remove("reading"); S.page = null;
  const v = h.slice(1).split("?")[0]; setTab(v);
  if (v === "back") setTab("series");
  if (v === "explore") renderExplore(); else if (v === "back") renderBack(); else if (v === "series") renderSeries(); else if (v === "shelf") renderShelf(); else renderToday();
}
window.vfmApp = { back: histBack, go: h => nav(h, true), push: h => nav(h), route, top: () => nav("#today") };
window.addEventListener("hashchange", route);
document.addEventListener("click", async e => {
  const t = e.target.closest("[data-v],[data-open],[data-act],[data-f],[data-bm],[data-sm],[data-stag],[data-depth],[data-rel],[data-word],[data-goc],[data-xm],[data-se],[data-sw],[data-lc],[data-life-era],[data-goera],[data-hmood],[data-bmgo]"); if (!t) return;
  const d = t.dataset;
  if (d.hmood) { S.mood = d.hmood; save("mood"); document.querySelectorAll("[data-hmood]").forEach(b => b.setAttribute("aria-pressed", b.dataset.hmood === S.mood)); return moodList(); }
  if (d.bmgo) { backMode = d.bmgo; nav("#back"); return; }
  if (d.xm) { F.mode = d.xm; return renderExplore(); }
  if (d.se) { F.se = +d.se; F.sfrom = null; return renderSync(); }
  if (d.sw) { const er = SYNC_ERAS[F.se]; F.sfrom = Math.max(er[1], Math.min(er[2] - er[3], F.sfrom + (+d.sw) * er[3])); return renderSync(); }
  if (d.lc) { F.lc = d.lc; return renderLife(); }
  if (d.lifeEra != null) { Object.assign(F, { mode: "find", region: "", country: F.lc, era: +d.lifeEra, theme: -2, kind: "", tag: "", shown: 0, sort: "year" }); return renderExplore(); }
  if (d.goera != null) { Object.assign(F, { mode: "sync", se: +d.goera, sfrom: null }); nav("#explore"); return; }
  if (d.v) { nav("#" + d.v); return; }
  if (d.open) return openPage(d.open);
  if (d.word) return openWord((S.words[d.word] || {}).w || d.word.slice(2));
  if (d.goc) { Object.assign(F, { region: "", country: d.goc, era: -2, theme: -2, kind: "", tag: "", shown: 0 }); nav("#explore"); return; }
  if (d.f) { F.shown = 0;
    if (d.f === "reset") { Object.assign(F, { region: "", country: "", era: -2, theme: -2, kind: "", tag: "", q: "", timeline: false }); return renderExplore(); }
    if (d.f === "timeline") { F.timeline = !F.timeline; return renderExplore(); }
    if (d.f === "region") { F.region = F.region === d.val ? "" : d.val; F.country = ""; return renderExplore(); }
    if (d.f === "era" || d.f === "theme") { const v = +d.val; F[d.f] = F[d.f] === v ? -2 : v; return renderExplore(); }
    if (d.f === "sort") F.sort = d.val; else F[d.f] = F[d.f] === d.val ? "" : d.val;
    return renderExplore(); }
  if (d.bm) { backMode = d.bm; return renderBack(); }
  if (d.sm) { shelfMode = d.sm; return renderShelf(); }
  if (d.stag) { F.stag = F.stag === d.stag ? "" : d.stag; return renderShelf(); }
  if (d.depth) { S.depth = d.depth; save("depth"); return renderPage(S.page.id); }
  if (d.rel) { const lists = (document.getElementById("rel") || {})._lists || {}; const l = lists[d.rel] || []; const box = document.getElementById("relBox"); if (!box) return;
    box.innerHTML = l.length ? `<p class="lbl">${{ prev: "그 이전", next: "그 이후", people: "관련 인물·사건", near: "같은 시기 다른 나라" }[d.rel]}</p>${relList(l)}` : '<p class="note">없어요</p>'; return; }
  if (d.act === "back") { if (!histBack()) nav("#today"); return; }
  if (d.act === "morex") return runExplore();
  if (d.act === "searchall") { e.preventDefault(); F.all = true; return runSearch(); }
  if (d.act === "cfg") return cfgSheet();
  if (d.act === "search") { nav("#explore"); setTimeout(() => document.getElementById("xq")?.focus(), 300); return; }
  if (d.act === "export") return exportMine();
  const p = S.page; if (!p) return; const id = p.id;
  if (d.act === "live") return loadLive(p, S.depth === "deep");
  if (d.act === "think") { if (window.vfm && window.vfm.think) window.vfm.think({ app: "history", key: id, title: p.title, url: "history/#p=" + id }); return; }
  if (d.act === "star") { if (S.star[id]) { delete S.star[id]; toast("별표 해제"); } else { S.star[id] = { at: Date.now(), item: entryOf(p), memo: S.memo[id] || "", tags: S.tags[id] || [] }; toast("별표"); } save("star"); renderPage(id); }
  else if (d.act === "hide") { S.hide[id] = 1; save("hide"); toast("목록에서 숨겼어요 (설정에서 되살리기)"); histBack() || nav("#today"); }
  else if (d.act === "tag") tagSheet(id);
  else if (d.act === "share") { const text = `${p.title} (${span(entryOf(p))})\n${p.one}\n${p.src.url}${S.memo[id] ? "\n메모: " + S.memo[id] : ""}`; if (navigator.share) navigator.share({ title: p.title, text, url: p.src.url }).catch(() => { }); else { try { await navigator.clipboard.writeText(text); toast("복사했어요"); } catch (x) { } } }
});

/* ───── 시작 ───── */
(async () => {
  try { await loadIndex(); } catch (e) { document.getElementById("app").innerHTML = `<div class="top"><h1 class="lt">역사</h1></div><p class="empty">아직 자료가 없어요. 로봇이 처음 돌고 나면 채워집니다.<br><small>${esc(e.message)}</small></p>`; return; }
  route();
  window.vfm = window.vfm || {}; window.vfm.historyExport = exportMine;
})();
</script>
