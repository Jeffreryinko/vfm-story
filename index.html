<!doctype html>
<html lang="ko" class="ap ap-home">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F2F2F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="assets/icon-192.png">
<title>이야기 자판기</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="assets/apple.css">
<style>
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;padding:calc(env(safe-area-inset-top,0px) + 18px) max(16px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 32px) max(16px,env(safe-area-inset-left,0px))}
  .wrap{max-width:560px;margin:0 auto}
  .date{margin:8px 4px 0;font-size:13px;font-weight:600;color:var(--ap-label2);text-transform:uppercase;letter-spacing:.02em}
  h1{margin:2px 4px 14px;font:800 34px/1.15 var(--ap-display);letter-spacing:-.03em}
  .apps{display:grid;gap:12px}
  .app{display:grid;grid-template-columns:64px 1fr auto;align-items:center;gap:14px;width:100%;padding:16px;border:0;border-radius:22px;background:var(--ap-surface);color:inherit;text-align:left;cursor:pointer;
    font:inherit;-webkit-tap-highlight-color:transparent;transition:transform .15s ease}
  .app:active{transform:scale(.97)}
  .ic{width:64px;height:64px;border-radius:15px;display:grid;place-items:center;color:#fff;box-shadow:inset 0 0 0 .5px rgba(0,0,0,.08)}
  .ic svg{width:34px;height:34px}
  .ic.sisa{background:linear-gradient(160deg,#4FA3FF 0%,#0A6CFF 55%,#0050C8 100%)}
  .ic.mental{background:linear-gradient(160deg,#8C8AF5 0%,#5856D6 55%,#3D3BB0 100%)}
  .ic.baedat{background:linear-gradient(160deg,#FF7A70 0%,#FF3B30 55%,#D70015 100%)}
  .ic.iyagi{background:linear-gradient(160deg,#FFC24D 0%,#FF9500 55%,#F26B00 100%)}
  .ic.ai{background:linear-gradient(160deg,#D68CFF 0%,#A346F0 55%,#6E2BD9 100%)}
  .ic.history{background:linear-gradient(160deg,#C9A57A 0%,#A2845E 55%,#7A5F3E 100%)}
  .ic.tools{background:linear-gradient(160deg,#6FDCEB 0%,#30B0C7 55%,#0A7A8C 100%)}
  .ic.brain{background:linear-gradient(160deg,#FF9DBD 0%,#E0457B 55%,#A3124A 100%)}
  .ic.book{background:linear-gradient(160deg,#7FD98E 0%,#34A853 55%,#1B6E33 100%)}
  .ic.box{background:linear-gradient(160deg,#9DA3AF 0%,#6B7280 55%,#4B5160 100%)}
  .nm{font:700 20px/1.2 var(--ap-display);letter-spacing:-.02em;margin:0}
  .ds{font-size:14px;color:var(--ap-label2);margin:3px 0 0;line-height:1.35}
  .st{display:flex;align-items:center;gap:6px;white-space:nowrap;overflow:hidden;font-size:13px;color:var(--ap-label2);margin:7px 0 0}
  .st i{width:7px;height:7px;border-radius:50%;background:var(--ap-label3);flex:none}.st i.ok{background:var(--ap-green)}.st i.old{background:var(--ap-orange)}
  .st b{color:var(--ap-label);font-weight:600}
  .chev{color:var(--ap-label3);font-size:22px;font-weight:300}
  .last{margin:4px 0 0;font-size:12px;color:var(--ap-label2)}
  .cap{margin:28px 16px 6px;font-size:13px;color:var(--ap-label2)}
  .grp{background:var(--ap-surface);border-radius:12px;overflow:hidden}
  .grp button{display:flex;justify-content:space-between;align-items:center;width:100%;min-height:46px;padding:11px 16px;border:0;background:none;color:var(--ap-label);font:inherit;font-size:16px;text-align:left;position:relative;cursor:pointer}
  .grp button+button::before{content:"";position:absolute;left:16px;right:0;top:0;height:.5px;background:var(--ap-sep)}
  .grp button span{color:var(--ap-label3);font-size:20px}
  .foot{margin:10px 16px 0;font-size:12.5px;color:var(--ap-label2);line-height:1.5}
  .plan{background:var(--ap-surface);border-radius:12px;overflow:hidden}
  .plan .it{padding:11px 16px;position:relative}
  .plan .it+.it::before{content:"";position:absolute;left:16px;right:0;top:0;height:.5px;background:var(--ap-sep)}
  .plan .t{font-size:15.5px;font-weight:600;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .plan .d{font-size:13px;color:var(--ap-label2);margin-top:3px;line-height:1.4}
  .plan .tag{font-size:11.5px;font-weight:600;padding:2px 7px;border-radius:99px;background:var(--ap-fill,rgba(120,120,128,.16));color:var(--ap-label2)}
  .plan .tag.me{background:rgba(255,149,0,.16);color:#C26A00}
</style>
</head>
<body>
<script>window.VFM_APP = "home"; window.VFM_KINDS = ["story", "wiki", "brain"];</script>
<script src="assets/claude-shim.js"></script>
<script src="assets/deck.js"></script>
<script src="assets/trendcard.js"></script>
<div class="wrap">
  <p class="date" id="date"></p>
  <h1>이야기 자판기</h1>
  <div id="mix"></div>
  <p class="cap" style="margin-top:6px">앱 바로가기</p>
  <div class="apps">
    <button class="app" data-app="iyagi">
      <span class="ic iyagi"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"><path d="M12 6.5C10 5 7.2 4.5 4 4.8v13.4c3.2-.3 6 .2 8 1.7 2-1.5 4.8-2 8-1.7V4.8c-3.2-.3-6 .2-8 1.7z"/><path d="M12 6.5v13.4"/></svg></span>
      <span><p class="nm">이야기</p><p class="ds">신화·소설·인물 이야기</p><p class="st" id="st-iyagi"><i></i><span>불러오는 중</span></p></span>
      <span class="chev">›</span>
    </button>
    <button class="app" data-app="history">
      <span class="ic history"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9.5L12 4l9 5.5"/><path d="M4.5 9.5h15"/><path d="M6.5 10v7M10 10v7M14 10v7M17.5 10v7"/><path d="M4 17.5h16M3 20.5h18"/></svg></span>
      <span><p class="nm">역사</p><p class="ds">세계 역사 이야기, 나라·시대별</p><p class="st" id="st-history"><i></i><span>불러오는 중</span></p></span>
      <span class="chev">›</span>
    </button>
    <button class="app" data-app="brain">
      <span class="ic brain"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M9 4.5a3 3 0 0 0-3 3 3 3 0 0 0-2 5 3 3 0 0 0 2 5 3 3 0 0 0 5 1.5V5.5A2.5 2.5 0 0 0 9 4.5z"/><path d="M15 4.5a3 3 0 0 1 3 3 3 3 0 0 1 2 5 3 3 0 0 1-2 5 3 3 0 0 1-5 1.5V5.5A2.5 2.5 0 0 1 15 4.5z"/><path d="M6 12.5h3M15 12.5h3"/></svg></span>
      <span><p class="nm">뇌</p><p class="ds">뇌 부위 52개 외우기 · 뇌과학 소식</p><p class="st" id="st-brain"><i></i><span>불러오는 중</span></p></span>
      <span class="chev">›</span>
    </button>
    <button class="app" data-app="book">
      <span class="ic book"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20v15H6.5A2.5 2.5 0 0 0 4 20.5z"/><path d="M4 20.5A2.5 2.5 0 0 0 6.5 23H20v-5"/><path d="M8 7h8M8 10.5h6"/></svg></span>
      <span><p class="nm">책</p><p class="ds">대학·기관 권장도서 · 목차·표지·전자책</p><p class="st" id="st-book"><i></i><span>불러오는 중</span></p></span>
      <span class="chev">›</span>
    </button>
    <button class="app" data-app="box">
      <span class="ic box"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h16v11a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1z"/><path d="M3 4h18v4H3z"/><path d="M10 12h4"/></svg></span>
      <span><p class="nm">보관함</p><p class="ds">모든 앱에서 저장한 것 · 내 질문 · 이번 주 생각</p><p class="st" id="st-box"><i class="ok"></i><span id="boxN">이 폰 안에만 있어요</span></p></span>
      <span class="chev">›</span>
    </button>
  </div>
  <p class="cap">다른 자판기</p>
  <div class="apps">
    <button class="app" data-app="/vendingForMe"><span class="ic box"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M7 17 17 7M9 7h8v8"/></svg></span><span><p class="nm">시사 자판기</p><p class="ds">세계 뉴스 · AI · 도구</p></span><span class="chev">›</span></button>
    <button class="app" data-app="/vfm-mind"><span class="ic box"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M7 17 17 7M9 7h8v8"/></svg></span><span><p class="nm">사람 자판기</p><p class="ds">배댓 · 맨탈</p></span><span class="chev">›</span></button>
  </div>
  <p class="last" id="last"></p>

  <p class="cap">예정 <span id="planAt"></span></p>
  <div class="plan" id="plan"><div class="it"><div class="d">불러오는 중</div></div></div>

  <p class="cap">설정</p>
  <div class="grp">
    <button data-act="settings">구글 로그인 · 폰·PC 이어 보기<span>›</span></button>
    <button data-act="settings">갱신 시각·출처 상태<span>›</span></button>
    <button data-act="export">기록 내보내기<span>›</span></button>
    <button data-act="settings">기록 불러오기<span>›</span></button>
  </div>
  <p class="foot">읽은 기록·별표·메모는 이 폰 브라우저 안에 저장돼요. 구글로 로그인하면 PC와 이어져요.<br>홈 화면에 추가하면 앱처럼 열려요 (브라우저 메뉴 → 홈 화면에 추가).</p>
</div>
<script>
(function () {
  "use strict";
  var W = ["일", "월", "화", "수", "목", "금", "토"], d = new Date();
  document.getElementById("date").textContent = (d.getMonth() + 1) + "월 " + d.getDate() + "일 " + W[d.getDay()] + "요일";
  function ago(iso) {
    if (!iso) return ""; var m = Math.round((Date.now() - Date.parse(iso)) / 60000);
    if (m < 1) return "방금"; if (m < 60) return m + "분 전"; var h = Math.floor(m / 60); if (h < 48) return h + "시간 전"; return Math.floor(h / 24) + "일 전";
  }
  function j(p) { return fetch(p, { cache: "no-cache" }).then(function (r) { return r.ok ? r.json() : null; }).catch(function () { return null; }); }
  function paint(app, iso, html, oldH) {
    var el = document.getElementById("st-" + app); if (!el) return;
    var i = el.querySelector("i"), s = el.querySelector("span");
    if (!iso) { i.className = ""; s.textContent = "아직 자료 없음"; return; }
    i.className = (Date.now() - Date.parse(iso)) > oldH * 3600e3 ? "old" : "ok";
    s.innerHTML = html + " · " + ago(iso);
  }
  function n(x) { return (x || 0).toLocaleString(); }
  j("data/roadmap.json").then(function (r) {
    var box = document.getElementById("plan"); if (!box) return;
    if (!r || !r.items || !r.items.length) { box.innerHTML = '<div class="it"><div class="d">예정된 일이 없어요</div></div>'; return; }
    var NM = { mental: "맨탈", baedat: "배댓", sisa: "시사", iyagi: "이야기", ai: "AI", history: "역사", tools: "도구", brain: "뇌", book: "책" };
    function e(x) { return String(x || "").replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }
    box.innerHTML = r.items.map(function (it) {
      return '<div class="it"><div class="t"><span class="tag">' + e(NM[it.app] || it.app) + '</span>' + e(it.t) + (it.who === "me" ? '<span class="tag me">내가 할 일</span>' : "") + '</div><div class="d">' + e(it.d) + "</div></div>";
    }).join("");
    document.getElementById("planAt").textContent = r.updatedAt ? "· " + ago(r.updatedAt) + " 정리" : "";
  });
  j("data/iyagi/_meta.json").then(function (m) { paint("iyagi", m && m.updatedAt, m ? "<b>새 이야기 " + n(m.stories) + "편</b>" : "", 30); });
  j("data/history/_index.json").then(function (x) { var c = (x && x.counts) || {}; paint("history", x && x.at, x ? "<b>" + n(c.total) + "편</b>" + (x.queue >= 200 ? " · 받는 중" : "") : "", 30); });
  j("data/brain/_index.json").then(function (x) {
    var learned = 0, due = 0, today = Math.floor((Date.now() + 9 * 3600e3) / 864e5);
    try { var s = JSON.parse(localStorage.getItem("vfm:brain:srs") || "{}"); Object.keys(s).forEach(function (k) { if (s[k].b >= 3) learned++; if (s[k].due <= today) due++; }); } catch (e) { }
    paint("brain", x && x.at, "<b>외움 " + learned + "/52</b>" + (due ? " · 복습 " + due : "") + (x ? " · 새 소식 " + n(x.new) : ""), 18);
  });
  j("data/book/_index.json").then(function (x) {
    var mine = 0, rd = 0; try { var s = JSON.parse(localStorage.getItem("vfm:book:star") || "{}"); Object.keys(s).forEach(function (k) { mine++; if (s[k].st === "reading") rd++; }); } catch (e) { }
    paint("book", x && x.at, x ? "<b>" + n(x.total) + "권</b> · 목차 " + n(x.withToc) + (rd ? " · 읽는 중 " + rd : "") : "", 50);
  });
  try { var nq = JSON.parse(localStorage.getItem("vfm:box:qs") || "[]").length, nt = JSON.parse(localStorage.getItem("vfm:box:think") || "[]").length; if (nq || nt) document.getElementById("boxN").textContent = "질문 " + nq + " · 생각 " + nt; } catch (e) { }
  var NAME = { sisa: "시사", iyagi: "이야기", ai: "AI", history: "역사", tools: "도구", brain: "뇌", book: "책", baedat: "배댓", mental: "맨탈" }, lastApp = null;
  try { lastApp = localStorage.getItem("vfm:tab"); } catch (e) { }
  if (NAME[lastApp]) document.getElementById("last").innerHTML = "&nbsp;지난번에 본 곳: " + NAME[lastApp];

  document.addEventListener("click", function (e) {
    var a = e.target.closest("[data-app]");
    if (a) { try { sessionStorage.setItem("vfm:fromHome", "1"); } catch (x) { } location.href = a.getAttribute("data-app") + "/"; return; }
    var b = e.target.closest("[data-act]"); if (!b) return;
    if (b.getAttribute("data-act") === "export") {
      var data = JSON.stringify(window.vfm.exportAll());
      var l = document.createElement("a"); l.href = URL.createObjectURL(new Blob([data], { type: "application/json" }));
      l.download = "vendingForMe-기록-" + new Date().toISOString().slice(0, 10) + ".json"; l.click(); window.vfm.toast && window.vfm.toast("내보냈어요");
    } else window.vfm.openSettings();
  });
})();
</script>
<script src="assets/mix.js"></script>
<script src="assets/shell.js"></script>
</body>
</html>
